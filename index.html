 desc:"Continuation of the Kuttenberg dentist's task. After helping with the initial collection job, the dentist has a new problem: a patient has gone missing before paying, and some of his pulled teeth have also been stolen — apparently by someone who believes powdered human teeth have alchemical properties.",
 tip:"Track down the missing patient first — he's in the lower market district. The alchemist collecting teeth for potions is nearby. A quick task with a funny resolution.",status:0,notes:""},
{id:"t27",r:"Kuttenberg",tp:"Task",o:8,name:"High Toll",m:false,hm:false,t:false,b:true,l:false,
 desc:"A toll blockade on the road near Kuttenberg is causing problems for travellers. Soldiers are charging inflated rates. To resolve the dispute, Henry must obtain a writ from the soldiers' commanding officer. Note: the blockade camp only appears after starting the 'Return to Ruthard Palace' objective in Oratores (MQ). If the camp location looks empty, continue the main quest first. Speak to the soldiers' commander at the camp and either negotiate, find documentation proving the toll is illegal, or pay off the soldiers.",
 tip:"Gated by Oratores progress — if the camp is empty, progress the main quest first. The commander's writ resolves the blockade. Straightforward once the camp appears.",status:0,notes:""},
{id:"t28",r:"Kuttenberg",tp:"Task",o:9,name:"Warding Off Evil",m:false,hm:false,t:false,b:false,l:false,
 desc:"An elderly woman in Miskowitz is convinced her neighbour is a witch whose curse has been souring her milk, wilting her garden, and making her chickens stop laying. She asks Henry to perform a ward — or expose the so-called witch. Investigation reveals the neighbour is not a witch at all, but has been using herbs from her garden that are leaching into the shared well. Henry can explain the truth or perform a theatrical 'warding ritual' to satisfy the old woman without embarrassing anyone.",
 tip:"The theatrical ritual (lie charitably) is actually the funniest and most satisfying option — Henry hams it up, the old woman is delighted, and the neighbour is quietly grateful. No Speech check required for either resolution.",status:0,notes:""},
{id:"t29",r:"Kuttenberg",tp:"Task",o:10,name:"Under the Straw Hat",m:true,hm:true,t:false,b:false,l:false,
 desc:"During 'Into the Underworld', bathhouse owner Adam tips Henry that the monks of Sedletz Monastery are hiring day labourers for their gardens and harvest. Henry can get hired by speaking to the Monastery's lay brother at the Kuttenberg market and passing a simple interview. Working at the monastery gives disguised access to its restricted garden areas — critical for In Vino Veritas's monastery infiltration objective and for exploring Sedletz before Dancing with the Devil locks monastery relations.",
 tip:"🔴 HIGHLY MISSABLE: Only triggered during 'Into the Underworld' via Adam at the bathhouse. Once you advance past this quest window, the hiring opportunity closes permanently. Completing it makes In Vino Veritas's monastery objective trivially easy and gives early access to Sedletz loot.",status:0,notes:""},
{id:"t30",r:"Kuttenberg",tp:"Task",o:11,name:"Mark of the Brotherhood",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry is approached by a representative of a secretive guild brotherhood operating beneath Kuttenberg's legitimate trade guilds — an underground fraternity of craftsmen who share knowledge and resources outside official channels. To gain entry, Henry must prove himself through a series of tests: a craft challenge (Craftsmanship 8+ or using a specific technique the representative hints at), a loyalty oath, and recovering a stolen token from a rival brotherhood member.",
 tip:"The craft challenge is the most demanding part — Craftsmanship 8 is needed unless you ask the representative about 'the old method' (a dialogue option that opens with Speech 6+), which gives an easier alternative test. Joining the brotherhood opens a unique fence and discounted supplies in Kuttenberg.",status:0,notes:""},
{id:"t31",r:"Kuttenberg",tp:"Task",o:12,name:"Last Will",m:false,hm:false,t:false,b:true,l:false,
 desc:"Requires Ars Dimicatoria completed. Quest giver: Menhard at the Kuttenberg Swordfighting Guild (ask if he has work). He directs Henry to Widow Gerda nearby — her late husband left debts, and his rival Radmil is claiming what she owes through a duel. Henry fights as her champion. First speak to Radmil at the Cobbler Shops (centre of Kuttenberg): he suggests throwing the fight so he can use the prize money to open his shop. Options: (A) Agree to throw the fight — Radmil wins, Gerda loses the duel; Radmil pays you 125g (175g with a Presence speech check). (B) Agree to throw the fight, then win anyway — break the deal and defeat Radmil; Gerda pays 250g. (C) Refuse to throw the fight — go straight to the duel and defeat Radmil honestly; Gerda pays 250g. Radmil is not a skilled fighter regardless of path. Reward: 250g from Gerda (win) or 125–175g from Radmil (lose).",
 tip:"Winning for Gerda is the better reward (250g vs 125g). Radmil is an easy opponent — any weapon works. To maximise coin: agree to throw it, then defeat him anyway and collect from Gerda. Part of the Ars Dimicatoria questline: Ars Dimicatoria → Kuttenberg Tournament → Mark of the Brotherhood → Last Will.",status:0,notes:""},
{id:"t32",r:"Kuttenberg",tp:"Task",o:13,name:"Master Schindel's Toys",m:true,hm:true,t:false,b:false,l:false,
 desc:"During 'Into the Underworld', bathhouse owner Adam mentions that a scholar named Master Schindel has been robbed — his collection of precision mechanical instruments (astrolabes, measuring tools, and a rare orrery component) was taken by a thief who frequents the lower bathhouse. Henry must identify the thief from Adam's guest ledger, track him down in the Kuttenberg lower district, and recover the instruments either by purchase, intimidation, or pickpocketing.",
 tip:"🔴 HIGHLY MISSABLE: Only unlocked by speaking to Adam during 'Into the Underworld'. The thief is identifiable from the ledger — look for the entry dated two days before the robbery. Schindel's reward includes a unique Alchemy recipe that's not available elsewhere.",status:0,notes:""},
{id:"t33",r:"Kuttenberg",tp:"Task",o:14,name:"Rosa's Book",m:true,hm:true,t:false,b:false,l:false,
 desc:"Also triggered during 'Into the Underworld'. A woman named Rosa — a bathhouse regular — left a book behind that belongs to a friend and has been asking Adam to hold it. The book turns out to be a coded ledger belonging to a money-lender operating outside the legal guild system. Several factions want it: the money-lender, a debtor who is named in it, and a Kuttenberg magistrate's clerk. Henry must decide who gets it — or use it as leverage.",
 tip:"🔴 HIGHLY MISSABLE: Same trigger window as Master Schindel's Toys — speak to Adam during 'Into the Underworld' and do both immediately. Giving the book to the magistrate's clerk is the highest Honour option. Keeping it and selling to the debtor earns the most coin but locks out the magistrate questline.",status:0,notes:""},
{id:"t34",r:"Kuttenberg",tp:"Task",o:15,name:"The Collector",m:true,hm:false,t:false,b:false,l:false,
 desc:"An eccentric collector in Miskowitz — a retired merchant named Václav Zbrojník — is searching for a specific illuminated manuscript page that was torn from a rare book years ago. The page is in the possession of a monastery scribe who doesn't know its value. Henry must acquire it either by trade, theft, or by convincing the scribe of its true owner.",
 tip:"⚠️ Must complete before the end of Oratores. The scribe is at Sedletz — visiting him while working there (Under the Straw Hat) makes acquisition easiest. The collector's reward includes a unique decorative item that counts toward the Notable Loot tab.",status:0,notes:""},
{id:"t35",r:"Kuttenberg",tp:"Task",o:16,name:"Enough!",m:false,hm:false,t:false,b:true,l:false,
 desc:"In Miskowitz, a farmer named Prokop has reached breaking point — his neighbour Vít has been letting pigs root through Prokop's vegetable garden for months and refuses to do anything about it. Two branches: (A) Investigate and mediate — speak to both men and discover the root cause: Vít's fence was damaged by Prokop's cart months ago and never repaired, so Vít stopped caring. Arrange for the fence repair (costs 40g or a carpentry favour) and both men settle down. Honour gain. (B) Side with Prokop directly — threaten Vít with the bailiff. Vít fixes the fence under duress but resents it, and Prokop pays Henry a small reward. (C) Tell Prokop the pigs aren't technically violating any ordinance — he gets nothing and is furious with Henry.",
 tip:"Path (A) is the fairest and earns the most goodwill in Miskowitz. The carpentry favour is given by the village carpenter Radek — it only takes a short errand to unlock and saves the 40g.",status:0,notes:""},
{id:"t36",r:"Kuttenberg",tp:"Task",o:17,name:"Fight Dirty",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"Underground bare-knuckle fighting in Hroschan, run by a tout named Brůha near the tavern. Less structured than the Brawler questline — no ceremony, smaller crowds, and opponents who genuinely fight dirty (expect grabs, headbutts, and low blows). Better coin per fight than the mill brawls but the opponents are less predictable.",
 tip:"Repeatable for coin. Grappling skill is far more important here than in the official brawler circuit — opponents grab constantly. Keep your Stamina up and don't let them get you into a clinch.",status:0,notes:""},
{id:"t37",r:"Kuttenberg",tp:"Task",o:18,name:"A Moment of Fame",m:false,hm:false,t:false,b:true,l:false,
 desc:"Beneš — a local layabout in Hroschan — wants Henry to help him become famous by staging a dramatic 'heroic deed' he can boast about. Two branches: (A) Help Beneš pull off a genuine good deed — Henry engineers a situation where Beneš can actually help someone (a cart stuck in a ditch, a child's lost dog) and is seen doing it. Beneš is genuinely surprised by how it feels. He becomes a slightly better person, and the village thinks more of him. (B) Stage a fake heroic deed — arrange for Beneš to 'rescue' a villager from a staged threat. It works initially, but the ruse unravels when the 'attacker' (a friend of Henry's) drinks too much and tells the story. Beneš is embarrassed, Henry loses a little Honour, and the village is amused.",
 tip:"Path (A) takes slightly more effort to set up but the payoff — Beneš's genuine surprise at doing something real — is a lovely moment. The cart-in-ditch scenario is the easiest to arrange: there's always one stuck near the Hroschan stream crossing.",status:0,notes:""},
{id:"t38",r:"Kuttenberg",tp:"Task",o:19,name:"X Marks the Spot",m:false,hm:false,t:false,b:false,l:false,
 desc:"A mysterious hand-drawn map is found (or purchased from a dealer in Pschitoky) showing a crude X near a recognisable landmark east of Kuttenberg. Henry must decode the map's landmarks — distances are paced out, not to scale — to find a buried cache left by a long-dead bandit. The dig itself requires a spade.",
 tip:"The map's landmarks correspond to real locations on the Kuttenberg map. The tree with the double trunk is the most distinctive marker — find it northeast of the road between Pschitoky and Grund. Bring your spade before you set out.",status:0,notes:""},
{id:"t39",r:"Kuttenberg",tp:"Task",o:20,name:"Tragedy in Danemark",m:true,hm:true,t:false,b:false,l:false,
 desc:"During the 'Follow the clues' step of Yackers 'n' Fash, Henry arrives at Danemark Mill to find it occupied by bandits who have slaughtered the hired hands and taken miller Hermann's family captive. Finding and untying Hermann in the northernmost building triggers this task. Kill all the bandits, then return to Hermann for a reward.",
 tip:"🔴 HIGHLY MISSABLE: Only triggers during the 'Follow the clues' objective of Yackers 'n' Fash. If you clear the mill without first finding the tied-up family, the task never starts. Be careful approaching the barn — if any bandit sees you enter, they may attack the family. Part of the questline: Yackers 'n' Fash → Tragedy in Danemark → Striped Tonies → Popinjay Shoot.",status:0,notes:""},
{id:"t40",r:"Kuttenberg",tp:"Task",o:21,name:"Hammer and Tongs",m:false,hm:false,t:false,b:false,l:false,
 desc:"A blacksmith in Grund named Bertolt is behind on a large order of horseshoes for the mine carts and is about to lose his contract. He asks Henry to help at the forge — specifically to work the bellows and assist with the hammering while he shapes the metal. Henry can also offer to do the forging himself if his Craftsmanship is high enough.",
 tip:"Craftsmanship 6+ lets Henry take over the forging, which completes the order faster and earns a better reward. Even at lower Craftsmanship, helping with the bellows completes the task. Also counts toward the Hammerer secret perk (craft 10 items at a smithy).",status:0,notes:""},
{id:"t41",r:"Kuttenberg",tp:"Task",o:22,name:"The White Roebuck",m:false,hm:false,t:false,b:false,l:false,
 desc:"Local hunters near Suchdol speak of a legendary pure-white roebuck that has been seen at dawn in the forest east of the village. A nobleman's gamekeeper offers a significant reward for proof of the creature — either a fresh kill or a sketch (requires Scholarship to draw). The roebuck appears only at dawn (4–6am) in a specific forest clearing and is extremely alert, fleeing at the slightest noise or scent.",
 tip:"Approach on foot (horse will spook it), crouch, move slowly into the wind (watch the weather indicator). Archery skill 14+ for a clean kill at range. If you have Scholarship 5+, you can sketch it from a distance and spare it — earning a better Honour outcome and a unique reward from the gamekeeper.",status:0,notes:""},
{id:"t42",r:"Kuttenberg",tp:"Task",o:23,name:"Primum Nil Nocere",m:false,hm:false,t:false,b:true,l:false,
 desc:"A barber-surgeon in Suchdol, Master Blažej, has a patient — a young woman named Zuzana — with an infected wound that he believes requires amputation. Zuzana and her husband refuse. Blažej asks Henry to convince them. Three branches: (A) Support the amputation — use Speech 7+ or Medicine knowledge to explain the danger. If successful, Zuzana agrees, the operation goes ahead, and she survives. Blažej teaches Henry a Medicine recipe as thanks. (B) Suggest a herbal alternative — if Henry has sufficient Alchemy (level 6+) he can propose a poultice treatment instead of amputation. This also works, Zuzana keeps her arm, and the reward is larger. (C) Side with the family's refusal — Blažej is overruled. Zuzana deteriorates over several in-game days and dies. Her husband blames Henry if he sees him again.",
 tip:"Path (B) is the best outcome if you have Alchemy 6+ — Zuzana keeps her arm and Blažej is impressed. Bring Chamomile and Valerian root; the recipe is in Blažej's own notes on his desk (readable before you choose). Path (A) is the fallback if your Alchemy is too low.",status:0,notes:""},
{id:"t43",r:"Kuttenberg",tp:"Task",o:24,name:"The Reliquary",m:false,hm:false,t:false,b:false,l:false,
 desc:"A monk from Sedletz Monastery reports that a silver reliquary — a saint's finger bone in a jewelled case — has been stolen during a robbery on the road from Kuttenberg. He believes it was taken by a bandit group camped in the hills north of Suchdol. Henry must infiltrate or assault the camp and retrieve the reliquary. The bandit leader has it as a personal trophy and won't surrender it willingly.",
 tip:"The camp has 4–5 bandits. Stealth approach at night lets you pickpocket the reliquary from the sleeping leader without fighting anyone. Combat approach works but is significantly harder — the leader wears padded armour and fights with a mace. Return it to the monk for an Honour bonus and a blessed item reward.",status:0,notes:""},
{id:"t44",r:"Kuttenberg",tp:"Task",o:25,name:"The Stalker",m:true,hm:true,t:false,b:false,l:false,
 desc:"Only available during Main Quest 22: The Lion's Den. After searching the spot where Chertan was stabbed, Henry goes to the infirmary tent and finds Chertan has died. During the conversation with Grozav, Ditrich, and Musa, Henry must say 'A girl from the baths will help' — this triggers the optional objective to ask Katherine for help with the guard. Katherine is at the camp baths and agrees to help in exchange for Henry dealing with a soldier named Chakan who has been stalking and peeping on her at night. Find out who's stalking her, then confront Chakan to ensure he leaves her in peace.",
 tip:"🔴 HIGHLY MISSABLE: Must say 'A girl from the baths will help' during The Lion's Den infirmary dialogue. If you pick another option, the task never opens. Katherine is only at the camp baths during this quest window. Reward: reputation gained with Katherine.",status:0,notes:""},
{id:"t45",r:"Kuttenberg",tp:"Task",o:26,name:"Absolver",m:false,hm:false,t:false,b:false,l:false,
 desc:"A soldier at Sigismund's Camp named Radslav is consumed by guilt over a killing he committed during the campaign — a non-combatant he mistakenly struck during a village raid. He has been unable to sleep and is becoming a liability to his unit. He asks Henry, as someone he trusts, to hear his confession and help him find a way to make it right. Henry can direct him to the camp's chaplain, help him send reparations anonymously to the victim's family, or simply listen and offer counsel.",
 tip:"There's no wrong answer here — all three paths give Honour and resolve the task. But directing him to the chaplain AND sending reparations (both, if you help with both steps) gives the highest Honour gain and leaves Radslav visibly at peace.",status:0,notes:""},
{id:"t46",r:"Kuttenberg",tp:"Task",o:27,name:"Nail in the Coffin",m:false,hm:false,t:false,b:false,l:false,
 desc:"Automatically triggered upon completing the three tasks Enough!, Fight Dirty, and Teeth in the Bag. Henry hears that the strongest unarmed fighter around can be found at the cemetery in Kuttenberg — the gravedigger Frantishek. Search for him, then challenge him to a fight at night in the graveyard. Defeating grandmaster Frantishek earns the Shoulder Throw combo and Unarmed XP.",
 tip:"Complete Enough!, Fight Dirty, and Teeth in the Bag to trigger this automatically. The fight is at night — wait at the cemetery after sundown. Frantishek is the toughest unarmed opponent in the Kuttenberg questline; high Unarmed skill and the Clinch technique help significantly.",status:0,notes:""},
{id:"t47",r:"Kuttenberg",tp:"Task",o:28,name:"Skeleton in the Closet",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. A task in the Kuttenberg region. Name confirmed real.",
 tip:"Details to be confirmed.",status:0,notes:""},
{id:"t48",r:"Kuttenberg",tp:"Task",o:29,name:"Like Old Times",m:true,hm:true,t:false,b:false,l:false,
 desc:"⚠️ HIGHLY MISSABLE. Details for this task need verification — placeholder. A task in the Kuttenberg/Devil's Den area. Name confirmed real.",
 tip:"🔴 HIGHLY MISSABLE — verify conditions.",status:0,notes:""},
{id:"t49",r:"Kuttenberg",tp:"Task",o:30,name:"Civic Duty",m:false,hm:false,t:false,b:false,l:false,
 desc:"Part of the thieves' guild questline — see ⚖️ The Guild tab. ⚠️ MUTUALLY EXCLUSIVE WITH THE SPARK. After starting Feast for the Poor, visit Bailiff Andreas Plumel in Kuttenberg town hall (upstairs, daytime) to report the Guild's activities. Earn 30g per piece of information. To fully complete: play through The Spark until you have the black powder keg, deliver it to the campfire, then abandon the plan (or throw it in the fire for the Remember, Remember… trophy). Return to Plumel for 150g final reward. Completing this cancels The Spark permanently.",
 tip:"⚠️ Completing Civic Duty locks out The Spark. If you want The Spark (more content, better trophy options), do NOT complete Civic Duty. See ⚖️ The Guild tab for full details.",status:0,notes:""},
{id:"t50",r:"Kuttenberg",tp:"Task",o:31,name:"Damsel in Distress",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. A task in the Kuttenberg region. Name confirmed real.",
 tip:"Details to be confirmed.",status:0,notes:""},
{id:"t51",r:"Kuttenberg",tp:"Task",o:32,name:"The Peasants' Revolt",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. A task in the Kuttenberg region involving peasants and a dispute.",
 tip:"Details to be confirmed.",status:0,notes:""},
{id:"t52",r:"Kuttenberg",tp:"Task",o:33,name:"Something rotten…",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. A task in the Kuttenberg region. Name confirmed real.",
 tip:"Details to be confirmed.",status:0,notes:""},
{id:"t53",r:"Kuttenberg",tp:"Task",o:34,name:"Seeking Justice",m:true,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. Name confirmed real. A task in the Kuttenberg region that follows from All's fair…",
 tip:"Details to be confirmed. Missable — check unlock conditions.",status:0,notes:""},
{id:"t54",r:"Kuttenberg",tp:"Task",o:35,name:"Attila",m:true,hm:false,t:false,b:false,l:false,
 desc:"In Maleshov (only accessible if it was not burned during Dancing with the Devil), a child named Tomík has named his cat 'Attila' and the cat has gotten itself stuck high in the rafters of the mill and refuses to come down. Henry must coax it down using food — Tomík suggests dried fish — or find another way. The cat, true to its name, is belligerent and will swipe at Henry if he gets too close without the right approach.",
 tip:"⚠️ Only available if you refused to burn Maleshov in Dancing with the Devil. Bring dried fish or buy it from the Maleshov cook. Patience is the only skill needed. A short, light-hearted task that serves as a palate cleanser after the weight of the main quest's choices.",status:0,notes:""},
{id:"t55",r:"Kuttenberg",tp:"Task",o:36,name:"Victimised",m:false,hm:false,t:false,b:false,l:false,
 desc:"A merchant's widow in Pschitoky named Anna was robbed on the road and her cart of trade goods stolen. The local watch did nothing. Henry can track down the thieves (a pair of brothers who fled to a farm north of town) and recover the goods either through confrontation or by reporting them to the Kuttenberg bailiff with evidence. The brothers claim the goods were payment for a debt the merchant owed — Henry must determine who is telling the truth.",
 tip:"Investigate before confronting anyone — the debt claim has partial truth to it. The merchant's own ledger (in Anna's possession) shows the debt was paid six months ago. Presenting this to the bailiff is the cleanest path. Recovering the goods by force also works but Anna gets less back (the brothers have already sold some).",status:0,notes:""},

// ── THE GUILD — KUTTENBERG THIEVES' GUILD QUESTLINE ──────────────
// Quest giver: Chenyek at The Hole in the Wall tavern (southeast Kuttenberg, Hoprink district)
// Starts during Main Quest 16: Into the Underworld (meet Chenyek to find Goatskin)
// Full chain: Feast for the Poor → (Civic Duty OR) The Thieves' Code → Beyond the Grave → The German's Treasure → The Spark
// ⚠️ CIVIC DUTY and THE SPARK are MUTUALLY EXCLUSIVE — reporting to bailiff cancels The Spark
{id:"guild1",r:"Guild",tp:"Side Quest",o:1,name:"Feast for the Poor",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry's introduction to the Kuttenberg Guild — a thieves' collective that styles itself as a Robin Hood-style people's movement against Sigismund. Quest giver: Chenyek at The Hole in the Wall tavern. Chenyek asks Henry to infiltrate Sigismund's supply warehouse south of the city walls, steal quality sausages from a locked chest (and optionally leave a cabbage in their place as a prank), then distribute the sausages to five beggars around Kuttenberg. Knuckles (outside the tavern) offers an optional side task to also steal a bottle of fine wine from the same warehouse, in exchange for lockpicks and potions. After feeding the beggars, return to Chenyek to complete the quest. Reward: 100 Groschen (if you give the wine to Knuckles). Completing this unlocks The Thieves' Code.",
 tip:"The warehouse is south of the city walls — wait until night and wear cloth armour for stealth, or just sprint in and out during the day (guards give up quickly). Buy at least one cabbage before going — leaving it in the chest is optional but keeps things clean. You can let both Chenyek and Knuckles copy the symbols in The Thieves' Code; they're not fully opposed yet. Starts after completing Main Quest 14: Speak of the Devil.",status:0,notes:""},
{id:"guild2",r:"Guild",tp:"Task",o:2,name:"The Thieves' Code",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chenyek sends Henry to investigate the meaning of chalk symbols marked on buildings across Kuttenberg — a secret thieves' cant used by the Guild. First step: visit a house in the north of Kuttenberg where Chenyek sent Hog to see an old fence named Hynek. Henry finds Hynek dead in the kitchen (Hog is standing there looking guilty). Search the body to find Hynek's Letter, which contains a cryptic riddle: 'A vineyard in town? Strange, but who knows! And yet there it is, quite nearby. By the water that gushes, now listen and try to keep your eyes open — shortly after the midday bell, you'll find us where the shadow goes.' The answer: go to the fountain on Vintner's Street (west side of the city) at noon and watch the shadow — it points north to the trader's shop. Enter, go behind the counter, down to the basement, pick the Hard locked door (or use the Cellar Door Key from Hynek's house) and find a Parchment with Drawings in an Easy locked chest inside. Return to The Hole — you can let Knuckles copy the symbols (150g) and/or Chenyek copy them (100g + quest progression). You must show Chenyek to advance the questline.",
 tip:"The fountain on Vintner's Street is near the west city gate fast-travel point. You must be there around noon — skip time at the fountain to trigger it. The cellar door key is in Hynek's house safe if you want to skip the Hard lock. You can earn 150g from Knuckles AND 100g from Chenyek for the same parchment — show Knuckles first, then Chenyek. Reward: 100-250g depending on who you show. Next: Beyond the Grave.",status:0,notes:""},
{id:"guild3",r:"Guild",tp:"Task",o:3,name:"Beyond the Grave",m:false,hm:false,t:false,b:false,l:false,
 desc:"After completing Feast for the Poor, speak to Rat at The Hole in the Wall and ask for work. Rat — a cleaning woman and fence for the Guild — needs a seal stolen from the grave of a dead mine owner named Hanuman Rot in the Sedletz Monastery ossuary northeast of Kuttenberg. Travel to Sedletz, enter the monastery chapel, and use the trap door in the floor to access the crypt. Go south through the arch and interact with a suspicious brick wall — it opens to reveal the tomb. The seal has already been taken by Gravedigger Lenek. Track him to his house north of the monastery: either pickpocket him during the day or lockpick his door at night and steal the seal while he sleeps. Return to Rat. Reward: 225 Groschen + Agility XP.",
 tip:"Running this alongside the Thou art but dust… side quest is efficient — Brother Morticius is in the graveyard and starts that quest, and you go into the same crypt. The Gravedigger Lenek's door is a Very Hard lock at night; pickpocketing during the day is easier if your Pickpocket skill is decent. Strong Quickfinger potions help with the lock. Leads to The German's Treasure.",status:0,notes:""},
{id:"guild4",r:"Guild",tp:"Task",o:4,name:"The German's Treasure",m:false,hm:false,t:false,b:false,l:false,
 desc:"After Beyond the Grave, speak to Rat again and ask for more work. She sends Henry to steal valuables from the basement of the All Saints Tavern (near the large church, south-center of Kuttenberg), run by innkeeper Beikovetz — a Sigismund loyalist who made his money from banditry. The easiest route is through the Kuttenberg Underground: enter the network from a crumbling building on the southwest side of the city. Navigate the tunnels (keep right at the main crossroads, find the Wasteyard area, climb the ladder) to reach the tavern basement. Find and steal three items: an Old Rusty Sword, Bloodied Wedding Dress, and Old Painted Statuette. Then take the stolen items to Innkeeper Helga at a tavern west of Kuttenberg — give the password 'big-eyed monkey.' Pass a Speech check to convince her to take the items, then haggle for the price. Reward: up to 295 Groschen.",
 tip:"If you've already done Yackers 'n' Fash you'll have been in the All Saints Tavern basement before and may have a key. The underground tunnel route bypasses all guards and sleeping residents entirely — recommended. Night is still easiest if you go through the tavern itself. Password for Helga is 'I'll have a big-eyed monkey.' Leads to The Spark.",status:0,notes:""},
{id:"guild5",r:"Guild",tp:"Task",o:5,name:"Civic Duty",m:false,hm:false,t:true,b:false,l:true,
 desc:"⚠️ MUTUALLY EXCLUSIVE WITH THE SPARK. After starting Feast for the Poor, at any point you can visit Bailiff Andreas Plumel in Kuttenberg's town hall (upstairs, daytime) and report the Guild. He pays 30 Groschen per piece of information about Guild activities across Feast for the Poor, The Thieves' Code, Beyond the Grave, and The German's Treasure. To fully complete Civic Duty you must play through The Spark until you have the black powder keg, deliver it to the guildsmen at the campfire — then abandon the plan without destroying the mine (run away or throw the barrel into the campfire for the 'Remember, Remember…' trophy, which fails The Spark). Return to Plumel for the final 150 Groschen reward. Completing Civic Duty cancels The Spark permanently; completing The Spark cancels Civic Duty.",
 tip:"PowerPyx recommends doing The Spark (not Civic Duty) if you want maximum content and trophies. Civic Duty gives slightly better 'lawful' roleplay. To get the Remember, Remember… trophy while on The Spark path: save before going into the mine with Goliath, kill Goliath, walk to the campfire and throw the barrel in (instant game over + trophy), then reload and do the quest properly. You can earn 30g per report throughout the questline by keeping Plumel informed even if you ultimately do The Spark.",status:0,notes:""},
{id:"guild6",r:"Guild",tp:"Side Quest",o:6,name:"The Spark",m:true,hm:false,t:false,b:true,l:false,g:true,
 desc:"⚠️ MUTUALLY EXCLUSIVE WITH CIVIC DUTY. ⚠️ MISSABLE: If you recruit Goliath for the Ransom quest and he dies there, Chenyek will say the plan makes no sense and The Spark is permanently locked. Triggered by a messenger intercepting Henry on the road after completing Via Argentum (Main Quest 17) and The Thieves' Code — wait 2-3 in-game days and fast-travel near Suchdol. Chenyek's Guild plans to sabotage the silver mine near Horschan (southwest of Grund) used by Sigismund. Henry must obtain a Black Powder Keg from a cart (Prokop Eldris has the key), then meet Goliath and the guildsmen at the campfire east of the mine road. Wait for nightfall, then follow Goliath into the mine, place the keg at the marked support beam (red cloth), light the fuse, and escape. Henry is knocked out by the blast; Goliath drags him clear. Guards then confront you — intimidate them or fight. Return to Chenyek at The Hole: if you stayed loyal to Chenyek, 150 Groschen; if you sided with Knuckles (who tried to sell Henry to the guards), 60 Groschen.",
 tip:"🔴 MISSABLE if Goliath dies in Ransom. For Remember, Remember… trophy: save at mine entrance, kill Goliath, return to campfire and throw barrel into fire (game over + trophy), reload. The exit route from the mine is: turn left at the wheelbarrow twice to get out quickly. Reward: 150g (Chenyek) or 60g (Knuckles). This quest closes the Guild storyline.",status:0,notes:""},

// ── DLC3 — MYSTERIA ECCLESIAE (11 quests: 6 side quests + 5 tasks) ────────────
// ⚠ WARNING: Once you enter Sedletz Monastery you are LOCKED IN until the DLC ends.
// Bring: Torch, 10x Saviour Schnapps, high-Charisma outfit (25+), Lockpicks, Bandages, Merigold Decoctions.
// All 11 quests are classified as Side Quests / Tasks in journal (not Main Quests).
// Side Tasks are time-sensitive and disappear if you advance the story too far — explore thoroughly.
// Do NOT commit serious crimes inside the monastery before lockdown or you will be expelled and the DLC fails.
{id:"dlc3_1",r:"DLC3",tp:"Side Quest",o:1,name:"The Royal Physician",m:false,hm:false,t:false,b:false,l:false,
 desc:"The Mysteria Ecclesiae DLC begins. In Suchdol, Henry meets Petr of Pisek, who asks him to accompany the renowned healer Albich of Uniczow (physician to King Wenceslas himself) on a visit to Sedletz Monastery. What starts as a routine escort becomes something far darker. Henry and Albich arrive at the monastery to find it gripped by a mysterious illness — and immediately suspect foul play. This quest takes you from Suchdol to Sedletz; all remaining quests take place entirely within the monastery grounds.",
 tip:"Startable after reaching Kuttenberg (main quest 13: The Sword and the Quill, second day). Recommended to finish the main game first for full story context. Speak to Petr of Pisek — look for the purple shield icon on the map in Suchdol. Stock up on supplies before entering; once you step inside Sedletz Monastery you cannot leave until the DLC concludes.",status:0,notes:""},
{id:"dlc3_2",r:"DLC3",tp:"Side Quest",o:2,name:"Anamnesis",m:false,hm:false,t:false,b:false,l:false,
 desc:"The DLC's second main quest, beginning immediately after The Royal Physician. Albich tasks Henry with investigating the connection between the sick monks — taking an anamnesis (medical history) from each patient in the infirmary. The investigation gradually reveals the outbreak is not natural. During this quest, the monastery enters lockdown. Henry also gains access to the library, meets the cat, and — at the end — must open a locked door to find Brother Vojtiech, a monk with a very unusual way of coping with the horrors around him.",
 tip:"🏆 SURVIVOR TROPHY: Behind the locked door at the end of this quest is Brother Vojtiech. During his dialogue, keep choosing 'Tell me another joke' until he runs out of jokes — all must be heard in a single conversation. Do not skip his dialogue. Also: interact with the library cat during the 'Speak with Librarian Crispin' objective (first of three interactions needed for the Feline Affection trophy).",status:0,notes:""},
{id:"dlc3_3",r:"DLC3",tp:"Task",o:3,name:"Maddening Pain",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task that opens immediately after you first speak to Albich in the infirmary during Anamnesis. A young woman named Maddie is waiting just outside the infirmary entrance — she has severe stomach pain and is frightened to go inside. If you speak to her, she asks for help. Return to Albich and ask him 'How can I help Maddie?' to receive the Anti-Inflammatory Potion recipe. Brew it and give it to her. Do NOT try to diagnose her yourself or choose wrong dialogue — the quest fails if you don't get the recipe from Albich.",
 tip:"🔴 MISSABLE: You must speak to Maddie outside the infirmary immediately after talking to Albich for the first time. If you advance too far in Anamnesis without doing this, she disappears and the quest is gone. Also counts toward the Do Good to All People trophy (help 3 people in the monastery). Interact with the library cat a second time during this task window — needed for Feline Affection.",status:0,notes:""},
{id:"dlc3_4",r:"DLC3",tp:"Task",o:4,name:"Prevention",m:true,hm:false,t:false,b:false,l:false,
 desc:"Available right after completing Anamnesis, before advancing to Silent Witnesses. Henry learns of the risk of contagion from the crypt and must craft a plague mask to protect himself. The mask requires leather (cow, pig, or deer skin — check your inventory first), mint or sage (found in the garden next to the infirmary), and an oil recipe obtained from the librarian. Craft the mask using the monastery's equipment and equip it before entering the crypt.",
 tip:"🔴 MISSABLE: Must be completed before you descend into the crypt during Silent Witnesses. If you skip it and go straight to Silent Witnesses, this task disappears and its trophy is gone. 🏆 BETTER SAFE THAN SORRY TROPHY: Awarded automatically on completion. Wearing the plague mask also prevents a debuff that can persist for the rest of the DLC.",status:0,notes:""},
{id:"dlc3_5",r:"DLC3",tp:"Task",o:5,name:"Our Old Bread",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task begun by talking to Zacharias and then Denes in the infirmary after Anamnesis. Denes is an elderly, nearly blind monk who has lost his glasses (taken by a bird) and is pining for a book about crayfish. Henry must retrieve both: find Denes's glasses and other stolen items by throwing a rock at a bird's nest in the garden, then locate the book 'Crayfish, the Poor Man's Salmon' in the library. After reading it, catch 8 crayfish from ponds in the monastery grounds and return everything to Denes.",
 tip:"🔴 MISSABLE: Talk to Zacharias then Denes in the infirmary as soon as you regain control after Anamnesis. Complete ALL objectives including the optional ones (returning the glasses and other nest items). 🏆 OSTRACONOPHOBIA TROPHY: Apply Bane Potion to some honey, eat it, then quickly pick up a crayfish — the crayfish bites cause death. Make a manual save before attempting this. 🏆 DO GOOD TO ALL PEOPLE TROPHY: Completing Our Old Bread (plus Maddening Pain and the Monk Vincent interaction) unlocks this.",status:0,notes:""},
{id:"dlc3_6",r:"DLC3",tp:"Task",o:6,name:"Foreseeing Evil",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task triggered in the library. Speak to Librarian Crispin and deliberately choose the non-skill-check dialogue option, or attempt his skill checks and fail them. Crispin, cryptic and guarded, hints at something deeply wrong — a prophecy, a secret kept in the library's restricted section. The task sends Henry into the monastery's hidden corners to uncover what Crispin dare not say openly.",
 tip:"🔴 MISSABLE: When speaking to Librarian Crispin, choose the non-skill-check option (or deliberately fail the skill checks) to trigger this task. If you pass all of Crispin's skill checks, the task does not appear. Also: interact with the library cat here if you haven't already — second interaction toward Feline Affection.",status:0,notes:""},
{id:"dlc3_7",r:"DLC3",tp:"Task",o:7,name:"The Last Wish",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task involving a dying monk's final request. One of the monastery's most seriously ill patients has a last wish Henry can fulfill. The task is compassionate and brief but disappears if you advance the story without speaking to the right monk at the right time.",
 tip:"🔴 MISSABLE: Available during a specific window in the mid-DLC. Explore the infirmary thoroughly and speak to all bedridden monks before advancing. This quest can easily be missed by rushing toward Silent Witnesses.",status:0,notes:""},
{id:"dlc3_8",r:"DLC3",tp:"Side Quest",o:8,name:"Silent Witnesses",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry descends into Sedletz Monastery's ancient crypt — a real subterranean ossuary decorated with thousands of bones — to examine the bodies of those who died earliest in the outbreak. The crypt is sealed behind a locked door and contains both physical evidence and a deeply unsettling atmosphere. Examining the corpses carefully reveals clues about the true nature of the plague and who may be responsible. One corpse in particular has something in its hair that Henry can interact with in a memorable (if disgusting) way.",
 tip:"🏆 STOP LICKING THAT! TROPHY: While examining the corpses, find the dead man with flour in his hair and choose the option to taste it. 🏆 BETTER SAFE THAN SORRY: Equip your plague mask (from the Prevention task) before going down — it prevents a debuff. Entering the crypt locks out the Prevention and The Last Wish tasks if not yet completed.",status:0,notes:""},
{id:"dlc3_9",r:"DLC3",tp:"Side Quest",o:9,name:"Seek and you Shall Find",m:false,hm:false,t:false,b:false,l:false,
 desc:"A legend has long circulated in Sedletz Monastery: Knight Boleslav Bavor was buried with a holy relic somewhere on the grounds. The Abbot, the mercenaries, and various monks all want it for different reasons. Henry must search the monastery's secret rooms and crypt passages to find where Boleslav is actually buried — and the relic with him. Interact with the library cat during this quest for the third and final time.",
 tip:"🏆 HOLY RELIC TROPHY (Silver): Find Boleslav's relic during this quest — it cannot be missed if you complete the quest. 🏆 FELINE AFFECTION TROPHY: Third and final cat interaction is triggered during the objective 'Find out how to forge documents' in The Time Has Come — but also interacting with the cat during this quest (Seek and you Shall Find) may count depending on your earlier interactions. Track carefully. What you do with the relic (give to Abbot vs. keep) affects an optional dialogue in The Time Has Come but not the ending.",status:0,notes:""},
{id:"dlc3_10",r:"DLC3",tp:"Side Quest",o:10,name:"To Dust you Shan't Return",m:false,hm:false,t:false,b:false,l:false,
 desc:"The investigation reaches its grim conclusion as Henry and Albich piece together the full truth of the outbreak — its cause, its orchestrator, and the political conspiracy behind it (a plot against King Wenceslas himself). The quest involves examining the final evidence, confronting the truth about who has been poisoning the monastery, and preparing for a direct confrontation. Albich himself is now in danger.",
 tip:"🏆 STOP LICKING THAT! TROPHY: If you haven't already triggered this in Silent Witnesses, there is another opportunity here to taste flour from a corpse's hair. Do it during this quest if missed earlier.",status:0,notes:""},
{id:"dlc3_11",r:"DLC3",tp:"Side Quest",o:11,name:"The Time has Come",m:false,hm:false,t:false,b:false,l:false,
 desc:"The DLC's climactic and final quest. Albich has been poisoned by Zacharias — the monastery's true villain, whose jealousy of Albich's success and obsession with poisons drove the entire conspiracy. Henry must retrieve King Wenceslas's stolen medical records, navigate the monastery's final locked areas, and ultimately duel Zacharias in the crypt tunnels. Zacharias is unarmored but resilient — prepare for a tough fight. After defeating him, giving him a Painkiller Brew and asking all available questions triggers a full confession: he admits his obsession, his envy, and his crimes. He dies urging Henry to live better than he did. Henry can then choose to pray for his soul or condemn his sins. Loot the antidote from his body to save Albich. Exit through the western gate to end the DLC.",
 tip:"🏆 FRESH AIR TROPHY (Silver): Awarded automatically on completing the DLC. 🏆 QUIET AS A CHURCH MOUSE TROPHY (Silver): Awarded if you completed the entire DLC without ever being caught and escorted to the infirmary by the monastery guards. Getting caught once does NOT permanently disqualify you — community reports vary, but keep manual saves to be safe. 🏆 FELINE AFFECTION TROPHY: Third cat interaction is during the 'Find out how to forge documents' objective in this quest — do not miss it. 🏆 BENEFACTOR TROPHY: Awarded for completing Maddening Pain and Our Old Bread AND completing the Monk Vincent interaction before descending into the crypt.",status:0,notes:""},

// ── DLC4 — HORSE RACES (3) ────────────────────────
{id:"dlc4_1",r:"DLC4",tp:"Main Quest",o:1,name:"Horses for Courses",m:false,hm:false,t:false,b:false,l:false,
 desc:"Horse Races DLC main quest. Enter the racing circuit with your horse.",

{id:"dlc4_2",r:"DLC4",tp:"Main Quest",o:2,name:"The Executioner's Pride",m:false,hm:false,t:false,b:true,l:false,
 desc:"Executioner Heinz needs a new sword forged from four cursed ingredients, including a ghostly horseshoe. The ghost horse (Phantom Horse) appears at midnight in a burnt forest between Old Kutná and Grund — it's not truly a ghost, but a real black horse mourning its dead master. Follow it silently until it stops to eat, then take the horseshoe from its hoof. Attacking it makes it vanish. After taking the shoe, you can also claim the horse as your own mount.",
 tip:"🐴 PHANTOM HORSE: Follow it silently to its master's grave — don't attack before it stops or it vanishes. Once it stops you can either (A) interact to peacefully remove the shoe, then mount and take it to horse dealer Stoia (~1,200g) to claim the best mount in the game, OR (B) kill it and loot the horseshoe — quest still completes but you lose the mount. Earns the Boneworks trophy if you also completed Forbidden Fruit and Thou art but dust.",status:0,notes:""},

function setTab(t){
  currentTab=t;
  ["tracker","decisions","endings","riddler","npcs","forge","missable","loot","romance","trophies","shepherds","secrets","guild"].forEach(id=>{
    document.getElementById("page-"+id).style.display=id===t?(id==="tracker"?"flex":"block"):"none";
    document.getElementById("tb-"+id).className="tab"+(t===id?" on":"");
  });
  if(t==="decisions")renderDecisions();
  if(t==="endings")renderEndings();
  if(t==="riddler")renderRiddler();
  if(t==="npcs")renderNPCs();
  if(t==="forge")renderForge();
  if(t==="missable")renderMissable();
  if(t==="loot")renderLoot();

  if(t==="guild")renderGuild();
}

function updateStats(){
  const done=Q.filter(q=>q.status===2).length,total=Q.length;
  const mqs=Q.filter(q=>q.tp==="Main Quest"),mdone=mqs.filter(q=>q.status===2).length;
  const sqs=Q.filter(q=>q.tp==="Side Quest"),sdone=sqs.filter(q=>q.status===2).length;
  const missableLeft=Q.filter(q=>(q.m||q.hm)&&q.status===0).length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-pct").textContent=Math.round(done/total*100)+"%";
  document.getElementById("s-main").textContent=mdone+"/"+mqs.length;
  document.getElementById("s-side").textContent=sdone+"/"+sqs.length;
  document.getElementById("s-miss").textContent=missableLeft;
  document.getElementById("prog").style.width=(done/total*100)+"%";
}

function nodeStyle(t){
  return({decision:{fill:"#141e38",stroke:"#3060a0",text:"#88aade"},good:{fill:"#0f2a1a",stroke:"#3a8a58",text:"#52b872"},bad:{fill:"#2a0f0f",stroke:"#a83830",text:"#d05848"},neutral:{fill:"#221a08",stroke:"#c8861a",text:"#e8a83c"},"out-good":{fill:"#081a10",stroke:"#3a8a58",text:"#3a8a58"},"out-bad":{fill:"#1a0808",stroke:"#a83830",text:"#a83830"},"out-neutral":{fill:"#1a1408",stroke:"#c8861a",text:"#c8861a"}})[t]||{fill:"#141e38",stroke:"#3060a0",text:"#88aade"};
}
function buildBranch(bd){
  const{nodes,edges,title}=bd;
  const PAD_X=14,PAD_Y=10,LINE_H=16,MIN_W=80,MIN_H=36,GAP_X=10;

  // Step 1: compute required size from text
  const sized=nodes.map(n=>{
    if(n.w===0&&n.h===0)return{...n,_w:0,_h:0};
    const lines=n.label.split("\n");
    const maxLineW=Math.max(...lines.map(l=>l.length*6.6));
    const _w=Math.max(MIN_W,maxLineW+PAD_X*2);
    const _h=Math.max(MIN_H,lines.length*LINE_H+PAD_Y*2);
    return{...n,_w,_h};
  });

  // Step 2: place nodes — centre on original centre-x, keep original y
  const placed=sized.map(n=>({...n,rx:n.x+(n.w||0)/2-n._w/2,ry:n.y}));

  // Step 3: fix horizontal overlaps row by row.
  // Group nodes that share the same original y (within 10px tolerance).
  const ROW_TOL=10;
  const rows=[];
  placed.forEach(n=>{
    if(n._w===0)return;
    const row=rows.find(r=>Math.abs(r.y-n.y)<ROW_TOL);
    if(row)row.nodes.push(n);
    else rows.push({y:n.y,nodes:[n]});
  });

  // For each row, sort left-to-right, then push nodes right if they overlap.
  rows.forEach(row=>{
    row.nodes.sort((a,b)=>a.rx-b.rx);
    for(let i=1;i<row.nodes.length;i++){
      const prev=row.nodes[i-1],cur=row.nodes[i];
      const minX=prev.rx+prev._w+GAP_X;
      if(cur.rx<minX)cur.rx=minX;
    }
    // Re-centre the whole row around its original collective centre
    const origCentres=row.nodes.map(n=>n.x+(n.w||0)/2);
    const origMid=(Math.min(...origCentres)+Math.max(...origCentres))/2;
    const newLeft=row.nodes[0].rx;
    const newRight=row.nodes[row.nodes.length-1].rx+row.nodes[row.nodes.length-1]._w;
    const newMid=(newLeft+newRight)/2;
    const shift=origMid-newMid;
    row.nodes.forEach(n=>n.rx+=shift);
  });

  const laidById=Object.fromEntries(placed.map(n=>[n.id,n]));

  // Step 4: viewBox bounds
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  placed.forEach(n=>{
    if(n._w===0)return;
    minX=Math.min(minX,n.rx);minY=Math.min(minY,n.ry);
    maxX=Math.max(maxX,n.rx+n._w);maxY=Math.max(maxY,n.ry+n._h);
  });
  const MG=14;
  const vx=minX-MG,vy=minY-MG,vw=(maxX-minX)+MG*2,vh=(maxY-minY)+MG*2;

  let s=`<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/></marker></defs>`;
  edges.forEach(([f,t])=>{
    const fn=laidById[f],tn=laidById[t];
    if(!fn||!tn||fn._w===0||tn._w===0)return;
    const x1=fn.rx+fn._w/2,y1=fn.ry+fn._h,x2=tn.rx+tn._w/2,y2=tn.ry,mid=(y1+y2)/2;
    s+=`<path d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" marker-end="url(#arr)"/>`;
  });
  placed.forEach(n=>{
    if(n._w===0)return;
    const c=nodeStyle(n.type),lines=n.label.split("\n"),cx=n.rx+n._w/2;
    s+=`<rect x="${n.rx}" y="${n.ry}" width="${n._w}" height="${n._h}" rx="5" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/>`;
    const totalH=lines.length*LINE_H,sy=n.ry+(n._h-totalH)/2+LINE_H*0.78;
    lines.forEach((l,i)=>s+=`<text x="${cx}" y="${sy+i*LINE_H}" text-anchor="middle" fill="${c.text}" font-size="11" font-family="monospace" font-weight="${n.type==="decision"?"600":"400"}">${l}</text>`);
  });
  return `<div class="bdiag"><div class="bdiag-title">${title}</div><svg viewBox="${vx} ${vy} ${vw} ${vh}" style="width:100%;height:auto;max-height:${Math.round(vh)+40}px">${s}</svg></div>`;
}

// MISSABLE QUESTS TAB
// ═══════════════════════════════════════════════════
function renderMissable(){
  // Group missable quests by region and sort by highly missable first
  const missable=Q.filter(q=>q.m||q.hm).sort((a,b)=>{
    if(a.r!==b.r)return REGIONS.findIndex(r=>r.id===a.r)-REGIONS.findIndex(r=>r.id===b.r);
    if(b.hm!==a.hm)return b.hm?1:-1;
    return a.o-b.o;
  });
  const total=missable.length;
  const done=missable.filter(q=>q.status===2||q.status===4).length;
  const remaining=missable.filter(q=>q.status===0||q.status===1).length;
  const failed=missable.filter(q=>q.status===3).length;

  // Group by region
  const byRegion={};
  REGIONS.forEach(r=>{byRegion[r.id]=[];});
  missable.forEach(q=>byRegion[q.r].push(q));

  let h=`
    <p style="font-size:12px;color:var(--text3);font-family:monospace;line-height:1.6;margin-bottom:14px">
      Every missable and highly missable quest in one place. <b style="color:var(--red2)">⚠ Highly Missable</b> quests are extremely easy to permanently lose — act on them immediately. Mark as Skipped if you've passed them intentionally.
    </p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--text)">${total}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Total Missable</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(82,184,114,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--green2)">${done}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Done / Skipped</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(200,134,26,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--amber2)">${remaining}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Still Available</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--red2)">${failed}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Missed / Failed</div>
      </div>
    </div>`;

  // Points of no return warning
  h+=`<div style="background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.35);border-radius:var(--radius2);padding:13px 15px;margin-bottom:16px">
    <div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--red2);margin-bottom:8px">🚫 POINTS OF NO RETURN — Complete ALL missable content before these quests</div>
    <div style="display:grid;gap:6px">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="color:var(--amber2);font-family:monospace;font-size:11px;white-space:nowrap">Trosky →</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Necessary Evil (MQ8)</b> — All Trosky side quests, tasks, and the full Gules questline (Canker → Casper) must be done before starting this. The Semine family decision here also permanently affects availability.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="color:var(--amber2);font-family:monospace;font-size:11px;white-space:nowrap">Kuttenberg →</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Oratores (MQ12)</b> — All Kuttenberg side quests must be done before this. Master Schindel's Toys, Rosa's Book, Under the Straw Hat, and Like Old Times are gated to specific earlier quest windows.</span>
      </div>
    </div>
  </div>`;

  REGIONS.forEach(reg=>{
    const rqs=byRegion[reg.id];
    if(!rqs.length)return;
    const rdone=rqs.filter(q=>q.status===2||q.status===4).length;
    h+=`<div style="margin-bottom:6px;padding:7px 12px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;gap:8px">
      <span style="font-size:14px">${reg.icon}</span>
      <span style="font-size:11px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">${reg.label}</span>
      ${reg.dlc?`<span style="font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)">DLC</span>`:""}
      <span style="margin-left:auto;font-size:11px;font-family:monospace;color:var(--text3)">${rdone}/${rqs.length} cleared</span>
    </div>`;
    rqs.forEach(q=>{
      const statusColors=["var(--text3)","var(--amber2)","var(--green2)","var(--red2)","var(--text3)"];
      const statusBg=["rgba(255,255,255,0.03)","rgba(200,134,26,0.1)","rgba(58,138,88,0.12)","rgba(168,56,48,0.12)","rgba(100,100,90,0.08)"];
      const SICO=["○","◐","✓","✗","—"];
      h+=`<div style="background:var(--bg2);border:1px solid ${q.hm?"rgba(168,56,48,0.4)":"var(--border)"};border-radius:var(--radius);padding:12px 14px;margin-bottom:7px;border-left:3px solid ${q.hm?"var(--red2)":q.m?"var(--orange2)":"var(--border2)"}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px">
              <span style="font-size:13px;color:var(--text);font-family:'Cinzel',serif">${q.name}</span>
              ${q.hm?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,56,48,0.25);color:var(--red2);font-weight:700;border:1px solid rgba(168,56,48,0.4)">⚠ HIGHLY MISSABLE</span>`:`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.2);color:var(--orange2);font-weight:700">missable</span>`}
              ${q.t?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.15);color:var(--orange2);font-weight:700">⏱ timed</span>`:""}
              <span style="font-size:9px;font-family:monospace;padding:2px 5px;border-radius:3px;background:${q.tp==="Main Quest"?"rgba(200,134,26,0.18)":q.tp==="Side Quest"?"rgba(48,96,160,0.2)":"rgba(96,64,160,0.18)"};color:${q.tp==="Main Quest"?"var(--amber2)":q.tp==="Side Quest"?"var(--blue2)":"var(--purple2)"}">${q.tp==="Main Quest"?"Main":q.tp==="Side Quest"?"Side":"Task"}</span>
            </div>
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55;margin-bottom:7px">${q.desc}</div>
            ${q.tip?`<div style="display:flex;gap:7px;padding:6px 9px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid ${q.hm?"var(--red2)":"var(--amber)"}"><span style="color:${q.hm?"var(--red2)":"var(--amber2)"};flex-shrink:0;font-size:12px">${q.hm?"⚠️":"💡"}</span><span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${q.tip}</span></div>`:""}
          </div>
          <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px">
            <div style="font-size:16px;color:${statusColors[q.status]}">${SICO[q.status]}</div>
            <select style="font-size:9px;padding:2px 4px;border-radius:3px;border:1px solid var(--border2);font-family:monospace;cursor:pointer;background:${statusBg[q.status]};color:${statusColors[q.status]}" onchange="setStatus('${q.id}',parseInt(this.value));renderMissable()">
              ${["Not Started","In Progress","Completed","Failed","Skipped"].map((s,i)=>`<option value="${i}"${q.status===i?" selected":""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>`;
    });
  });
  document.getElementById("missable-content").innerHTML=h;
}

function toggleLoot(id,val){

  renderLoot();
}

          ${r.tips?`<div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid var(--amber);margin-bottom:${r.missableTip?8:0}px">💡 ${r.tips}</div>`:""}
          ${r.missableTip?`<div style="font-size:12px;font-family:monospace;color:var(--red2);line-height:1.6;padding:8px 10px;background:rgba(168,56,48,0.1);border-radius:var(--radius);border-left:2px solid var(--red)">${r.missableTip}</div>`:""}
          ${r.questLink?`<div style="font-size:10px;font-family:monospace;color:var(--text3);margin-top:7px">🔗 Related quest: <span style="color:var(--amber2)">${r.questLink}</span></div>`:""}
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px">
          <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">
            <input type="checkbox" ${isDone?"checked":""} onchange="toggleRomance('${r.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--red)">
            <span style="font-size:9px;font-family:monospace;color:var(--text3)">${isDone?"Done":"Track"}</span>
          </label>
        </div>
      </div>
    </div>`;
  });

  h+=`<div style="margin-top:16px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2)">
    <div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--amber2);margin-bottom:7px">ℹ️ Notes on KCD2 Romance</div>
    <div style="font-size:11px;font-family:monospace;color:var(--text3);line-height:1.8">
      • KCD2 does not penalise Henry for pursuing multiple romance options — there are no jealousy or exclusivity flags between most characters.<br>
      • Full relationship arcs (Klára, Katherine) have meaningfully different tones — Klára is passionate and tragic, Katherine is slow-burn and intellectually grounded.<br>
      • One-night encounters (bathhouse, inns) do not affect any relationship arcs or quest outcomes.<br>
      • Lady Stephanie's appearance is a cameo — pursuing the encounter does not reopen a full KCD1-style relationship.<br>
      • Speech and Charisma stats help unlock some encounter dialogue but are not required for the main romance arcs.
    </div>
  </div>`;

  document.getElementById("romance-content").innerHTML=h;
}

function toggleRomance(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_romance")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_romance",JSON.stringify(state));
  renderRomance();
}

  document.getElementById("trophies-content").innerHTML=h;

  window._trophyFilter="";
  window._trophyState=state;

function filterTrophies(f){
  window._trophyFilter=f;
  renderTrophyList();
}

function toggleTrophy(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_trophies")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_trophies",JSON.stringify(state));
  window._trophyState=state;
  renderTrophyList();
  // recount header stats
  const done=window._TROPHIES.filter(t=>state[t.id]).length;
  const total=window._TROPHIES.length;
  const pct=Math.round(done/total*100);
  const bar=document.querySelector("#trophies-content .progress-fill, #trophies-content [style*='width:"+Math.round((done-1)/total*100)+"'");
  // simpler: just re-render the whole tab
  renderTrophies();
  window._trophyFilter=window._trophyFilter||"";
  renderTrophyList();
}

function renderTrophyList(){
  const TROPHIES=window._TROPHIES;
  const state=window._trophyState||JSON.parse(localStorage.getItem("kcd2_trophies")||"{}");
  const rarityMeta=window._rarityMeta;
  const cats=window._cats;
  const f=window._trophyFilter||"";

  let filtered=TROPHIES;
  if(f==="missable") filtered=TROPHIES.filter(t=>t.missable);
  else if(f==="undone") filtered=TROPHIES.filter(t=>!state[t.id]);
  else if(["platinum","gold","silver","bronze"].includes(f)) filtered=TROPHIES.filter(t=>t.rarity===f);

  let h="";
  // group by cat
  cats.forEach(cat=>{
    const items=filtered.filter(t=>t.cat===cat);
    if(!items.length) return;
    const catDone=items.filter(t=>state[t.id]).length;
    h+=`<div style="margin-bottom:4px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;gap:8px;margin-top:14px">
      <span style="font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--amber2)">${cat}</span>
      <span style="font-size:10px;font-family:monospace;color:var(--text3);margin-left:auto">${catDone}/${items.length}</span>
    </div>`;
    items.forEach(trophy=>{
      const isDone=state[trophy.id]||false;
      const rm=rarityMeta[trophy.rarity];
      h+=`<div style="background:var(--bg2);border:1px solid ${isDone?"rgba(82,184,114,0.3)":rm.border};border-radius:var(--radius2);padding:12px 14px;margin-bottom:7px;opacity:${isDone?0.55:1};transition:opacity .2s">
        <div style="display:flex;align-items:flex-start;gap:11px">
          <div style="font-size:22px;width:38px;height:38px;flex-shrink:0;background:${rm.bg};border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid ${rm.border}">${trophy.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px">
              <span style="font-family:'Cinzel',serif;font-size:13px;color:${isDone?"var(--text3)":rm.col};${isDone?"text-decoration:line-through":""}">${trophy.name}</span>
              <span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:${rm.bg};color:${rm.col};border:1px solid ${rm.border};font-weight:700">${rm.icon} ${rm.label}</span>
              ${trophy.missable?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(168,56,48,0.2);color:var(--red2);border:1px solid rgba(168,56,48,0.35);font-weight:700">⚠ missable</span>`:""}
            </div>
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55;margin-bottom:6px">${trophy.desc}</div>
            <div style="font-size:11px;font-family:monospace;color:var(--text3);line-height:1.55;margin-bottom:${trophy.tip?"6px":"0"}"><b style="color:var(--text2)">How:</b> ${trophy.how}</div>
            ${trophy.tip?`<div style="font-size:11px;font-family:monospace;color:${trophy.missable?"var(--red2)":"var(--amber2)"};line-height:1.55;padding:5px 8px;background:${trophy.missable?"rgba(168,56,48,0.1)":"var(--bg3)"};border-radius:var(--radius);border-left:2px solid ${trophy.missable?"var(--red)":"var(--amber)"}">💡 ${trophy.tip}</div>`:""}
          </div>
          <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-top:2px">
            <input type="checkbox" ${isDone?"checked":""} onchange="toggleTrophy('${trophy.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--amber)">
            <span style="font-size:9px;font-family:monospace;color:var(--text3)">${isDone?"Earned":"Track"}</span>
          </label>
        </div>
      </div>`;
    });
  });
  if(!h) h=`<div style="padding:30px;text-align:center;font-family:monospace;font-size:12px;color:var(--text3)">No trophies match this filter.</div>`;
  document.getElementById("trophy-list-wrap").innerHTML=h;
}

          </div>
        </div>
      </div>`;
    });

    h+=`</div></div>`;
  });

  document.getElementById("secrets-content").innerHTML=h;

            ${q.b?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(82,184,114,0.12);color:var(--green2);border:1px solid rgba(82,184,114,0.2)">BRANCHING</span>`:""}
            ${q.m?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(168,56,48,0.15);color:var(--red2)">MISSABLE</span>`:""}
            ${q.g?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(96,64,160,0.15);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)">🔓 GATED</span>`:""}
          </div>
          <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6;margin-bottom:${q.tip?"7px":"0"}">${q.desc}</div>
          ${q.tip?`<div style="display:flex;gap:7px;padding:6px 9px;background:rgba(200,134,26,0.06);border-radius:var(--radius);border-left:2px solid rgba(200,134,26,0.3)"><span style="color:var(--amber2);flex-shrink:0">💡</span><span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${q.tip}</span></div>`:""}
        </div>
      </div>
    </div>`;
  }).join("")}
  </div>

  <div style="padding:10px 14px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);font-size:11px;font-family:monospace;color:var(--text3);text-align:center">
    Click any quest card above to mark it complete · Progress saves in your browser
  </div>`;

  document.getElementById("guild-content").innerHTML=h;
}
</script>
</body>
</html>
