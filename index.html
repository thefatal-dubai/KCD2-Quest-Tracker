 desc:"Available right after completing Anamnesis, before advancing to Silent Witnesses. Henry learns of the risk of contagion from the crypt and must craft a plague mask to protect himself. The mask requires leather (cow, pig, or deer skin — check your inventory first), mint or sage (found in the garden next to the infirmary), and an oil recipe obtained from the librarian. Craft the mask using the monastery's equipment and equip it before entering the crypt.",
 tip:"🔴 MISSABLE: Must be completed before you descend into the crypt during Silent Witnesses. If you skip it and go straight to Silent Witnesses, this task disappears and its trophy is gone. 🏆 BETTER SAFE THAN SORRY TROPHY: Awarded automatically on completion. Wearing the plague mask also prevents a debuff that can persist for the rest of the DLC.",status:0,notes:""},
{id:"dlc3_5",r:"DLC3",tp:"Task",o:5,name:"Our Old Bread",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task begun by talking to Zacharias and then Denes in the infirmary after Anamnesis. Denes is an elderly, nearly blind monk who has lost his glasses (taken by a bird) and is pining for a book about crayfish. Henry must retrieve both: find Denes's glasses and other stolen items by throwing a rock at a bird's nest in the garden, then locate the book 'Crayfish, the Poor Man's Salmon' in the library. After reading it, catch 8 crayfish from ponds in the monastery grounds and return everything to Denes.",
 tip:"🔴 MISSABLE: Talk to Zacharias then Denes in the infirmary as soon as you regain control after Anamnesis. Complete ALL objectives including the optional ones (returning the glasses and other nest items). 🏆 OSTRACONOPHOBIA TROPHY: Apply Bane Potion to some honey, eat it, then quickly pick up a crayfish — the crayfish bites cause death. Make a manual save before attempting this. 🏆 DO GOOD TO ALL PEOPLE TROPHY: Completing Our Old Bread (plus Maddening Pain and the Monk Vincent interaction) unlocks this.",status:0,notes:""},
{id:"dlc3_6",r:"DLC3",tp:"Task",o:6,name:"Foreseeing Evil",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task triggered in the library. Speak to Librarian Crispin and deliberately choose the non-skill-check dialogue option, or attempt his skill checks and fail them. Crispin, cryptic and guarded, hints at something deeply wrong — a prophecy, a secret kept in the library's restricted section. The task sends Henry into the monastery's hidden corners to uncover what Crispin dare not say openly.",
 tip:"🔴 MISSABLE: When speaking to Librarian Crispin, choose the non-skill-check option (or deliberately fail the skill checks) to trigger this task. If you pass all of Crispin's skill checks, the task does not appear. Also: interact with the library cat here if you haven't already — second interaction toward Feline Affection.",status:0,notes:""},
{id:"dlc3_7",r:"DLC3",tp:"Task",o:7,name:"The Last Wish",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task involving a dying monk's final request. One of the monastery's most seriously ill patients has a last wish Henry can fulfill. The task is compassionate and brief but disappears if you advance the story without speaking to the right monk at the right time.",
 tip:"🔴 MISSABLE: Available during a specific window in the mid-DLC. Explore the infirmary thoroughly and speak to all bedridden monks before advancing. This quest can easily be missed by rushing toward Silent Witnesses.",status:0,notes:""},
{id:"dlc3_8",r:"DLC3",tp:"Side Quest",o:8,name:"Silent Witnesses",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry descends into Sedletz Monastery's ancient crypt — a real subterranean ossuary decorated with thousands of bones — to examine the bodies of those who died earliest in the outbreak. The crypt is sealed behind a locked door and contains both physical evidence and a deeply unsettling atmosphere. Examining the corpses carefully reveals clues about the true nature of the plague and who may be responsible. One corpse in particular has something in its hair that Henry can interact with in a memorable (if disgusting) way.",
 tip:"🏆 STOP LICKING THAT! TROPHY: While examining the corpses, find the dead man with flour in his hair and choose the option to taste it. 🏆 BETTER SAFE THAN SORRY: Equip your plague mask (from the Prevention task) before going down — it prevents a debuff. Entering the crypt locks out the Prevention and The Last Wish tasks if not yet completed.",status:0,notes:""},
{id:"dlc3_9",r:"DLC3",tp:"Side Quest",o:9,name:"Seek and you Shall Find",m:false,hm:false,t:false,b:false,l:false,
 desc:"A legend has long circulated in Sedletz Monastery: Knight Boleslav Bavor was buried with a holy relic somewhere on the grounds. The Abbot, the mercenaries, and various monks all want it for different reasons. Henry must search the monastery's secret rooms and crypt passages to find where Boleslav is actually buried — and the relic with him. Interact with the library cat during this quest for the third and final time.",
 tip:"🏆 HOLY RELIC TROPHY (Silver): Find Boleslav's relic during this quest — it cannot be missed if you complete the quest. 🏆 FELINE AFFECTION TROPHY: Third and final cat interaction is triggered during the objective 'Find out how to forge documents' in The Time Has Come — but also interacting with the cat during this quest (Seek and you Shall Find) may count depending on your earlier interactions. Track carefully. What you do with the relic (give to Abbot vs. keep) affects an optional dialogue in The Time Has Come but not the ending.",status:0,notes:""},
{id:"dlc3_10",r:"DLC3",tp:"Side Quest",o:10,name:"To Dust you Shan't Return",m:false,hm:false,t:false,b:false,l:false,
 desc:"The investigation reaches its grim conclusion as Henry and Albich piece together the full truth of the outbreak — its cause, its orchestrator, and the political conspiracy behind it (a plot against King Wenceslas himself). The quest involves examining the final evidence, confronting the truth about who has been poisoning the monastery, and preparing for a direct confrontation. Albich himself is now in danger.",
 tip:"🏆 STOP LICKING THAT! TROPHY: If you haven't already triggered this in Silent Witnesses, there is another opportunity here to taste flour from a corpse's hair. Do it during this quest if missed earlier.",status:0,notes:""},
{id:"dlc3_11",r:"DLC3",tp:"Side Quest",o:11,name:"The Time has Come",m:false,hm:false,t:false,b:false,l:false,
 desc:"The DLC's climactic and final quest. Albich has been poisoned by Zacharias — the monastery's true villain, whose jealousy of Albich's success and obsession with poisons drove the entire conspiracy. Henry must retrieve King Wenceslas's stolen medical records, navigate the monastery's final locked areas, and ultimately duel Zacharias in the crypt tunnels. Zacharias is unarmored but resilient — prepare for a tough fight. After defeating him, giving him a Painkiller Brew and asking all available questions triggers a full confession: he admits his obsession, his envy, and his crimes. He dies urging Henry to live better than he did. Henry can then choose to pray for his soul or condemn his sins. Loot the antidote from his body to save Albich. Exit through the western gate to end the DLC.",
 tip:"🏆 FRESH AIR TROPHY (Silver): Awarded automatically on completing the DLC. 🏆 QUIET AS A CHURCH MOUSE TROPHY (Silver): Awarded if you completed the entire DLC without ever being caught and escorted to the infirmary by the monastery guards. Getting caught once does NOT permanently disqualify you — community reports vary, but keep manual saves to be safe. 🏆 FELINE AFFECTION TROPHY: Third cat interaction is during the 'Find out how to forge documents' objective in this quest — do not miss it. 🏆 BENEFACTOR TROPHY: Awarded for completing Maddening Pain and Our Old Bread AND completing the Monk Vincent interaction before descending into the crypt.",status:0,notes:""},

// ── DLC4 — HORSE RACES (3) ────────────────────────
{id:"dlc4_1",r:"DLC4",tp:"Main Quest",o:1,name:"Horses for Courses",m:false,hm:false,t:false,b:false,l:false,
 desc:"The Horse Races DLC begins. Henry enters the competitive horse racing circuit in the Kuttenberg region. Race against skilled opponents on a variety of courses, earn prizes, and build a reputation as a horseman.",
 tip:"🏆 FLAGELLUM DEI TROPHY: Awarded for completing this quest. Having a well-trained horse with high Speed and Stamina is essential. The Phantom Horse from The Executioner's Pride (if kept alive) is one of the best mounts for racing.",status:0,notes:""},
{id:"dlc4_2",r:"DLC4",tp:"Main Quest",o:2,name:"The Executioner's Pride",m:false,hm:false,t:false,b:true,l:false,
 desc:"Executioner Heinz needs a new sword forged from four cursed ingredients, including a ghostly horseshoe. The ghost horse (Phantom Horse) appears at midnight in a burnt forest between Old Kutná and Grund — it's not truly a ghost, but a real black horse mourning its dead master. Follow it silently until it stops to eat, then take the horseshoe from its hoof. Attacking it makes it vanish. After taking the shoe, you can also claim the horse as your own mount.",
 tip:"🐴 PHANTOM HORSE: Follow it silently to its master's grave — don't attack before it stops or it vanishes. Once it stops you can either (A) interact to peacefully remove the shoe, then mount and take it to horse dealer Stoia (~1,200g) to claim the best mount in the game, OR (B) kill it and loot the horseshoe — quest still completes but you lose the mount. Earns the Boneworks trophy if you also completed Forbidden Fruit and Thou art but dust.",status:0,notes:""},
{id:"dlc4_3",r:"DLC4",tp:"Main Quest",o:3,name:"Magic Horseshoes",m:false,hm:false,t:false,b:false,l:false,
 desc:"The third quest in the Horse Races DLC. Legendary horseshoes rumoured to give extraordinary speed to any horse are the prize. Henry must locate and obtain them — competing against other racers who are also hunting for them.",
 tip:"Having completed The Executioner's Pride and obtained the Phantom Horse gives a significant advantage in this quest. The horseshoes are the DLC's main prize.",status:0,notes:""},
];

function setTab(t){
  currentTab=t;
  ["tracker","decisions","endings","npcs","forge","missable","loot","romance","trophies","shepherds","secrets","guild"].forEach(id=>{
    document.getElementById("page-"+id).style.display=id===t?(id==="tracker"?"flex":"block"):"none";
    document.getElementById("tb-"+id).className="tab"+(t===id?" on":"");
  });
  if(t==="decisions")renderDecisions();
  if(t==="endings")renderEndings();
  if(t==="npcs")renderNPCs();
  if(t==="forge")renderForge();
  if(t==="missable")renderMissable();
  if(t==="loot")renderLoot();
  if(t==="romance")renderRomance();
  if(t==="trophies")renderTrophies();
  if(t==="shepherds")renderShepherds();
  if(t==="secrets")renderSecrets();
  if(t==="guild")renderGuild();
}

function updateStats(){
  const done=Q.filter(q=>q.status===2).length,total=Q.length;
  const mqs=Q.filter(q=>q.tp==="Main Quest"),mdone=mqs.filter(q=>q.status===2).length;
  const sqs=Q.filter(q=>q.tp==="Side Quest"),sdone=sqs.filter(q=>q.status===2).length;
  const missableLeft=Q.filter(q=>(q.m||q.hm)&&q.status===0).length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-pct").textContent=Math.round(done/total*100)+"%";
  document.getElementById("s-main").textContent=mdone+"/"+mqs.length;
  document.getElementById("s-side").textContent=sdone+"/"+sqs.length;
  document.getElementById("s-miss").textContent=missableLeft;
  document.getElementById("prog").style.width=(done/total*100)+"%";
}

function renderList(){
  const srch=(document.getElementById("search-inp").value||"").toLowerCase();
  const ftype=document.getElementById("f-type").value;
  const fstat=document.getElementById("f-status").value;
  const freg=document.getElementById("f-region").value;
  let html="";
  REGIONS.forEach(reg=>{
    const qs=Q.filter(q=>{
      if(q.r!==reg.id)return false;
      if(ftype==="act-once"&&q.act!=="once")return false;
      if(ftype==="act-rep"&&q.act!=="rep")return false;
      if(ftype&&ftype!=="act-once"&&ftype!=="act-rep"&&q.tp!==ftype)return false;
      if(fstat!==""&&q.status!==parseInt(fstat))return false;
      if(freg&&q.r!==freg)return false;
      if(srch&&!q.name.toLowerCase().includes(srch))return false;
      return true;
    });
    if(!qs.length)return;
    const done=qs.filter(q=>q.status===2).length;
    html+=`<div class="rhead"><span style="font-size:13px">${reg.icon}</span><span class="rname">${reg.label}</span>${reg.dlc?`<span class="rdlc">DLC</span>`:""}<span class="rcnt">${done}/${qs.length}</span></div>`;
    qs.forEach(q=>{
      const b=[
        `<span class="bdg ${q.tp==="Main Quest"?"b-main":q.tp==="Side Quest"?"b-side":"b-task"}">${q.tp==="Main Quest"?"Main":q.tp==="Side Quest"?"Side":"Task"}</span>`,
        q.seq?`<span class="bdg" style="background:rgba(200,134,26,0.18);color:var(--amber2);border:1px solid rgba(200,134,26,0.4);font-weight:700;letter-spacing:0.3px">MQ${String(q.seq).padStart(2,'0')}</span>`:"",
        q.hm?`<span class="bdg b-hmiss">⚠ v.missable</span>`:(q.m?`<span class="bdg b-miss">missable</span>`:""),
        q.t?`<span class="bdg b-time">timed</span>`:"",
        q.act==="once"?`<span class="bdg b-act-once">⚡ activity</span>`:q.act==="rep"?`<span class="bdg b-act-rep">🔁 repeatable</span>`:"",
        q.b?`<span class="bdg b-branch">branching</span>`:"",
        q.l?`<span class="bdg b-lock">locks content</span>`:"",
        q.g?`<span class="bdg" style="background:rgba(96,64,160,0.15);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)">🔓 gated</span>`:"",
        q.req?`<span class="bdg" style="background:rgba(200,134,26,0.12);color:var(--amber2);border:1px solid rgba(200,134,26,0.3)">🔑 ${q.req}</span>`:"",
      ].filter(Boolean).join("");
      html+=`<div class="qrow${selected===q.id?" sel":""}" onclick="selectQuest('${q.id}')">
        <span class="qico" style="color:${q.status===2?"var(--green2)":q.status===1?"var(--amber2)":q.status===3?"var(--red2)":"var(--text3)"}">${SICO[q.status]}</span>
        <div style="flex:1;min-width:0"><div class="qname${q.status===2?" done":""}">${q.name}</div><div class="qbadges">${b}</div></div>
        <select class="qstatus ${SCLS[q.status]}" onclick="event.stopPropagation()" onchange="setStatus('${q.id}',parseInt(this.value))">
          ${STATUSES.map((s,i)=>`<option value="${i}"${q.status===i?" selected":""}>${s}</option>`).join("")}
        </select>
      </div>`;
    });
  });
  document.getElementById("quest-list").innerHTML=html||`<div style="padding:20px;text-align:center;color:var(--text3);font-family:monospace;font-size:12px">No quests match</div>`;
  updateStats();
}

function selectQuest(id){selected=id;renderList();renderDetail();}
function setStatus(id,val){const q=Q.find(x=>x.id===id);if(q){q.status=val;save();renderList();if(selected===id)renderDetail();if(currentTab==="endings")renderEndings();}}
function saveNotes(id,val){const q=Q.find(x=>x.id===id);if(q){q.notes=val;save();}}

function renderDetail(){
  const el=document.getElementById("detail-panel");
  const q=Q.find(x=>x.id===selected);
  if(!q){el.innerHTML=`<div class="detail-empty" style="height:100%"><div style="font-size:44px;opacity:0.15">📜</div><div style="font-size:13px;font-family:monospace;color:var(--text3)">Select a quest</div></div>`;return;}
  const tc=q.tp==="Main Quest"?"var(--amber)":q.tp==="Side Quest"?"var(--blue2)":"var(--purple2)";
  const rl=REGIONS.find(r=>r.id===q.r)?.label||q.r;
  const br=BRANCHES[q.id];
  let w="";
  if(q.hm)w+=`<div class="warn-box">🔴 <span><b>HIGHLY MISSABLE:</b> Very easy to permanently miss. ${q.tip||"Start immediately when available."}</span></div>`;
  else if(q.m)w+=`<div class="warn-box">⚠️ <span><b>Missable:</b> Can be permanently missed. Complete promptly.</span></div>`;
  if(q.g)w+=`<div class="info-box" style="background:rgba(96,64,160,0.1);border-left-color:var(--purple2)">🔓 <span><b>Gated Quest:</b> Will not appear until specific main quests or conditions are met. Check the tip for requirements.</span></div>`;
  if(q.req)w+=`<div class="info-box" style="background:rgba(200,134,26,0.08);border-left-color:var(--amber)">🔑 <span><b>Requires:</b> ${q.req}</span></div>`;
  if(q.t)w+=`<div class="warn-box">⏱️ <span><b>Time Sensitive:</b> Has an in-game timer. Delaying causes auto-fail.</span></div>`;
  if(q.l)w+=`<div class="warn-box">🔒 <span><b>Locks Content:</b> Your choice here permanently locks out other quests or the good ending.</span></div>`;
  if(q.act==="once")w+=`<div class="info-box">⚡ <span><b>One-Time Activity:</b> A gameplay challenge (combat, sport, competition). Completes once — does not count toward narrative quest totals.</span></div>`;
  if(q.act==="rep")w+=`<div class="info-box">🔁 <span><b>Repeatable Activity:</b> Can be done multiple times. Does not count toward 'Been There Done That' trophy or narrative totals.</span></div>`;
  if(q.tip&&!q.hm)w+=`<div class="tip-box">💡 <span>${q.tip}</span></div>`;
  el.innerHTML=`<div class="detail">
    <div class="d-type" style="color:${tc}">${q.tp}</div>
    <div class="d-title">${q.name}</div>
    <div class="d-region">📍 ${rl}${q.seq?` &nbsp;<span style="font-size:11px;font-family:monospace;padding:2px 7px;border-radius:4px;background:rgba(200,134,26,0.18);color:var(--amber2);border:1px solid rgba(200,134,26,0.35);font-weight:700;vertical-align:middle">MQ${String(q.seq).padStart(2,'0')}</span>`:""}</div>
    <div style="display:grid;gap:7px;margin-bottom:14px">${w}</div>
    <div class="d-desc">${q.desc}</div>
    ${q.objectives&&q.objectives.length?`<div class="dsec">
      <div class="dsec-title">Objectives</div>
      <ol style="margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px">
        ${q.objectives.map((obj,i)=>`<li style="font-size:13px;line-height:1.55;color:var(--text2);font-family:monospace">
          ${obj.optional?`<span style="font-size:10px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(126,184,247,0.15);color:var(--blue2);border:1px solid rgba(126,184,247,0.3);margin-right:5px;vertical-align:middle">OPTIONAL</span>`:""}
          ${obj.branch?`<span style="font-size:10px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(200,134,26,0.15);color:var(--amber2);border:1px solid rgba(200,134,26,0.3);margin-right:5px;vertical-align:middle">BRANCH</span>`:""}
          ${obj.o}</li>`).join("")}
      </ol>
    </div>`:""}
    <div class="dsec"><div class="dsec-title">Status</div>
      <div class="status-btns">${STATUSES.map((s,i)=>`<button class="sbtn${q.status===i?" on":""}" onclick="setStatus('${q.id}',${i})">${SICO[i]} ${s}</button>`).join("")}</div>
    </div>
    ${br?`<div class="dsec"><div class="dsec-title">Branch Flowchart</div>${buildBranch(br)}</div>`:""}
    <div class="dsec"><div class="dsec-title">Notes & Choice Recorded</div>
      <textarea class="notes-ta" placeholder="Record your choice or notes…" onblur="saveNotes('${q.id}',this.value)">${q.notes||""}</textarea>
    </div>
  </div>`;
}

function nodeStyle(t){
  return({decision:{fill:"#141e38",stroke:"#3060a0",text:"#88aade"},good:{fill:"#0f2a1a",stroke:"#3a8a58",text:"#52b872"},bad:{fill:"#2a0f0f",stroke:"#a83830",text:"#d05848"},neutral:{fill:"#221a08",stroke:"#c8861a",text:"#e8a83c"},"out-good":{fill:"#081a10",stroke:"#3a8a58",text:"#3a8a58"},"out-bad":{fill:"#1a0808",stroke:"#a83830",text:"#a83830"},"out-neutral":{fill:"#1a1408",stroke:"#c8861a",text:"#c8861a"}})[t]||{fill:"#141e38",stroke:"#3060a0",text:"#88aade"};
}
function buildBranch(bd){
  const{nodes,edges,title}=bd;
  const PAD_X=14,PAD_Y=10,LINE_H=16,MIN_W=80,MIN_H=36,GAP_X=10;

  // Step 1: compute required size from text
  const sized=nodes.map(n=>{
    if(n.w===0&&n.h===0)return{...n,_w:0,_h:0};
    const lines=n.label.split("\n");
    const maxLineW=Math.max(...lines.map(l=>l.length*6.6));
    const _w=Math.max(MIN_W,maxLineW+PAD_X*2);
    const _h=Math.max(MIN_H,lines.length*LINE_H+PAD_Y*2);
    return{...n,_w,_h};
  });

  // Step 2: place nodes — centre on original centre-x, keep original y
  const placed=sized.map(n=>({...n,rx:n.x+(n.w||0)/2-n._w/2,ry:n.y}));

  // Step 3: fix horizontal overlaps row by row.
  // Group nodes that share the same original y (within 10px tolerance).
  const ROW_TOL=10;
  const rows=[];
  placed.forEach(n=>{
    if(n._w===0)return;
    const row=rows.find(r=>Math.abs(r.y-n.y)<ROW_TOL);
    if(row)row.nodes.push(n);
    else rows.push({y:n.y,nodes:[n]});
  });

  // For each row, sort left-to-right, then push nodes right if they overlap.
  rows.forEach(row=>{
    row.nodes.sort((a,b)=>a.rx-b.rx);
    for(let i=1;i<row.nodes.length;i++){
      const prev=row.nodes[i-1],cur=row.nodes[i];
      const minX=prev.rx+prev._w+GAP_X;
      if(cur.rx<minX)cur.rx=minX;
    }
    // Re-centre the whole row around its original collective centre
    const origCentres=row.nodes.map(n=>n.x+(n.w||0)/2);
    const origMid=(Math.min(...origCentres)+Math.max(...origCentres))/2;
    const newLeft=row.nodes[0].rx;
    const newRight=row.nodes[row.nodes.length-1].rx+row.nodes[row.nodes.length-1]._w;
    const newMid=(newLeft+newRight)/2;
    const shift=origMid-newMid;
    row.nodes.forEach(n=>n.rx+=shift);
  });

  const laidById=Object.fromEntries(placed.map(n=>[n.id,n]));

  // Step 4: viewBox bounds
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  placed.forEach(n=>{
    if(n._w===0)return;
    minX=Math.min(minX,n.rx);minY=Math.min(minY,n.ry);
    maxX=Math.max(maxX,n.rx+n._w);maxY=Math.max(maxY,n.ry+n._h);
  });
  const MG=14;
  const vx=minX-MG,vy=minY-MG,vw=(maxX-minX)+MG*2,vh=(maxY-minY)+MG*2;

  let s=`<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/></marker></defs>`;
  edges.forEach(([f,t])=>{
    const fn=laidById[f],tn=laidById[t];
    if(!fn||!tn||fn._w===0||tn._w===0)return;
    const x1=fn.rx+fn._w/2,y1=fn.ry+fn._h,x2=tn.rx+tn._w/2,y2=tn.ry,mid=(y1+y2)/2;
    s+=`<path d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" marker-end="url(#arr)"/>`;
  });
  placed.forEach(n=>{
    if(n._w===0)return;
    const c=nodeStyle(n.type),lines=n.label.split("\n"),cx=n.rx+n._w/2;
    s+=`<rect x="${n.rx}" y="${n.ry}" width="${n._w}" height="${n._h}" rx="5" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/>`;
    const totalH=lines.length*LINE_H,sy=n.ry+(n._h-totalH)/2+LINE_H*0.78;
    lines.forEach((l,i)=>s+=`<text x="${cx}" y="${sy+i*LINE_H}" text-anchor="middle" fill="${c.text}" font-size="11" font-family="monospace" font-weight="${n.type==="decision"?"600":"400"}">${l}</text>`);
  });
  return `<div class="bdiag"><div class="bdiag-title">${title}</div><svg viewBox="${vx} ${vy} ${vw} ${vh}" style="width:100%;height:auto;max-height:${Math.round(vh)+40}px">${s}</svg></div>`;
}

function renderMissable(){
  // Group missable quests by region and sort by highly missable first
  const missable=Q.filter(q=>q.m||q.hm).sort((a,b)=>{
    if(a.r!==b.r)return REGIONS.findIndex(r=>r.id===a.r)-REGIONS.findIndex(r=>r.id===b.r);
    if(b.hm!==a.hm)return b.hm?1:-1;
    return a.o-b.o;
  });
  const total=missable.length;
  const done=missable.filter(q=>q.status===2||q.status===4).length;
  const remaining=missable.filter(q=>q.status===0||q.status===1).length;
  const failed=missable.filter(q=>q.status===3).length;

  // Group by region
  const byRegion={};
  REGIONS.forEach(r=>{byRegion[r.id]=[];});
  missable.forEach(q=>byRegion[q.r].push(q));

  let h=`
    <p style="font-size:12px;color:var(--text3);font-family:monospace;line-height:1.6;margin-bottom:14px">
      Every missable and highly missable quest in one place. <b style="color:var(--red2)">⚠ Highly Missable</b> quests are extremely easy to permanently lose — act on them immediately. Mark as Skipped if you've passed them intentionally.

  // Points of no return warning
  h+=`<div style="background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.35);border-radius:var(--radius2);padding:13px 15px;margin-bottom:16px">

        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Necessary Evil (MQ8)</b> — All Trosky side quests, tasks, and the full Gules questline (Canker → Casper) must be done before starting this. The Semine family decision here also permanently affects availability.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="color:var(--amber2);font-family:monospace;font-size:11px;white-space:nowrap">Kuttenberg →</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Oratores (MQ24)</b> — All Kuttenberg side quests must be done before this. Under the Straw Hat, Like Old Times, The Stalker, and The Fifth Commandment are gated to specific earlier quest windows.</span>
      </div>
    </div>
  </div>`;

  REGIONS.forEach(reg=>{
    const rqs=byRegion[reg.id];
    if(!rqs.length)return;
    const rdone=rqs.filter(q=>q.status===2||q.status===4).length;
    h+=`<div style="margin-bottom:6px;padding:7px 12px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;gap:8px">
      <span style="font-size:14px">${reg.icon}</span>
      <span style="font-size:11px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">${reg.label}</span>
      ${reg.dlc?`<span style="font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)">DLC</span>`:""}
      <span style="margin-left:auto;font-size:11px;font-family:monospace;color:var(--text3)">${rdone}/${rqs.length} cleared</span>
    </div>`;
    rqs.forEach(q=>{
      const statusColors=["var(--text3)","var(--amber2)","var(--green2)","var(--red2)","var(--text3)"];
      const statusBg=["rgba(255,255,255,0.03)","rgba(200,134,26,0.1)","rgba(58,138,88,0.12)","rgba(168,56,48,0.12)","rgba(100,100,90,0.08)"];
      const SICO=["○","◐","✓","✗","—"];
      h+=`<div style="background:var(--bg2);border:1px solid ${q.hm?"rgba(168,56,48,0.4)":"var(--border)"};border-radius:var(--radius);padding:12px 14px;margin-bottom:7px;border-left:3px solid ${q.hm?"var(--red2)":q.m?"var(--orange2)":"var(--border2)"}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px">
              <span style="font-size:13px;color:var(--text);font-family:'Cinzel',serif">${q.name}</span>
              ${q.hm?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,56,48,0.25);color:var(--red2);font-weight:700;border:1px solid rgba(168,56,48,0.4)">⚠ HIGHLY MISSABLE</span>`:`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.2);color:var(--orange2);font-weight:700">missable</span>`}
              ${q.t?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.15);color:var(--orange2);font-weight:700">⏱ timed</span>`:""}
              <span style="font-size:9px;font-family:monospace;padding:2px 5px;border-radius:3px;background:${q.tp==="Main Quest"?"rgba(200,134,26,0.18)":q.tp==="Side Quest"?"rgba(48,96,160,0.2)":"rgba(96,64,160,0.18)"};color:${q.tp==="Main Quest"?"var(--amber2)":q.tp==="Side Quest"?"var(--blue2)":"var(--purple2)"}">${q.tp==="Main Quest"?"Main":q.tp==="Side Quest"?"Side":"Task"}</span>
            </div>
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55;margin-bottom:7px">${q.desc}</div>
            ${q.tip?`<div style="display:flex;gap:7px;padding:6px 9px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid ${q.hm?"var(--red2)":"var(--amber)"}"><span style="color:${q.hm?"var(--red2)":"var(--amber2)"};flex-shrink:0;font-size:12px">${q.hm?"⚠️":"💡"}</span><span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${q.tip}</span></div>`:""}
          </div>
          <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px">
            <div style="font-size:16px;color:${statusColors[q.status]}">${SICO[q.status]}</div>
            <select style="font-size:9px;padding:2px 4px;border-radius:3px;border:1px solid var(--border2);font-family:monospace;cursor:pointer;background:${statusBg[q.status]};color:${statusColors[q.status]}" onchange="setStatus('${q.id}',parseInt(this.value));renderMissable()">
              ${["Not Started","In Progress","Completed","Failed","Skipped"].map((s,i)=>`<option value="${i}"${q.status===i?" selected":""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>`;
    });
  });
  document.getElementById("missable-content").innerHTML=h;
}

}

function toggleLoot(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_loot2")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_loot2",JSON.stringify(state));
  renderLoot();
}

function toggleRomance(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_romance")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_romance",JSON.stringify(state));
  renderRomance();
}

function filterTrophies(f){
  window._trophyFilter=f;
  renderTrophyList();
}

function toggleTrophy(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_trophies")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_trophies",JSON.stringify(state));
  window._trophyState=state;
  renderTrophyList();
  // recount header stats
  const done=window._TROPHIES.filter(t=>state[t.id]).length;
  const total=window._TROPHIES.length;
  const pct=Math.round(done/total*100);
  const bar=document.querySelector("#trophies-content .progress-fill, #trophies-content [style*='width:"+Math.round((done-1)/total*100)+"'");
  // simpler: just re-render the whole tab
  renderTrophies();
  window._trophyFilter=window._trophyFilter||"";
  renderTrophyList();
}

function renderTrophyList(){
  const TROPHIES=window._TROPHIES;
  const state=window._trophyState||JSON.parse(localStorage.getItem("kcd2_trophies")||"{}");
  const rarityMeta=window._rarityMeta;
  const cats=window._cats;
  const f=window._trophyFilter||"";

  let filtered=TROPHIES;
  if(f==="missable") filtered=TROPHIES.filter(t=>t.missable);
  else if(f==="undone") filtered=TROPHIES.filter(t=>!state[t.id]);
  else if(["platinum","gold","silver","bronze"].includes(f)) filtered=TROPHIES.filter(t=>t.rarity===f);

  let h="";
  // group by cat
  cats.forEach(cat=>{
    const items=filtered.filter(t=>t.cat===cat);
    if(!items.length) return;
    const catDone=items.filter(t=>state[t.id]).length;
    h+=`<div style="margin-bottom:4px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;gap:8px;margin-top:14px">
      <span style="font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--amber2)">${cat}</span>
      <span style="font-size:10px;font-family:monospace;color:var(--text3);margin-left:auto">${catDone}/${items.length}</span>
    </div>`;
    items.forEach(trophy=>{
      const isDone=state[trophy.id]||false;
      const rm=rarityMeta[trophy.rarity];
      h+=`<div style="background:var(--bg2);border:1px solid ${isDone?"rgba(82,184,114,0.3)":rm.border};border-radius:var(--radius2);padding:12px 14px;margin-bottom:7px;opacity:${isDone?0.55:1};transition:opacity .2s">
        <div style="display:flex;align-items:flex-start;gap:11px">
          <div style="font-size:22px;width:38px;height:38px;flex-shrink:0;background:${rm.bg};border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid ${rm.border}">${trophy.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px">
              <span style="font-family:'Cinzel',serif;font-size:13px;color:${isDone?"var(--text3)":rm.col};${isDone?"text-decoration:line-through":""}">${trophy.name}</span>
              <span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:${rm.bg};color:${rm.col};border:1px solid ${rm.border};font-weight:700">${rm.icon} ${rm.label}</span>
              ${trophy.missable?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(168,56,48,0.2);color:var(--red2);border:1px solid rgba(168,56,48,0.35);font-weight:700">⚠ missable</span>`:""}
            </div>
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55;margin-bottom:6px">${trophy.desc}</div>
            <div style="font-size:11px;font-family:monospace;color:var(--text3);line-height:1.55;margin-bottom:${trophy.tip?"6px":"0"}"><b style="color:var(--text2)">How:</b> ${trophy.how}</div>
            ${trophy.tip?`<div style="font-size:11px;font-family:monospace;color:${trophy.missable?"var(--red2)":"var(--amber2)"};line-height:1.55;padding:5px 8px;background:${trophy.missable?"rgba(168,56,48,0.1)":"var(--bg3)"};border-radius:var(--radius);border-left:2px solid ${trophy.missable?"var(--red)":"var(--amber)"}">💡 ${trophy.tip}</div>`:""}
          </div>
          <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-top:2px">
            <input type="checkbox" ${isDone?"checked":""} onchange="toggleTrophy('${trophy.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--amber)">
            <span style="font-size:9px;font-family:monospace;color:var(--text3)">${isDone?"Earned":"Track"}</span>
          </label>
        </div>
      </div>`;
    });
  });
  if(!h) h=`<div style="padding:30px;text-align:center;font-family:monospace;font-size:12px;color:var(--text3)">No trophies match this filter.</div>`;
  document.getElementById("trophy-list-wrap").innerHTML=h;
}

        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="width:22px;height:22px;border:2px solid ${done?"var(--green2)":cat.color};border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:${done?"rgba(58,138,88,0.2)":"transparent"}">
            ${done?`<span style="color:var(--green2);font-size:13px">✓</span>`:`<span style="font-size:11px">${item.icon}</span>`}
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
              <div style="font-family:'Cinzel',serif;font-size:13px;color:${done?"var(--text3)":cat.color};${done?"text-decoration:line-through":""}">${item.name}</div>
              ${item.missable?`<span style="font-size:10px;font-family:monospace;color:#e85555;background:rgba(232,85,85,0.12);border:1px solid rgba(232,85,85,0.3);padding:1px 6px;border-radius:3px">🔴 Missable</span>`:""}
              ${item.category?`<span style="font-size:10px;font-family:monospace;color:${cat.color};background:${cat.bg};border:1px solid ${cat.border};padding:1px 6px;border-radius:3px">${item.category}</span>`:""}
            </div>
            ${item.loc?`<div style="font-size:11px;font-family:monospace;color:var(--text3);margin-bottom:6px">📍 ${item.loc}</div>`:""}
            ${item.unlock?`<div style="font-size:11px;font-family:monospace;color:var(--text2);margin-bottom:6px;padding:4px 8px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid ${cat.border}"><b style="color:${cat.color}">Unlock:</b> ${item.unlock}</div>`:""}
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.65;margin-bottom:8px">${item.desc}</div>
            <div style="display:flex;gap:7px;padding:7px 10px;background:${cat.bg};border-radius:var(--radius)">
              <span style="color:${cat.color};flex-shrink:0">💡</span>
              <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${item.tip}</span>
            </div>
          </div>
        </div>
      </div>`;
    });

    h+=`</div></div>`;
  });

  document.getElementById("secrets-content").innerHTML=h;
}

// ═══════════════════════════════════════════════════
// THE GUILD TAB
// ═══════════════════════════════════════════════════
function renderGuild(){
  const guildQuests=Q.filter(q=>q.r==="Guild").sort((a,b)=>a.o-b.o);
  const keyFacts=[
    {icon:"🏠",label:"Hub",text:"The Hole in the Wall tavern, Grund (the mining quarter east of Kuttenberg). Chenyek is the guild leader; Knuckles and Rat are secondary contacts."},
    {icon:"🔗",label:"Chain order",text:"Feast for the Poor → The Thieves' Code → Beyond the Grave → The German's Treasure → The Spark. Civic Duty (report to bailiff) is a parallel task that cancels The Spark if completed."},
    {icon:"⚔️",label:"Key conflict",text:"Civic Duty vs The Spark are mutually exclusive. Completing Civic Duty cancels The Spark permanently (and Chenyek may be executed). PowerPyx recommends doing The Spark to keep more content and trophies."},
    {icon:"🔴",label:"Missable risk",text:"The Spark is permanently locked if Goliath dies during the Ransom side quest. Also gated behind MQ17 Via Argentum + The Thieves' Code completion — won't appear until both are done."},
    {icon:"🏆",label:"Trophy route",text:"Remember, Remember… — during The Spark: save at mine entrance, kill Goliath, return to campfire, throw barrel into fire (game over + trophy), then reload and complete quest normally."},
    {icon:"💰",label:"Best rewards",text:"Beyond the Grave: 225g. The German's Treasure: up to 295g. The Spark: 150g (Chenyek) or 60g (Knuckles). Civic Duty: 30g per tip + 150g finale."},
  ];

  const reportOutcomes=[
    {who:"Report to Bailiff Plumel — Civic Duty path",when:"After starting Feast for the Poor, visit Plumel in Kuttenberg town hall (upstairs, daytime)",result:"30g per piece of info across the questline. Cancels The Spark permanently if fully completed. Chenyek may be executed. Reward: 150g total finale.",consequence:"neutral"},
    {who:"The Spark — blow the mine with Chenyek",when:"After completing MQ17 Via Argentum + The Thieves' Code, wait 2-3 days for messenger",result:"Sabotage Sigismund's silver mine near Horschan. 150g if loyal to Chenyek; 60g if you side with Knuckles. Closes the guild questline. Civic Duty cancelled.",consequence:"good"},
  ];

  const GKEY="kcd2_guild_v1";
  let gChecked={};
  try{gChecked=JSON.parse(localStorage.getItem(GKEY)||"{}");}catch(e){}

  let h=`
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px">
    <div>
      <h2 style="font-family:'Cinzel',serif;font-size:22px;color:var(--amber2);margin:0">⚖️ The Guild</h2>
      <div style="font-size:11px;font-family:monospace;color:var(--text3);margin-top:3px">Kuttenberg thieves' guild questline · Chenyek at The Hole in the Wall (Grund) · Civic Duty vs The Spark</div>
    </div>
  </div>

  <div style="background:rgba(48,96,160,0.07);border:1px solid rgba(48,96,160,0.2);border-radius:var(--radius2);padding:14px;margin-bottom:20px">
    <div style="font-family:'Cinzel',serif;font-size:13px;color:var(--blue2);margin-bottom:8px">Overview</div>
    <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.7">Henry meets Chenyek — a self-styled people's champion running a thieves' guild out of The Hole in the Wall tavern in Grund (the mining quarter east of Kuttenberg city). The questline is an escalating series of Robin Hood-ish heists against Sigismund's supply chain. It culminates in a choice: <span style="color:var(--amber2)">blow up a silver mine (The Spark)</span> with the Guild, or <span style="color:var(--red2)">report them to the bailiff (Civic Duty)</span>. These two paths are <b>mutually exclusive</b> — completing one permanently cancels the other. The full quest chain also includes a side task (Beyond the Grave, via Rat) and a theft job (The German's Treasure).</div>
  </div>

  <div style="font-family:'Cinzel',serif;font-size:15px;color:var(--amber2);margin-bottom:12px">📋 Key Facts</div>
  <div style="display:grid;gap:6px;margin-bottom:24px">
  ${keyFacts.map(f=>`
    <div style="display:flex;gap:10px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius)">
      <span style="font-size:16px;flex-shrink:0">${f.icon}</span>
      <div>
        <span style="font-size:10px;font-family:monospace;color:var(--amber2);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">${f.label} — </span>
        <span style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6">${f.text}</span>
      </div>
    </div>`).join("")}
  </div>

  <div style="font-family:'Cinzel',serif;font-size:15px;color:var(--amber2);margin-bottom:12px">🚨 Civic Duty vs The Spark</div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;margin-bottom:24px">
  ${reportOutcomes.map((r,i)=>{
    const col=r.consequence==="good"?"var(--green2)":r.consequence==="neutral"?"var(--amber2)":"var(--red2)";
    const bg=r.consequence==="good"?"rgba(58,138,88,0.07)":r.consequence==="neutral"?"rgba(200,134,26,0.06)":"rgba(168,56,48,0.07)";
    const ico=r.consequence==="good"?"✓":"→";
    return`<div style="padding:12px 14px;${i>0?"border-top:1px solid var(--border)":""}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="width:22px;height:22px;border-radius:50%;background:${bg};border:1px solid ${col};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">
          <span style="font-size:11px;color:${col};font-weight:700">${ico}</span>
        </div>
        <div style="flex:1">
          <div style="font-family:'Cinzel',serif;font-size:12px;color:${col};margin-bottom:2px">${r.who}</div>
          <div style="font-size:10px;font-family:monospace;color:var(--text3);margin-bottom:6px">When: ${r.when}</div>
          <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6;padding:7px 10px;background:${bg};border-radius:var(--radius);border-left:2px solid ${col}">${r.result}</div>
        </div>
      </div>
    </div>`;
  }).join("")}
  </div>

  <div style="font-family:'Cinzel',serif;font-size:15px;color:var(--amber2);margin-bottom:12px">📜 Quest Log</div>
  <div style="display:grid;gap:8px;margin-bottom:24px">
  ${guildQuests.map(q=>{
    const done=!!gChecked[q.id];
    const typeCol=q.tp==="Side Quest"?"var(--blue2)":"var(--purple2)";
    const typeBg=q.tp==="Side Quest"?"rgba(48,96,160,0.15)":"rgba(96,64,160,0.15)";
    return`<div onclick="(function(){const k='${GKEY}';const c=JSON.parse(localStorage.getItem(k)||'{}');c['${q.id}']=!c['${q.id}'];localStorage.setItem(k,JSON.stringify(c));renderGuild();})()"
         style="background:var(--bg2);border:1px solid ${done?"rgba(58,138,88,0.35)":"var(--border)"};border-radius:var(--radius2);padding:13px 14px;cursor:pointer;opacity:${done?0.6:1};transition:all 0.15s"
         onmouseenter="this.style.borderColor='var(--amber)'" onmouseleave="this.style.borderColor='${done?"rgba(58,138,88,0.35)":"var(--border)"}'">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="width:22px;height:22px;border:2px solid ${done?"var(--green2)":"var(--amber)"};border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:${done?"rgba(58,138,88,0.2)":"transparent"}">
          ${done?`<span style="color:var(--green2);font-size:13px">✓</span>`:`<span style="font-size:10px;color:var(--amber)">${q.o}</span>`}
        </div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap">
            <span style="font-family:'Cinzel',serif;font-size:13px;color:${done?"var(--text3)":"var(--text)"};${done?"text-decoration:line-through":""}">${q.name}</span>
            <span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:${typeBg};color:${typeCol};font-weight:700">${q.tp}</span>
            ${q.b?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(82,184,114,0.12);color:var(--green2);border:1px solid rgba(82,184,114,0.2)">BRANCHING</span>`:""}
            ${q.m?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(168,56,48,0.15);color:var(--red2)">MISSABLE</span>`:""}
            ${q.g?`<span style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;background:rgba(96,64,160,0.15);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)">🔓 GATED</span>`:""}
          </div>
          <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6;margin-bottom:${q.tip?"7px":"0"}">${q.desc}</div>
          ${q.tip?`<div style="display:flex;gap:7px;padding:6px 9px;background:rgba(200,134,26,0.06);border-radius:var(--radius);border-left:2px solid rgba(200,134,26,0.3)"><span style="color:var(--amber2);flex-shrink:0">💡</span><span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${q.tip}</span></div>`:""}

  </div>

  <div style="padding:10px 14px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);font-size:11px;font-family:monospace;color:var(--text3);text-align:center">
    Click any quest card above to mark it complete · Progress saves in your browser
  </div>`;

  document.getElementById("guild-content").innerHTML=h;
}
</script>
