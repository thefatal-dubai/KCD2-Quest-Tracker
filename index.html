<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCD2 Quest Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d10;--bg2:#111418;--bg3:#181c24;--bg4:#1e2330;--bg5:#252b3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#ddd8c8;--text2:#9a9282;--text3:#5a5448;--text4:#3a3428;
  --amber:#c8861a;--amber2:#e8a83c;--amber3:#f8d080;
  --green:#3a8a58;--green2:#52b872;
  --red:#a83830;--red2:#d05848;
  --blue:#3060a0;--blue2:#5888cc;
  --purple:#6040a0;--purple2:#8868cc;
  --orange:#a85820;--orange2:#d07838;
  --radius:6px;--radius2:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.hdr{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,0.12);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr-icon{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--bg4);border:1px solid var(--amber);border-radius:50%;flex-shrink:0}
.hdr-title{font-family:'Cinzel',serif;font-size:16px;color:var(--amber2);letter-spacing:1px}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px;font-family:monospace}
.hdr-stats{margin-left:auto;display:flex;gap:16px}
.stat{text-align:center}
.stat-v{font-size:19px;font-weight:700;font-family:'Cinzel',serif;color:var(--amber2)}
.stat-l{font-size:10px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;font-family:monospace}
.progress{height:2px;background:var(--bg3);flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .6s}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0}
.tab{padding:9px 15px;font-size:12px;font-family:monospace;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab:hover{color:var(--text2)}.tab.on{color:var(--amber2);border-bottom-color:var(--amber2)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:295px;min-width:255px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.panel{flex:1;overflow-y:auto}
.filters{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;background:var(--bg2);position:sticky;top:0;z-index:20}
.fsearch{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 7px;border-radius:5px;font-family:monospace;width:100%;margin-bottom:3px}
.fsearch:focus{outline:none;border-color:var(--amber)}.fsearch::placeholder{color:var(--text3)}
.fsel{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 6px;border-radius:5px;font-family:monospace;cursor:pointer;flex:1;min-width:70px}
.fsel:focus{outline:none;border-color:var(--amber)}
.rhead{padding:7px 11px 4px;display:flex;align-items:center;gap:5px;position:sticky;top:70px;background:var(--bg2);z-index:19;border-bottom:1px solid var(--border)}
.rname{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)}
.rcnt{font-size:10px;color:var(--text4);font-family:monospace;margin-left:auto}
.rdlc{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)}
.qrow{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;border-bottom:1px solid var(--border)}
.qrow:hover{background:var(--bg3)}.qrow.sel{background:rgba(200,134,26,0.07);border-left-color:var(--amber)}
.qico{font-size:12px;width:15px;text-align:center;flex-shrink:0}
.qname{font-size:12px;color:var(--text);flex:1;line-height:1.3}
.qname.done{color:var(--text3);text-decoration:line-through}
.qbadges{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.bdg{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:2px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
.b-main{background:rgba(200,134,26,0.18);color:var(--amber2);border:1px solid rgba(200,134,26,0.3)}
.b-side{background:rgba(48,96,160,0.2);color:var(--blue2);border:1px solid rgba(48,96,160,0.3)}
.b-task{background:rgba(96,64,160,0.18);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)}
.b-miss{background:rgba(168,56,48,0.2);color:var(--red2);border:1px solid rgba(168,56,48,0.3)}
.b-hmiss{background:rgba(168,56,48,0.35);color:#f09090;border:1px solid rgba(168,56,48,0.5)}
.b-time{background:rgba(168,88,32,0.2);color:var(--orange2);border:1px solid rgba(168,88,32,0.3)}
.b-branch{background:rgba(82,184,114,0.12);color:var(--green2);border:1px solid rgba(82,184,114,0.2)}
.b-lock{background:rgba(168,56,48,0.25);color:#e88080;border:1px solid rgba(168,56,48,0.4)}
.b-act-once{background:rgba(0,180,160,0.15);color:#40d0c0;border:1px solid rgba(0,180,160,0.3)}
.b-act-rep{background:rgba(80,160,200,0.15);color:#70c0e8;border:1px solid rgba(80,160,200,0.3)}
.qstatus{font-size:9px;padding:2px 4px;border-radius:3px;border:none;font-family:monospace;cursor:pointer;flex-shrink:0}
.s0{background:rgba(255,255,255,0.05);color:var(--text3)}.s1{background:rgba(232,168,60,0.18);color:var(--amber2)}
.s2{background:rgba(82,184,114,0.2);color:var(--green2)}.s3{background:rgba(208,88,72,0.2);color:var(--red2)}
.s4{background:rgba(100,100,90,0.15);color:var(--text3)}
.detail{padding:20px 22px;max-width:760px;animation:fadeUp .2s ease}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px}
.d-type{font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.d-title{font-family:'Cinzel',serif;font-size:20px;color:var(--amber2);margin-bottom:3px;line-height:1.2}
.d-region{font-size:11px;color:var(--text3);font-family:monospace;margin-bottom:12px}
.warn-box{background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--red2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.info-box{background:rgba(48,96,160,0.08);border:1px solid rgba(48,96,160,0.25);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--blue2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.tip-box{background:rgba(200,134,26,0.08);border:1px solid rgba(200,134,26,0.2);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--amber2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.d-desc{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:16px;border-left:2px solid rgba(255,255,255,0.07);padding-left:12px;font-style:italic}
.dsec{margin-bottom:16px}
.dsec-title{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:7px}
.status-btns{display:flex;gap:4px;flex-wrap:wrap}
.sbtn{padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);font-size:11px;font-family:monospace;cursor:pointer;transition:all .15s;background:var(--bg3);color:var(--text2)}
.sbtn:hover{border-color:var(--amber);color:var(--amber2)}.sbtn.on{background:rgba(200,134,26,0.15);border-color:var(--amber);color:var(--amber2);font-weight:700}
.notes-ta{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text);font-size:12px;padding:8px 10px;border-radius:var(--radius);font-family:'Crimson Text',serif;resize:vertical;min-height:60px;transition:border-color .2s;line-height:1.5}
.notes-ta:focus{outline:none;border-color:var(--amber)}
.bdiag{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius2);overflow:hidden;margin-top:6px}
.bdiag-title{padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.dec-page,.end-page{padding:18px;max-width:740px;margin:0 auto}
.dec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:12px}
.dec-qname{font-size:10px;font-family:monospace;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.dec-q{font-family:'Cinzel',serif;font-size:13px;color:var(--text);margin-bottom:8px}
.dec-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.chbtn{padding:8px 11px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.12);background:var(--bg3);cursor:pointer;text-align:left;transition:all .15s}
.chbtn:hover{background:var(--bg4)}.chbtn.g{border-color:var(--green);background:rgba(58,138,88,0.1)}.chbtn.b{border-color:var(--red);background:rgba(168,56,48,0.1)}
.ch-type{font-size:9px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.ch-type.good{color:var(--green2)}.ch-type.bad{color:var(--red2)}.ch-type.neutral{color:var(--amber2)}
.ch-label{font-size:12px;color:var(--text);line-height:1.4}
.ch-cons{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4;font-family:monospace}
.end-card{border-radius:var(--radius2);padding:16px;margin-bottom:12px}
.end-good{background:var(--bg2);border:1px solid rgba(58,138,88,0.4)}.end-mid{background:var(--bg2);border:1px solid rgba(200,134,26,0.35)}.end-bad{background:var(--bg2);border:1px solid rgba(168,56,48,0.35)}
.end-hdr{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.end-ico{font-size:24px}
.end-title{font-family:'Cinzel',serif;font-size:16px;color:var(--text)}
.end-sub{font-size:11px;font-family:monospace;margin-top:2px}
.end-desc{font-size:12px;color:var(--text2);line-height:1.65;font-family:monospace;margin-bottom:10px}
.chk-list{display:grid;gap:5px}
.chk-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border)}
.chk-ico{font-size:12px;flex-shrink:0;margin-top:1px}
.chk-txt{font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5}
.chk-txt.done{color:var(--green2)}.chk-q{font-size:10px;color:var(--text3);margin-top:1px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">⚔️</div>
  <div><div class="hdr-title">Kingdom Come: Deliverance II</div><div class="hdr-sub">Quest Tracker · Branch Log · Endings Guide</div></div>
  <div class="hdr-stats">
    <div class="stat"><div class="stat-v" id="s-done">0</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v" id="s-pct" style="color:var(--amber2)">0%</div><div class="stat-l">Completed</div></div>
    <div class="stat"><div class="stat-v" id="s-main" style="color:var(--amber)">0/0</div><div class="stat-l">Main Story</div></div>
    <div class="stat"><div class="stat-v" id="s-side" style="color:var(--blue2)">0/0</div><div class="stat-l">Side Quests</div></div>
    <div class="stat"><div class="stat-v" id="s-miss" style="color:var(--red2)">0</div><div class="stat-l">Missable Left</div></div>
  </div>
</div>
<div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
<div class="tabs">
  <button class="tab on" id="tb-tracker" onclick="setTab('tracker')">📜 Quest Tracker</button>
  <button class="tab" id="tb-decisions" onclick="setTab('decisions')">🔀 Key Decisions</button>
  <button class="tab" id="tb-endings" onclick="setTab('endings')">🏆 Endings Guide</button>
  <button class="tab" id="tb-riddler" onclick="setTab('riddler')">🎭 Riddler Barley</button>
  <button class="tab" id="tb-npcs" onclick="setTab('npcs')">👥 Key NPCs</button>
  <button class="tab" id="tb-forge" onclick="setTab('forge')">🔨 Legacy of the Forge</button>
  <button class="tab" id="tb-missable" onclick="setTab('missable')">⚠️ Missable Quests</button>
  <button class="tab" id="tb-loot" onclick="setTab('loot')">💰 Notable Loot</button>
  <button class="tab" id="tb-romance" onclick="setTab('romance')">💕 Romance</button>
  <button class="tab" id="tb-trophies" onclick="setTab('trophies')">🏆 Trophies</button>
  <button class="tab" id="tb-shepherds" onclick="setTab('shepherds')">🐑 Shepherd Questline</button>
</div>
<div class="main" id="app-main">
  <div id="page-tracker" style="display:flex;flex:1;overflow:hidden">
    <div class="sidebar">
      <div class="filters">
        <input class="fsearch" id="search-inp" placeholder="🔍  Search quests…" oninput="renderList()">
        <select class="fsel" id="f-type" onchange="renderList()">
          <option value="">All Types</option><option value="Main Quest">Main Quests</option>
          <option value="Side Quest">Side Quests</option><option value="Task">Tasks</option>
          <option value="act-once">⚡ Activities (one-time)</option>
          <option value="act-rep">🔁 Activities (repeatable)</option>
        </select>
        <select class="fsel" id="f-status" onchange="renderList()">
          <option value="">All Statuses</option><option value="0">Not Started</option>
          <option value="1">In Progress</option><option value="2">Completed</option>
          <option value="3">Failed</option><option value="4">Skipped</option>
        </select>
        <select class="fsel" id="f-region" onchange="renderList()">
          <option value="">All Regions</option>
          <option value="Trosky">Trosky</option><option value="Kuttenberg">Kuttenberg</option>
          <option value="DLC1">DLC - Brushes with Death</option>
          <option value="DLC2">DLC - Legacy of the Forge</option>
          <option value="DLC3">DLC - Mysteria Ecclesiae</option>
          <option value="DLC4">DLC - Horse Races</option>
        </select>
      </div>
      <div id="quest-list"></div>
    </div>
    <div class="panel" id="detail-panel">
      <div class="detail-empty" style="height:100%">
        <div style="font-size:48px;opacity:0.15">📜</div>
        <div style="font-size:13px;font-family:monospace;color:var(--text3)">Select a quest to view details</div>
        <div style="font-size:11px;font-family:monospace;color:var(--text4);margin-top:4px">126 quests · 32 main · 40 side · 54 tasks</div>
      </div>
    </div>
  </div>
  <div id="page-decisions" style="display:none;flex:1;overflow-y:auto"><div class="dec-page" id="dec-content"></div></div>
  <div id="page-endings" style="display:none;flex:1;overflow-y:auto"><div class="end-page" id="end-content"></div></div>
  <div id="page-riddler" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="riddler-content"></div></div>
  <div id="page-npcs" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="npcs-content"></div></div>
  <div id="page-forge" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="forge-content"></div></div>
  <div id="page-missable" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="missable-content"></div></div>
  <div id="page-loot" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="loot-content"></div></div>
  <div id="page-romance" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="romance-content"></div></div>
  <div id="page-trophies" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:860px;margin:0 auto" id="trophies-content"></div></div>
  <div id="page-shepherds" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:760px;margin:0 auto" id="shepherds-content"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// REGIONS
// ═══════════════════════════════════════════════════
const REGIONS=[
  {id:"Trosky",label:"Trosky",icon:"🏰",dlc:false},
  {id:"Kuttenberg",label:"Kuttenberg",icon:"⛏️",dlc:false},
  {id:"DLC1",label:"DLC — Brushes with Death",icon:"🎨",dlc:true},
  {id:"DLC2",label:"DLC — Legacy of the Forge",icon:"🔨",dlc:true},
  {id:"DLC3",label:"DLC — Mysteria Ecclesiae",icon:"✝️",dlc:true},
  {id:"DLC4",label:"DLC — Horse Races",icon:"🐴",dlc:true},
];

// ═══════════════════════════════════════════════════
// QUESTS — 126 total (real names from game)
// status: 0=Not Started 1=In Progress 2=Completed 3=Failed 4=Skipped
// m=missable hm=highly_missable t=time_sensitive b=has_branches l=locks_content
// ═══════════════════════════════════════════════════
const Q=[
// ── TROSKY MAIN QUESTS (12) ──────────────────────
{id:"mq01",r:"Trosky",tp:"Main Quest",o:1,name:"Last Rites",m:false,hm:false,t:false,b:false,l:false,
 desc:"The prologue. Henry and his companions defend the castle in a desperate last stand before fleeing into the wilds of Bohemia.",
 tip:"Tutorial quest. Take your time learning the combat system — it's unforgiving throughout the game.",status:0,notes:""},
{id:"mq02",r:"Trosky",tp:"Main Quest",o:2,name:"Easy Riders",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and his party make camp and attempt to regroup after the chaos of the prologue.",
 tip:"Explore the camp area carefully — a collectible is hidden near the wagon.",status:0,notes:""},
{id:"mq03",r:"Trosky",tp:"Main Quest",o:3,name:"Fortuna",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans struggle to survive, searching for safety and supplies in hostile territory.",
 tip:"Looting enemies thoroughly here sets you up well for the early game.",status:0,notes:""},
{id:"mq04",r:"Trosky",tp:"Main Quest",o:4,name:"Laboratores",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans arrive in Troskowitz and begin planning their next move with local allies.",
 tip:"Talk to every named NPC in Troskowitz — several side quests become available here.",status:0,notes:""},
{id:"mq05",r:"Trosky",tp:"Main Quest",o:5,name:"Wedding Crashers",m:false,hm:false,t:false,b:true,l:true,
 desc:"The open world fully opens. To get into the Semine wedding Henry must choose between two paths: Blacksmith Radovan (combat-focused, unlocks The Blacksmith's Son / Jaunt / Hermit chains) or Miller Kreyzl (stealth-focused, unlocks Materia Prima / Forbidden Fruit / Opus Magnum). Both paths can be progressed but you must choose ONE to attend the wedding with. The Blacksmith path unlocks significantly more side content.",
 tip:"⚠️ You can do BOTH questlines right up until the moment you go to the wedding — only then must you pick one. Blacksmith path recommended for completionists. Also: win Farkle against Innkeeper Betty to get the Gold Wedding Badge (lets you reroll dice, very useful all game).",status:0,notes:""},
{id:"mq06",r:"Trosky",tp:"Main Quest",o:6,name:"For Whom the Bell Tolls",m:false,hm:false,t:true,b:true,l:false,
 desc:"Henry is freed from jail to work off his debt while Hans faces the gallows for poaching. 12 in-game hours to save him — each bell toll is one hour (every 5 real minutes). Multiple paths to reach Captain Thomas: carry charcoal sacks, forge a horseshoe for Blacksmith Osina, get lockpicks from Hired Hand Kabat (return his turquoise rosary from Father Nicodemus via dice, pickpocket, or coin), help Cook Fanka unlock her spice chest, or talk to Jarek to be escorted into the Maiden Tower. Craft Fever Tonic in the Crone Tower to cure Thomas.",
 tip:"⏱️ 12 bells = game over for Hans. You have enough time to do everything if you don't dawdle. Forge the horseshoe first (opens up Kabat), then get lockpicks, then the rosary route into the Maiden Tower is fastest. Also: Opus Magnum side quest can be advanced here — visit Scribe Erazim in the Crone Tower while you're brewing the tonic.",status:0,notes:""},
{id:"mq07",r:"Trosky",tp:"Main Quest",o:7,name:"Back in the Saddle",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry and Hans travel to reach Lord Nebak. A key early decision about the Semine family will either protect them or put them at risk — affecting Old Wounds and the eventual ending.",
 tip:"⚠️ Do NOT betray the Semine secret to Otto. This affects the ending path.",status:0,notes:""},
{id:"mq08",r:"Trosky",tp:"Main Quest",o:8,name:"Necessary Evil",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry must extract critical information from a prisoner. Morally uncomfortable but unavoidable.",
 tip:"⚠️ TROSKY POINT OF NO RETURN. Complete ALL Trosky side quests before starting this.",status:0,notes:""},
{id:"mq09",r:"Trosky",tp:"Main Quest",o:9,name:"For Victory!",m:false,hm:false,t:false,b:false,l:false,
 desc:"The Trosky forces muster for a decisive engagement. Henry's role is crucial to the outcome.",
 tip:"Stock up on healing supplies and repair your gear before this quest.",status:0,notes:""},
{id:"mq10",r:"Trosky",tp:"Main Quest",o:10,name:"Divine Messenger",m:false,hm:false,t:false,b:false,l:false,
 desc:"A mission that requires subtlety and disguise. Henry acts as an unlikely emissary.",
 tip:"Speech skill above 10 opens several extra dialogue paths.",status:0,notes:""},
{id:"mq11",r:"Trosky",tp:"Main Quest",o:11,name:"The Finger of God",m:false,hm:false,t:false,b:false,l:false,
 desc:"A dramatic confrontation with heavy consequences for Trosky's political landscape.",
 tip:"Preparation pays off here — complete combat training side quests first.",status:0,notes:""},
{id:"mq12",r:"Trosky",tp:"Main Quest",o:12,name:"Storm",m:false,hm:false,t:false,b:true,l:true,
 desc:"The Trosky storyline's climax. Istvan Toth must be confronted. Two branches: (A) Offer Istvan a honourable duel — fight him one-on-one. If you win, it counts as an honourable kill and awards the Honourable Duel trophy. Affects ending score positively and parents approve. (B) Defenestrate Istvan — throw him from the castle window during the confrontation. Counts as dishonourable, negatively affects ending score, parents disapprove. There is no middle path; one of these two must happen before you can advance to Kuttenberg.",
 tip:"⚠️ FIGHT THE DUEL. Defenestration is faster but permanently costs you Honour and the good ending path. Prepare for the duel: Sword 15+, your best weapon fully repaired. Istvan fights dirty at low health — don't let up.",status:0,notes:""},

// ── KUTTENBERG MAIN QUESTS (20) ──────────────────
{id:"mq13",r:"Kuttenberg",tp:"Main Quest",o:1,name:"The Sword and the Quill",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry arrives in the silver city of Kuttenberg — wealthier, more dangerous, and more politically complex than Trosky.",
 tip:"Talk to the bathhouse owner Adam early — he's a major quest hub for Kuttenberg.",status:0,notes:""},
{id:"mq14",r:"Kuttenberg",tp:"Main Quest",o:2,name:"Speak of the Devil",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry begins navigating the dangerous web of factions operating in and around Kuttenberg.",
 tip:"",status:0,notes:""},
{id:"mq15",r:"Kuttenberg",tp:"Main Quest",o:3,name:"Into the Underworld",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry goes deeper into Kuttenberg's criminal underworld to find the information he needs.",
 tip:"Master Schindel's Toys task and Rosa's Book task unlock during this quest — don't miss them.",status:0,notes:""},
{id:"mq16",r:"Kuttenberg",tp:"Main Quest",o:4,name:"Via Argentum",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry follows the trail of silver — and corruption — deeper into the mines and the city's power structures.",
 tip:"The Fifth Commandment and Post Scriptum side quests unlock after this.",status:0,notes:""},
{id:"mq17",r:"Kuttenberg",tp:"Main Quest",o:5,name:"The Word and the Flesh",m:false,hm:false,t:false,b:false,l:false,
 desc:"Religious and political tensions boil over as Henry gets closer to the truth.",
 tip:"",status:0,notes:""},
{id:"mq18",r:"Kuttenberg",tp:"Main Quest",o:6,name:"Prey",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry becomes the hunted. Stealth and awareness are critical.",
 tip:"Keep Mutt with you — his alert behaviour can save your life in this quest.",status:0,notes:""},
{id:"mq19",r:"Kuttenberg",tp:"Main Quest",o:7,name:"A Dark Corner",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry uncovers a disturbing secret hidden in the darkest corner of Kuttenberg.",
 tip:"",status:0,notes:""},
{id:"mq20",r:"Kuttenberg",tp:"Main Quest",o:8,name:"Sins of the Father",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry grapples with truths about his own past that surface alongside the main conspiracy.",
 tip:"",status:0,notes:""},
{id:"mq21",r:"Kuttenberg",tp:"Main Quest",o:9,name:"Family Silver",m:false,hm:false,t:false,b:false,l:false,
 desc:"The silver conspiracy comes into clearer focus. Powerful men are exposed.",
 tip:"",status:0,notes:""},
{id:"mq22",r:"Kuttenberg",tp:"Main Quest",o:10,name:"The Hussite Wedding",m:false,hm:false,t:false,b:false,l:false,
 desc:"A tense social event that serves as cover for a dangerous intelligence operation.",
 tip:"Dress appropriately — wearing the right clothes gives bonuses in conversation.",status:0,notes:""},
{id:"mq23",r:"Kuttenberg",tp:"Main Quest",o:11,name:"A Needle in a Haystack",m:false,hm:false,t:false,b:true,l:false,
 desc:"Henry must infiltrate Sedletz Monastery to expose a conspirator hiding among the clergy. Three branches: (A) Full stealth — slip in at night, gather evidence by searching cells and eavesdropping on confessions, identify the conspirator without alerting anyone. Cleanest outcome, no monks harmed, Sedletz remains friendly. (B) Persuasion — befriend the abbot and get access through dialogue (Speech 9+), then use the evidence to confront the conspirator publicly. (C) Force — enter openly, threaten monks for information, culminating in a brawl. The conspirator is caught but Sedletz turns hostile and the monastery NPCs remain unfriendly for the rest of the game.",
 tip:"Stealth path is strongly recommended — Sedletz has unique loot and quest content (Thou art but dust…) that requires good standing with the monks. Force locks you out of significant content. Approach at night, wear dark clothing, and bring lockpicks.",status:0,notes:""},
{id:"mq24",r:"Kuttenberg",tp:"Main Quest",o:12,name:"Oratores",m:false,hm:false,t:false,b:false,l:false,
 desc:"A critical story advancement. Henry's actions here set the stage for the final act.",
 tip:"⚠️ KUTTENBERG POINT OF NO RETURN. Complete ALL Kuttenberg side quests before this.",status:0,notes:""},
{id:"mq25",r:"Kuttenberg",tp:"Main Quest",o:13,name:"The Prodigal Son",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry confronts aspects of his identity and history that he can no longer avoid.",
 tip:"",status:0,notes:""},
{id:"mq26",r:"Kuttenberg",tp:"Main Quest",o:14,name:"All that Glitters",m:false,hm:false,t:false,b:false,l:false,
 desc:"The silver conspiracy fully unravels. Henry is at the centre of a dangerous unravelling of power.",
 tip:"",status:0,notes:""},
{id:"mq27",r:"Kuttenberg",tp:"Main Quest",o:15,name:"Thou shalt not kill",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry faces the Dancing with the Devil decision — Dry Devil demands an act of atrocity. This is the most important moral choice in the game with permanent ending consequences.",
 tip:"⚠️ REFUSE to burn Maleshov. Agreement permanently blocks the good ending. No redemption exists.",status:0,notes:""},
{id:"mq28",r:"Kuttenberg",tp:"Main Quest",o:16,name:"Come What May",m:false,hm:false,t:false,b:true,l:true,
 desc:"The crisis in Kuttenberg reaches its peak. This quest contains the Istvan Toth confrontation — the most consequential single choice in the game for the ending. Two branches: (A) Offer Istvan a honourable duel and win — honourable kill, positive ending score, parents approve, Honourable Duel trophy. (B) Kill Istvan without a duel (overwhelm him, use allies, or defenestrate him during the prior Storm confrontation if that was your choice) — dishonourable kill, negative ending score, parents disapprove. Istvan must die either way; only the method matters.",
 tip:"⚠️ This is your last chance to handle Istvan correctly if you didn't duel him in Storm. Sword skill 15+ and a fully repaired weapon are strongly recommended. Don't bring companions into the fight — it may auto-flag as dishonourable even if you meant to duel.",status:0,notes:""},
{id:"mq29",r:"Kuttenberg",tp:"Main Quest",o:17,name:"For the Greater Good",m:false,hm:false,t:false,b:true,l:false,
 desc:"Henry is asked to betray someone he trusts to protect a larger cause — the details shift depending on your alliances, but the core choice is the same. Two branches: (A) Comply willingly — go through with the betrayal, accept the moral weight of it. The people asking remember Henry as someone who made the hard choice. Unlocks a specific late-game dialogue. (B) Refuse and find an alternative — requires prior quest flags (high Honour, specific earlier choices) to have a viable third path. If no alternative exists, you are forced into compliance anyway. Either way the main story advances — the branch is about how Henry and those around him feel about it.",
 tip:"Whether a genuine choice exists here depends on your Honour score and earlier decisions. Play with high Honour and don't cut corners in prior quests to keep the alternative open.",status:0,notes:""},
{id:"mq30",r:"Kuttenberg",tp:"Main Quest",o:18,name:"Reckoning",m:false,hm:false,t:false,b:true,l:true,
 desc:"Three pivotal choices in quick succession: spare or kill Brabant after the duel, let Markvart von Aulitz die naturally or kill him yourself, and whether to save Samuel. These three choices together determine the ending.",
 tip:"⚠️ Spare Brabant. Let Markvart die naturally. Save Samuel. All three = good ending path.",status:0,notes:""},
{id:"mq31",r:"Kuttenberg",tp:"Main Quest",o:19,name:"To Dust you Shan't Return",m:false,hm:false,t:false,b:false,l:false,
 desc:"The penultimate chapter. The consequences of Henry's entire journey crystallise.",
 tip:"",status:0,notes:""},
{id:"mq32",r:"Kuttenberg",tp:"Main Quest",o:20,name:"Last Rites",m:false,hm:false,t:false,b:true,l:false,
 desc:"The final quest. Henry faces judgment — but the ending is already sealed by every choice made before this moment.",
 tip:"There is no last-minute choice that changes your ending. It is determined by prior decisions.",status:0,notes:""},

// ── TROSKY SIDE QUESTS (17) ──────────────────────
{id:"sq01",r:"Trosky",tp:"Side Quest",o:1,name:"The Blacksmith's Son",m:false,hm:false,t:false,b:false,l:false,
 desc:"Help the blacksmith in Tachov deal with a family crisis. Start of the Blacksmith's questline.",
 tip:"Start this as soon as you arrive in Tachov. Required to unlock The Jaunt.",status:0,notes:""},
{id:"sq02",r:"Trosky",tp:"Side Quest",o:2,name:"The Jaunt",m:true,hm:false,t:false,b:false,l:false,
 desc:"The blacksmith's questline continues with a more adventurous errand. Introduces the rogue character Gules.",
 tip:"Must finish before the Semine wedding. Talk to Blacksmith Radovan in Tachov after The Blacksmith's Son.",status:0,notes:""},
{id:"sq03",r:"Trosky",tp:"Side Quest",o:3,name:"The Hermit",m:false,hm:false,t:false,b:false,l:false,
 desc:"A reclusive hermit holds answers about a local mystery. Complete ALL optional objectives to unlock A Sinful Soul.",
 tip:"Do every optional step — skipping any locks out the 'A Sinful Soul' task permanently.",status:0,notes:""},
{id:"sq04",r:"Trosky",tp:"Side Quest",o:4,name:"Materia Prima",m:false,hm:false,t:false,b:false,l:false,
 desc:"Begin the Miller's questline at Lower Semine Mill. The miller has an unusual and philosophical hobby.",
 tip:"Part 1 of 3 in the Miller questline. Do them in order.",status:0,notes:""},
{id:"sq05",r:"Trosky",tp:"Side Quest",o:5,name:"Forbidden Fruit",m:false,hm:false,t:false,b:true,l:false,
 desc:"Miller Kreyzl needs saltpetre for his alchemy. Part 2 of the Miller questline (Kreyzl path only). Bonnie directs Henry to Gravedigger Ignatius east of Troskowitz — his carcass burial pits are rich in saltpetre. Two branches: (A) Help Ignatius on his rounds — accompany him on his wagon at daybreak (5am), help him find a rotting deer carcass, investigate poisoned animal deaths at a farm (the river upstream is the source), bag and load two dead pigs, and deal with a greengrocer's dog. After completing all tasks Ignatius takes Henry to the pit. Reward: Knacker's Gloves + pit location. Required for the Boneworks trophy. (B) Skip Ignatius and find the pit yourself — the saltpetre pit is directly east of the graveyard, past the sheep pen next to the road. No need to do any of Ignatius's tasks. You miss the Knacker's Gloves but complete the quest faster.",
 tip:"The Ignatius route (A) is worth doing for the Boneworks trophy (requires this + Thou art but dust…). Tell Ignatius the truth when he asks why you need the pit — it gives reputation. Bring fresh meat as a gift (optional — doesn't skip his tasks but gives rep). Wait until 5am to meet him or he'll refuse to start. The dog task has a surprise: follow the barking to find it with Bonnie, then tell her the truth — she'll take the dog away and you can lie to Ignatius that it's done.",status:0,notes:""},
{id:"sq06",r:"Trosky",tp:"Side Quest",o:6,name:"Opus Magnum",m:false,hm:false,t:false,b:false,l:false,
 desc:"The conclusion of the Miller's questline. The results of his experiments are finally revealed.",
 tip:"Best rewards in this questline come from following all optional steps in parts 1 and 2.",status:0,notes:""},
{id:"sq07",r:"Trosky",tp:"Side Quest",o:7,name:"Frogs",m:false,hm:false,t:false,b:true,l:true,
 desc:"A bitter feud between Tachov and Zhelejov villages. Olbram (Zhelejov) wants Henry to steal the Maypole. Mutually exclusive with Mice — you cannot complete both fully. A third peaceful resolution exists via the Iron Nail oak tree.",
 tip:"To unlock the peaceful resolution in Battle of the Frogs and Mice: investigate local history with the Bailiff in Troskowitz. This reveals the Iron Nail embedded in an oak tree marking the true border — forcing a peace treaty. Best outcome for both villages.",status:0,notes:""},
{id:"sq08",r:"Trosky",tp:"Side Quest",o:8,name:"Mice",m:false,hm:false,t:false,b:true,l:true,
 desc:"The other side of the Tachov/Zhelejov feud. Prochek (Tachov) wants Henry to paint the bull. Mutually exclusive with Frogs — you cannot fully complete both. To start Mice after starting Frogs: rat out Prochek to Olbram.",
 tip:"Both Frogs and Mice must be started to unlock Battle of the Frogs and Mice. Truce trophy requires all three quests.",status:0,notes:""},
{id:"sq09",r:"Trosky",tp:"Side Quest",o:9,name:"Battle of the Frogs and Mice",m:false,hm:false,t:false,b:true,l:false,
 desc:"The conclusion of the Tachov/Zhelejov conflict. Three possible outcomes: side with Tachov (Mice ending), side with Zhelejov (Frogs ending), or broker a lasting peace via the Iron Nail border marker.",
 tip:"Peaceful resolution (best outcome): investigate local history with the Bailiff in Troskowitz. This reveals an Iron Nail embedded in an oak tree between the villages — the true historical border. Using this evidence lets Henry force a peace treaty. Earns the Truce trophy.",status:0,notes:""},
{id:"sq10",r:"Trosky",tp:"Side Quest",o:10,name:"Troubadours",m:false,hm:false,t:false,b:true,l:false,
 desc:"Two travelling musicians at the Zhelejov Wagoners' Inn are in trouble — their lute has been stolen by a local thug named Vashek, and one of them, Ondra, owes money to the innkeeper. Two main branches: (A) Recover the lute by confronting Vashek (combat or Speech 8+ persuasion) and pay off or negotiate Ondra's debt — the musicians perform a private concert for Henry, unlocking a unique buff song. (B) Leave them to sort it out — they leave the inn, and the concert and buff are permanently missed. A third option: buy out Ondra's debt yourself for 80g, which gives a bonus relationship with the innkeeper.",
 tip:"Worth doing fully — the buff song from the private concert applies a temporary Charisma boost that stacks with clothes bonuses. Confronting Vashek with Speech is cleanest; if you fight him, the innkeeper's mood sours slightly.",status:0,notes:""},
{id:"sq11",r:"Trosky",tp:"Side Quest",o:11,name:"Mutt",m:false,hm:false,t:false,b:false,l:false,
 desc:"Find and rescue your loyal dog. Mutt becomes a permanent companion who alerts Henry to enemies and hidden items.",
 tip:"Get Mutt as early as possible — he's invaluable throughout the game and earns the Man's Best Friend trophy.",status:0,notes:""},
{id:"sq12",r:"Trosky",tp:"Side Quest",o:12,name:"Lackey",m:false,hm:false,t:false,b:true,l:false,
 desc:"Vostatek — a disgraced nobleman now working as a manservant — hires Henry for odd jobs. The questline has a critical branching point: Vostatek is a functioning alcoholic, and during Bird of Prey he will attempt to drink himself senseless before a critical meeting. Two branches: (A) Prevent Vostatek from drinking — sober him up before the meeting, go with him, and he confesses his full past to the poachers who wronged him. This unlocks a secret confrontation scene and additional closure. The poachers stand down without violence. (B) Let Vostatek drink — he gets blind drunk, misses the meeting, the confrontation with the poachers is purely combat, and his backstory is never revealed.",
 tip:"Keeping Vostatek sober is harder (you must distract or remove the wine jug, then physically accompany him) but gives the most satisfying ending and unique dialogue. The confession scene reveals that the poachers were actually his own former servants he had wronged — the best writing in this questline.",status:0,notes:""},
{id:"sq13",r:"Trosky",tp:"Side Quest",o:13,name:"Combat Training 1",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Train with the fighters at the Nomad's Camp. Significantly improves Henry's combat skills.",
 tip:"Do both Combat Training quests before any major combat — the skill bonuses are substantial.",status:0,notes:""},
{id:"sq14",r:"Trosky",tp:"Side Quest",o:14,name:"Combat Training 2",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Advanced combat training at the Nomad's Camp.",
 tip:"",status:0,notes:""},
{id:"sq15",r:"Trosky",tp:"Side Quest",o:15,name:"Miri Fajta",m:false,hm:false,t:false,b:true,l:false,
 desc:"'Our family' in Romani. The Nomad's Camp is fractured by a feud — Aranka's leadership is being challenged by her nephew Bora, who wants to take the camp in a more violent direction. Three branches: (A) Support Aranka and broker peace within the family — requires high Speech or completing favours for both sides before the confrontation. Unlocks Klára's full romance arc and The Voivode's Curse. (B) Back Bora — Aranka is sidelined, the camp dynamic hardens, Klára becomes distant and her romance arc is shortened. (C) Stay neutral — the family splits, some members leave, and Aranka loses authority. Klára's questline still opens but the romance ending is less resolved.",
 tip:"Supporting Aranka is the richest path — she gives the most follow-on content and Klára's full arc only opens this way. Before the confrontation, do favours for both sides to raise your standing enough for the Speech option to appear.",status:0,notes:""},
{id:"sq16",r:"Trosky",tp:"Side Quest",o:16,name:"Bad Blood",m:false,hm:false,t:false,b:true,l:false,
 desc:"Herbwoman Bozhena's daughter Pavlena has gone missing in Troskowitz. Investigate her disappearance — she was secretly seeing a man named Roman, who is found murdered. Farmhand Straw's brother Ota has taken Pavlena hostage. At the gorge: don't move when you enter or Ota kills her. Negotiate — appeal to God's forgiveness, then promise to put in a good word with Von Bergow. After rescuing her, Bozhena demands you kill farmer Jakesh (the man who had her banished). You can kill him, take him to the bailiff, or persuade him to make peace. The ending depends on this final choice.",
 tip:"BEST OUTCOME: Persuade Jakesh to make peace (pays Bozhena 100g compensation, she returns to town). Pavlena and Bozhena become available as trainers/traders. WARNING: If you refuse to help at all, Bozhena hangs herself and Pavlena is executed days later. Keep Ota's dog alive — mention it during negotiations for better outcomes.",status:0,notes:""},
{id:"sq17",r:"Trosky",tp:"Side Quest",o:17,name:"Invaders",m:false,hm:false,t:false,b:true,l:false,
 desc:"A raiding party is threatening Troskowitz — armed men from a rival lord's camp are moving through the area, extorting villages and driving off livestock. Two branches: (A) Defend Troskowitz by force — rally the guards, set an ambush, and drive the raiders off in combat. Straightforward but requires solid combat stats. The village rewards Henry with coin and improved reputation. (B) Negotiate with the raider captain — he's actually a mercenary under orders from a minor lord with a legitimate grievance against Troskowitz's bailiff. Expose the bailiff's wrongdoing via Speech 8+, and the captain stands down without a fight. The bailiff is removed, the village is safer long-term, and Henry gets a better reward.",
 tip:"The negotiation path requires talking to the raider captain before the ambush triggers — do NOT let the village guards attack first. Speak to the captain alone near the forest edge at dusk. His grievance is detailed in a letter on his person (you can pickpocket it first to gain leverage).",status:0,notes:""},

// ── TROSKY TASKS (19) ────────────────────────────
{id:"t01",r:"Trosky",tp:"Task",o:1,name:"A Sinful Soul",m:true,hm:true,t:false,b:false,l:false,
 desc:"A task unlocked only by completing all optional objectives in 'The Hermit'. A deeply personal story of guilt and redemption.",
 tip:"🔴 HIGHLY MISSABLE: Only available if you complete every optional step in The Hermit. Speak to Margaret in the graveyard afterwards.",status:0,notes:""},
{id:"t02",r:"Trosky",tp:"Task",o:2,name:"Canker",m:true,hm:false,t:false,b:false,l:false,
 desc:"First task in the Gules questline (Semine). Gules — a former bandit turned guard — needs Henry's help tracking a criminal called Canker.",
 tip:"⛔ BLOCKED if Semine family was destroyed in Necessary Evil (Hashek path). Gules only exists if the family survived. Complete before Necessary Evil.",status:0,notes:""},
{id:"t03",r:"Trosky",tp:"Task",o:3,name:"Handsome Charlie",m:true,hm:false,t:false,b:false,l:false,
 desc:"Second task in the Gules questline. Track down a criminal called Handsome Charlie.",
 tip:"⛔ BLOCKED if Semine family destroyed. Requires Canker to be completed first. Must complete before Necessary Evil.",status:0,notes:""},
{id:"t04",r:"Trosky",tp:"Task",o:4,name:"Johnny the Gob",m:true,hm:false,t:false,b:true,l:false,
 desc:"Third task in the Gules questline. Track down Johnny the Gob. Note: if you spare Johnny he surrenders his shield and flees — fast travel back to Gules immediately or the quest bugs out. Knocking him out after he surrenders is a reliable workaround.",
 tip:"⛔ BLOCKED if Semine family destroyed. Bug warning: if Johnny is spared, fast travel to Gules instantly or knock Johnny out first to prevent auto-complete failure.",status:0,notes:""},
{id:"t05",r:"Trosky",tp:"Task",o:5,name:"Casper",m:true,hm:false,t:false,b:false,l:false,
 desc:"Fourth and final task in the Gules questline.",
 tip:"⛔ BLOCKED if Semine family destroyed. Must complete before Necessary Evil.",status:0,notes:""},
{id:"t06",r:"Trosky",tp:"Task",o:6,name:"Melee at the Mill",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Brawler questline begins at Lower Semine Mill. Fight in underground bare-knuckle bouts.",
 tip:"Win all four brawler questline tasks for the Henry the Bruiser trophy.",status:0,notes:""},
{id:"t07",r:"Trosky",tp:"Task",o:7,name:"More Melee at the Mill",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"Repeatable brawler fights at the mill. Doesn't count toward the 'Been There Done That' total.",
 tip:"Only the first completion of each unique fight counts toward trophies.",status:0,notes:""},
{id:"t08",r:"Trosky",tp:"Task",o:8,name:"Wine, Women and Blood",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Brawler questline moves to the Zhelejov Wagoners' Inn.",
 tip:"",status:0,notes:""},
{id:"t09",r:"Trosky",tp:"Task",o:9,name:"The Best for Last",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Final brawler questline task. The toughest fight of the questline.",
 tip:"Having Combat Training 1 and 2 done makes this significantly easier.",status:0,notes:""},
{id:"t10",r:"Trosky",tp:"Task",o:10,name:"The Voivode's Curse",m:false,hm:false,t:false,b:true,l:false,
 desc:"Unlocked after Miri Fajta. Aranka asks Henry to investigate a curse plaguing the Nomad's Camp — the camp's animals are dying and the voivode Dobromir is blamed. Three branches: (A) Believe Dobromir is innocent, investigate the real culprit (a jealous camp member poisoning the water supply) and clear his name — best outcome, Dobromir remains and Aranka's trust deepens. (B) Side with those who want Dobromir exiled — he leaves the camp permanently, affecting Klára's questline resolution. (C) Ignore the investigation and report Dobromir guilty without evidence — he is cast out, camp morale drops, Klára is hostile in remaining interactions.",
 tip:"Best outcome: investigate the water source before confronting anyone. The real culprit is revealed through the poisoned horse trough — look for the bitter herbs near the well. Siding with Dobromir also opens additional Nomad's Camp trust and feeds into Klára's romance arc.",status:0,notes:""},
{id:"t11",r:"Trosky",tp:"Task",o:11,name:"The Axe from the Lake",m:false,hm:false,t:false,b:true,l:false,
 desc:"Villagers in Tachov speak of a legendary axe submerged in the lake south of the village — said to belong to a drowned miller. Two branches: (A) Dive and retrieve the axe, return it to the miller's widow in Tachov — she rewards Henry with coin and the axe becomes a unique loot item. (B) Keep the axe for yourself — it's a well-maintained weapon but the widow's questline closes off and she treats Henry coldly for the rest of the game.",
 tip:"Return the axe — the widow's gratitude opens a small follow-on interaction and the reward is fair. The axe itself isn't significantly better than weapons you'll find elsewhere.",status:0,notes:""},
{id:"t12",r:"Trosky",tp:"Task",o:12,name:"Bird of Prey",m:false,hm:false,t:false,b:false,l:false,
 desc:"Part of Vostatek's questline. Henry accompanies Vostatek to confront the poachers who wronged him. The outcome depends on whether you kept Vostatek sober in Lackey — see that quest's branch for full details.",
 tip:"Do Lackey first and keep Vostatek sober for the full confession ending.",status:0,notes:""},
{id:"t13",r:"Trosky",tp:"Task",o:13,name:"Sheep among Wolves",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain: Mutt → Sheep among Wolves → The Lost Sheep → Carrot on a Stick → Hunting the Werewolf. Triggered by Innkeeper Betty in Troskowitz 72 hours after completing Mutt. She mentions Herdsboy Siegfried has wolf trouble — go see him north of Tachov. Siegfried asks Henry to track down the wolf pack killing his sheep. Follow blood trail west into the woods, find the pack and kill them, bring back two wolf ears as proof. Siegfried rewards Henry with a special die and points him toward Smoliek and Stanislav for more shepherd work.",
 tip:"Must complete Mutt first, then wait 3 in-game days before Betty has the tip. Mutt is invaluable here — he alerts you to the wolves before you see them. Earns Shepherd's Champion trophy only if you complete all four tasks through Hunting the Werewolf.",status:0,notes:""},
{id:"t14",r:"Trosky",tp:"Task",o:14,name:"The Lost Sheep",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain quest 2 of 4. Shepherd Smoliek, southwest of Tachov (met during Mutt), has lost a sheep to wolves and needs its branded ear as proof it wasn't sold. Head into the woods west of Smoliek — find the dead sheep in the centre of the search area surrounded by wolves. Loot the ear directly from the dead sheep (no butchering needed). Return to Smoliek. He rewards Henry with cheap wine, Weak Marigold decoction, bandages, dried apple, cooked carrot, and the Die of Misfortune.",
 tip:"The wolves around the sheep can be avoided — just rush in and loot the ear if your combat level is low. Keep the Cooked Carrot reward; you'll need it for Carrot on a Stick.",status:0,notes:""},
{id:"t15",r:"Trosky",tp:"Task",o:15,name:"Carrot on a Stick",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain quest 3 of 4. Shepherd Stanislav near Apollonia fast travel point bought a new ram that ran off into the wolf-filled forest. Find the ram in the woods east of Stanislav — it's alone on a meadow. To get it to follow you back, you need a Carrot in your inventory (the Cooked Carrot from The Lost Sheep works). Walk it back to the pen at Stanislav's farm. Stanislav rewards Henry with coin, supplies, and the Lucky Die. If all three previous shepherd tasks are done, Stanislav marks the final task: Hunting the Werewolf.",
 tip:"The sheep follows you automatically if you have any carrot in inventory — don't eat them before this quest. Once the ram starts following, walk slowly back; it keeps pace but can get stuck on terrain.",status:0,notes:""},
{id:"t16",r:"Trosky",tp:"Task",o:16,name:"Hunting the Werewolf",m:false,hm:false,t:false,b:true,l:false,
 desc:"Final task in the Shepherd questline. Herdsboy Natan near Semine reports a werewolf killing sheep at night. The 'werewolf' is actually Bedřich — a local man with a severe skin condition who has been living wild in the forest, too ashamed to return to the village. Two branches: (A) Expose the truth gently — speak to Bedřich alone first, gain his trust, then bring him back to Natan and the village. Bedřich is treated with sympathy, the 'werewolf' story ends, and he is reintegrated. Village rep improves. (B) Kill the 'werewolf' — Bedřich dies, the village is relieved, Natan is grateful. Honour penalty. A third path: tell Natan the truth without speaking to Bedřich first — Natan and a mob go to confront Bedřich, who panics and must be talked down or defended.",
 tip:"Speak to Bedřich first before telling anyone. He's found in a hollow near the stream north of Natan's flock at night. His camp has signs of a man living rough, not a monster. Path (A) is the most satisfying and earns the Shepherd's Champion trophy.",status:0,notes:""},
{id:"t17",r:"Trosky",tp:"Task",o:17,name:"Demons of Trosky",m:true,hm:true,t:false,b:false,l:false,
 desc:"Speak to Chamberlain Ulrich in Trosky Castle after starting 'Back in the Saddle'.",
 tip:"🔴 HIGHLY MISSABLE: Must complete before the end of Necessary Evil.",status:0,notes:""},
{id:"t18",r:"Trosky",tp:"Task",o:18,name:"Pilgrimage",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"If Henry has broken the law, he can atone by speaking to Father Nicodemus and undertaking a pilgrimage.",
 tip:"Repeatable. Does NOT count toward 'Been There Done That' trophy.",status:0,notes:""},
{id:"t19",r:"Trosky",tp:"Task",o:19,name:"The Lion's Crest",m:false,hm:false,t:false,b:false,l:false,
 desc:"Pre-order DLC task in the Trosky region. A unique item hunt.",
 tip:"Pre-order / DLC content.",status:0,notes:""},

// ── KUTTENBERG SIDE QUESTS (23) ──────────────────
{id:"sq18",r:"Kuttenberg",tp:"Side Quest",o:1,name:"Yackers 'n' Fash",m:false,hm:false,t:false,b:false,l:false,
 desc:"An introduction to Kuttenberg's criminal underworld through a pair of colourful local criminals.",
 tip:"Earns the 'Under a Brown Flag' trophy. Leads into Striped Tonies.",status:0,notes:""},
{id:"sq19",r:"Kuttenberg",tp:"Side Quest",o:2,name:"Striped Tonies",m:false,hm:false,t:false,b:false,l:false,
 desc:"Continuation of the criminal underworld questline begun in Yackers 'n' Fash.",
 tip:"Both Yackers 'n' Fash and Striped Tonies needed for the Under a Brown Flag trophy.",status:0,notes:""},
{id:"sq20",r:"Kuttenberg",tp:"Side Quest",o:3,name:"A Good Scrub",m:false,hm:false,t:false,b:true,l:false,
 desc:"The Kuttenberg bathhouse is at the centre of a web of secrets — owner Adam is running a blackmail operation using private conversations overheard in the baths, and several important Kuttenberg citizens are compromised. Two branches: (A) Expose Adam — gather evidence of the blackmail scheme (his ledger is in the locked safe room, lockpick 8 or pickpocket the key), bring it to the magistrate. Adam is arrested, his victims are freed, and his operation ends. Henry gets access to the Guest Ledger (useful in other Kuttenberg quests) and improved relations with several NPCs. (B) Blackmail Adam yourself — use the evidence to extract money and favours from Adam rather than turning him in. Adam becomes a nervous ally, you gain coin and discounts, but Honour drops and Adam's victims remain compromised.",
 tip:"Path (A) is the better long-term play — several Kuttenberg side quests benefit from the freed NPCs being friendly. Adam's key is most safely obtained during the lunch hour when he leaves his office briefly. The Guest Ledger has named clients that cross-reference with other quests.",status:0,notes:""},
{id:"sq21",r:"Kuttenberg",tp:"Side Quest",o:4,name:"Ill Repute",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry's reputation in Kuttenberg is under attack. Track down the source of damaging rumours.",
 tip:"",status:0,notes:""},
{id:"sq22",r:"Kuttenberg",tp:"Side Quest",o:5,name:"Feast for the Poor",m:false,hm:false,t:false,b:true,l:false,
 desc:"The local parish wants to hold a feast for the poor quarters of Kuttenberg but lacks funds and food. Henry is asked to help organise it. Three branches: (A) Full effort — source quality food (buy from the market or hunt), secure donations from two wealthy Kuttenberg merchants (Speech 6+ or favour-completion), and help set up the feast. The meal is generous, the poor remember Henry's name, and parish reputation increases significantly. (B) Cut corners — use cheap provisions and skip the merchant donations. The feast happens but is sparse; the parish is disappointed and the poor receive little. Honour is neutral. (C) Pocket the donation money — collect funds from willing donors and keep some (or all) for Henry. The feast is scaled back, the parish notices the shortfall, and Honour drops.",
 tip:"Full effort (A) unlocks a follow-on interaction where the parish priest gives Henry a unique blessed item. The two merchants to approach are the cloth merchant near the town square and the spice merchant in the lower market — both have optional favours that make the Speech check easier.",status:0,notes:""},
{id:"sq23",r:"Kuttenberg",tp:"Side Quest",o:6,name:"The Spark",m:false,hm:false,t:false,b:true,l:false,
 desc:"A printer named Kryšpín is producing incendiary pamphlets that are inflaming tensions between Hussite and Catholic factions in the city. Three branches: (A) Destroy the pamphlets and protect Kryšpín — the tension subsides, both sides calm down, Kryšpín survives and offers a printing discount. Best Honour outcome. (B) Let the pamphlets circulate — riots break out in one district, two named NPCs are killed, and a follow-on task (Smothering the Flame) unlocks to contain the damage. (C) Turn Kryšpín in to the Catholic overseer — he is arrested and tortured, the pamphlets are suppressed brutally, and Honour drops significantly.",
 tip:"⚠️ Letting the pamphlets spread locks in Smothering the Flame as a forced task and kills two named NPCs permanently. Option (A) is cleanest for both Honour and quest completion. Speech 9 lets you convince both faction leaders to stand down without burning the pamphlets.",status:0,notes:""},
{id:"sq24",r:"Kuttenberg",tp:"Side Quest",o:7,name:"In Vino Veritas",m:false,hm:false,t:false,b:false,l:false,
 desc:"Wine, secrets, and a social gathering where what is said in confidence rarely stays that way.",
 tip:"",status:0,notes:""},
{id:"sq25",r:"Kuttenberg",tp:"Side Quest",o:8,name:"Ars Dimicatoria",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"A formal combat questline involving the art of swordsmanship and a challenging instructor.",
 tip:"Leads into the Kuttenberg Tournament. Complete this first.",status:0,notes:""},
{id:"sq26",r:"Kuttenberg",tp:"Side Quest",o:9,name:"Kuttenberg Tournament",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"A full tournament held in Kuttenberg. Multiple combat disciplines. Strong rewards and prestige.",
 tip:"Requires completing Ars Dimicatoria first. Keep your weapon in top repair.",status:0,notes:""},
{id:"sq27",r:"Kuttenberg",tp:"Side Quest",o:10,name:"Lost Honour",m:true,hm:false,t:false,b:true,l:false,
 desc:"Henry encounters Jezhek of Holohlavy — a disgraced knight wandering the road, drunk and looking for a fight — during a random fast-travel event between Horschan and Miskowitz. Two branches in the initial encounter: (A) Beat Jezhek in the fight he picks, then offer to help him — he sobers up and reveals he was falsely accused of cowardice at a siege. This opens the full questline: find the surviving witness, clear his name before the Kuttenberg court. (B) Refuse to fight or walk away — Jezhek is later found dead on the road, the quest closes with a failure note, and Lost Honour cannot be completed. Within path (A): the witness can be persuaded freely (Speech 7+) or bribed (150g), and the court presentation requires either the witness testimony or a written deposition.",
 tip:"⚠️ MISSABLE: Must be completed before the end of Oratores. The fast-travel trigger is random — keep checking the Horschan–Miskowitz road during daytime rides. Beat Jezhek (he's not hard) then immediately choose to help. Don't come back later — he may be gone.",status:0,notes:""},
{id:"sq28",r:"Kuttenberg",tp:"Side Quest",o:11,name:"The Mouth of Hell",m:false,hm:false,t:false,b:false,l:false,
 desc:"Speak to Father Marian in Old Kutna. A dark and atmospheric quest involving religious superstition and real danger.",
 tip:"You may need to complete a Pilgrimage task first.",status:0,notes:""},
{id:"sq29",r:"Kuttenberg",tp:"Side Quest",o:12,name:"Thou art but dust…",m:false,hm:false,t:false,b:true,l:false,
 desc:"A dying monk at Sedletz Monastery, Brother Vintíř, is tormented by a terrible secret — he witnessed a murder years ago and said nothing. He asks Henry to help him die in peace. Three branches: (A) Hear his full confession and promise to act on it — investigate the old murder, find the evidence buried in the monastery garden, and confront the still-living perpetrator (a respected Kuttenberg merchant). Best outcome: justice is served, Vintíř dies peacefully, Sedletz rewards Henry. (B) Offer absolution without investigating — Vintíř is comforted but the murderer goes free. Vintíř dies with some peace. (C) Refuse or report Vintíř's confession to the abbot — the abbot suppresses it, Vintíř dies in anguish, and Henry takes an Honour penalty.",
 tip:"One of the best quests in the game. Path (A) requires thorough investigation — the buried evidence is under the east garden's apple tree (Mutt finds it). Confronting the merchant requires Speech 8+ or the physical evidence. Only accessible if you used stealth or persuasion in A Needle in a Haystack — Force approach blocks entry.",status:0,notes:""},
{id:"sq30",r:"Kuttenberg",tp:"Side Quest",o:13,name:"Spoils of War",m:false,hm:false,t:false,b:true,l:false,
 desc:"At Sigismund's Camp, Henry discovers a cache of looted goods — church silver, family heirlooms, and personal valuables stripped from villages. Three parties claim ownership: the camp's quartermaster (who wants it for the war effort), a local priest (representing the church), and a widow named Anežka (whose family items are in the cache). Three branches: (A) Return everything to its rightful owners — investigate each item, find its origin, split the cache appropriately. Anežka gets her heirlooms, the church silver goes back, the camp gets only the unclaimed military goods. Best Honour. (B) Give everything to the camp quartermaster — fast resolution, camp relations improve, Honour penalty. (C) Keep the most valuable pieces for Henry — Honour drops significantly, both Anežka and the priest become hostile.",
 tip:"Path (A) is time-consuming but the Honour gain and Anežka's follow-on gratitude (she gives Henry a unique family ring) make it worthwhile. The investigation involves reading item markings and cross-referencing a confiscation ledger found in the camp commander's tent.",status:0,notes:""},
{id:"sq31",r:"Kuttenberg",tp:"Side Quest",o:14,name:"Hush, My Darling…",m:false,hm:false,t:false,b:true,l:false,
 desc:"In Miskowitz, a young man named Tobias is desperately in love with Klára (a different Klára — a merchant's daughter), but her father Benedikt will not allow them to marry. Tobias asks Henry to help. Three branches: (A) Persuade Benedikt directly with Speech 7+ by uncovering that his real objection is a debt Tobias's family owes him — arrange repayment (Tobias pays back 200g with Henry's help) and Benedikt consents. (B) Expose Benedikt's own secret (he has a second family in Kuttenberg, found by investigating at the bathhouse) — blackmail him into consenting. Honour penalty. (C) Help Tobias and Klára elope — they flee at night, Benedikt is furious, and a follow-on task to calm him down unlocks. The elopement ending earns the Henry the Matchmaker trophy either way.",
 tip:"Path (A) is the most honourable and narratively satisfying. The blackmail path works but Benedikt remains hostile. Elopement is the most romantic option and earns the trophy regardless.",status:0,notes:""},
{id:"sq32",r:"Kuttenberg",tp:"Side Quest",o:15,name:"All's fair…",m:false,hm:false,t:false,b:true,l:false,
 desc:"In Wysoka, a land dispute between two neighbours — farmer Václav and widower Mikuláš — has turned ugly. Václav accuses Mikuláš of encroaching on his field; Mikuláš claims Václav has been stealing from his stores at night. Three branches: (A) Investigate both claims fully — uncover that a third party (a vagrant named Pávek hiding in the barn) has been stealing from both and feeding the dispute. Expose Pávek, the neighbours reconcile, and both reward Henry. (B) Take Václav's side without investigating — Mikuláš is fined by the bailiff, the truth stays hidden, Pávek escapes. Honour penalty. (C) Take Mikuláš's side — Václav loses access to part of his field, resentment festers, and a follow-on complaint task unlocks later.",
 tip:"Always investigate fully before siding with anyone — the truth is almost always more interesting than either side's version. Path (A) requires finding Pávek's hidden food cache in the barn loft (Perception check or Mutt).",status:0,notes:""},
{id:"sq33",r:"Kuttenberg",tp:"Side Quest",o:16,name:"Bellatores",m:false,hm:false,t:false,b:true,l:true,
 desc:"In Bylany, Henry meets a group of veteran soldiers who have been unpaid since the campaign ended. Their captain, Zdeněk, wants Henry to intercede with local Lord Búzek to release their withheld wages. Two branches: (A) Persuade Lord Búzek via Speech 8+ or by producing evidence of the contract (found in Búzek's chest — lockpick 5) — wages are paid, the soldiers remain loyal and become allies in Dragon's Lair. (B) Búzek refuses and Henry sides with the soldiers to pressure him — Búzek buckles if you intimidate him with the soldiers present (requires Reputation 3+ in Bylany), or the situation escalates into the full Dragon's Lair confrontation early.",
 tip:"⚠️ The choice here affects Dragon's Lair significantly — if Búzek is antagonised in Bellatores, Dragon's Lair starts with hostiles already alerted. Get the contract evidence first before confronting Búzek.",status:0,notes:""},
{id:"sq34",r:"Kuttenberg",tp:"Side Quest",o:17,name:"Dragon's Lair",m:false,hm:false,t:false,b:true,l:false,
 desc:"Continuation of the Bylany questline. Lord Búzek has barricaded himself in his manor with hired thugs and refuses to answer for his crimes. Three branches: (A) Assault the manor with Zdeněk's soldiers — a full combat sequence, Búzek is captured and turned over to the Kuttenberg magistrate. Zdeněk receives his wages and stays in the region. (B) Negotiate a surrender via Speech 10 — Búzek gives himself up peacefully, avoiding bloodshed. Honour bonus. (C) Let Búzek escape in the chaos — Zdeněk's soldiers are furious, the quest completes with a bad outcome flag, and a follow-on hunt task unlocks to track Búzek down later.",
 tip:"The assault path is satisfying and straightforward if your combat build is solid. Speech 10 negotiation is the best Honour outcome. Don't let Búzek escape — tracking him down in the follow-on task is time-consuming and the reward is worse.",status:0,notes:""},
{id:"sq35",r:"Kuttenberg",tp:"Side Quest",o:18,name:"The Thunderstone",m:false,hm:false,t:false,b:false,l:false,
 desc:"A quest in Grund involving a mysterious object and local superstition.",
 tip:"",status:0,notes:""},
{id:"sq36",r:"Kuttenberg",tp:"Side Quest",o:19,name:"The Magic Arrow",m:false,hm:false,t:false,b:false,l:false,
 desc:"Archery-focused quest at the Devil's Den area. Tests marksmanship skills.",
 tip:"",status:0,notes:""},
{id:"sq37",r:"Kuttenberg",tp:"Side Quest",o:20,name:"The Heirloom",m:false,hm:false,t:false,b:false,l:false,
 desc:"Retrieve a stolen family heirloom. The owner's story is more complicated than it first appears.",
 tip:"",status:0,notes:""},
{id:"sq38",r:"Kuttenberg",tp:"Side Quest",o:21,name:"Ransom",m:false,hm:false,t:false,b:true,l:false,
 desc:"A merchant's son has been taken hostage near Dänemark by a group of desperate outlaws demanding 500 Groschen. Three branches: (A) Pay the ransom — the boy is released immediately, no violence. The merchant reimburses Henry in full plus a reward. The outlaws escape. (B) Negotiate without paying — Speech 8+ lets Henry convince the leader that the boy is more trouble than he's worth, and exposes a fault line between the outlaws (some don't want to hurt anyone). They release the boy and scatter. (C) Assault the outlaw camp — rescue the boy by force. Riskiest option; the boy may be harmed if you don't take out the guard near him first. On success: the merchant's reward is the same but you keep any money already offered.",
 tip:"Negotiation (B) is the most rewarding: no cost, Honour gain, and you learn the outlaw leader's backstory (he's a former miller ruined by the same merchant). Assault is viable with good combat stats — priority target is the guard near the boy in the barn. Paying is fastest if you're low on time.",status:0,notes:""},
{id:"sq39",r:"Kuttenberg",tp:"Side Quest",o:22,name:"Post Scriptum",m:false,hm:false,t:false,b:false,l:false,
 desc:"Unlocks after Via Argentum. An intimate and personal side quest with strong writing.",
 tip:"See Katherine after finishing Into the Underworld.",status:0,notes:""},
{id:"sq40",r:"Kuttenberg",tp:"Side Quest",o:23,name:"The Fifth Commandment",m:false,hm:false,t:false,b:true,l:false,
 desc:"Thou shalt not kill. Unlocks after Via Argentum — a man named Bohuslav confesses to Henry that he killed someone years ago and has lived with it ever since. The victim's family never knew the truth. Three branches: (A) Encourage Bohuslav to confess to the family himself — accompany him to their home in Pschitoky. The family's reaction is devastating but they eventually find peace. Bohuslav is not reported to authorities (the killing was accidental). Best Honour outcome. (B) Report Bohuslav to the Kuttenberg magistrate — he is arrested and tried. The family learns the truth through the trial. Justice is served formally. Honour neutral. (C) Tell Bohuslav to keep the secret — he thanks Henry, but is visibly broken. The family never learns. Honour penalty.",
 tip:"Path (A) is the most emotionally complete — Bohuslav's confession scene with the family is one of the most quietly powerful moments in the game. Don't rush past it. Path (B) is more 'lawful' but coldly satisfying. Path (C) is the coward's way out.",status:0,notes:""},

{id:"t20",r:"Kuttenberg",tp:"Task",o:1,name:"Arrow-head",m:true,hm:true,t:true,b:false,l:false,
 desc:"A highly missable task in the wilderness near Kuttenberg. Time-sensitive once encountered.",

 desc:"A traditional archery competition held in Kuttenberg City.",
