<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCD2 Quest Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d10;--bg2:#111418;--bg3:#181c24;--bg4:#1e2330;--bg5:#252b3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#ddd8c8;--text2:#9a9282;--text3:#5a5448;--text4:#3a3428;
  --amber:#c8861a;--amber2:#e8a83c;--amber3:#f8d080;
  --green:#3a8a58;--green2:#52b872;
  --red:#a83830;--red2:#d05848;
  --blue:#3060a0;--blue2:#5888cc;
  --purple:#6040a0;--purple2:#8868cc;
  --orange:#a85820;--orange2:#d07838;
  --radius:6px;--radius2:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.hdr{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,0.12);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr-icon{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--bg4);border:1px solid var(--amber);border-radius:50%;flex-shrink:0}
.hdr-title{font-family:'Cinzel',serif;font-size:16px;color:var(--amber2);letter-spacing:1px}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px;font-family:monospace}
.hdr-stats{margin-left:auto;display:flex;gap:16px}
.stat{text-align:center}
.stat-v{font-size:19px;font-weight:700;font-family:'Cinzel',serif;color:var(--amber2)}
.stat-l{font-size:10px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;font-family:monospace}
.progress{height:2px;background:var(--bg3);flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .6s}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0}
.tab{padding:9px 15px;font-size:12px;font-family:monospace;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab:hover{color:var(--text2)}.tab.on{color:var(--amber2);border-bottom-color:var(--amber2)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:295px;min-width:255px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.panel{flex:1;overflow-y:auto}
.filters{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;background:var(--bg2);position:sticky;top:0;z-index:20}
.fsearch{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 7px;border-radius:5px;font-family:monospace;width:100%;margin-bottom:3px}
.fsearch:focus{outline:none;border-color:var(--amber)}.fsearch::placeholder{color:var(--text3)}
.fsel{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 6px;border-radius:5px;font-family:monospace;cursor:pointer;flex:1;min-width:70px}
.fsel:focus{outline:none;border-color:var(--amber)}
.rhead{padding:7px 11px 4px;display:flex;align-items:center;gap:5px;position:sticky;top:70px;background:var(--bg2);z-index:19;border-bottom:1px solid var(--border)}
.rname{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)}
.rcnt{font-size:10px;color:var(--text4);font-family:monospace;margin-left:auto}
.rdlc{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)}
.qrow{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;border-bottom:1px solid var(--border)}
.qrow:hover{background:var(--bg3)}.qrow.sel{background:rgba(200,134,26,0.07);border-left-color:var(--amber)}
.qico{font-size:12px;width:15px;text-align:center;flex-shrink:0}
.qname{font-size:12px;color:var(--text);flex:1;line-height:1.3}
.qname.done{color:var(--text3);text-decoration:line-through}
.qbadges{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.bdg{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:2px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
.b-main{background:rgba(200,134,26,0.18);color:var(--amber2);border:1px solid rgba(200,134,26,0.3)}
.b-side{background:rgba(48,96,160,0.2);color:var(--blue2);border:1px solid rgba(48,96,160,0.3)}
.b-task{background:rgba(96,64,160,0.18);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)}
.b-miss{background:rgba(168,56,48,0.2);color:var(--red2);border:1px solid rgba(168,56,48,0.3)}
.b-hmiss{background:rgba(168,56,48,0.35);color:#f09090;border:1px solid rgba(168,56,48,0.5)}
.b-time{background:rgba(168,88,32,0.2);color:var(--orange2);border:1px solid rgba(168,88,32,0.3)}
.b-branch{background:rgba(82,184,114,0.12);color:var(--green2);border:1px solid rgba(82,184,114,0.2)}
.b-lock{background:rgba(168,56,48,0.25);color:#e88080;border:1px solid rgba(168,56,48,0.4)}
.b-act-once{background:rgba(0,180,160,0.15);color:#40d0c0;border:1px solid rgba(0,180,160,0.3)}
.b-act-rep{background:rgba(80,160,200,0.15);color:#70c0e8;border:1px solid rgba(80,160,200,0.3)}
.qstatus{font-size:9px;padding:2px 4px;border-radius:3px;border:none;font-family:monospace;cursor:pointer;flex-shrink:0}
.s0{background:rgba(255,255,255,0.05);color:var(--text3)}.s1{background:rgba(232,168,60,0.18);color:var(--amber2)}
.s2{background:rgba(82,184,114,0.2);color:var(--green2)}.s3{background:rgba(208,88,72,0.2);color:var(--red2)}
.s4{background:rgba(100,100,90,0.15);color:var(--text3)}
.detail{padding:20px 22px;max-width:760px;animation:fadeUp .2s ease}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px}
.d-type{font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.d-title{font-family:'Cinzel',serif;font-size:20px;color:var(--amber2);margin-bottom:3px;line-height:1.2}
.d-region{font-size:11px;color:var(--text3);font-family:monospace;margin-bottom:12px}
.warn-box{background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--red2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.info-box{background:rgba(48,96,160,0.08);border:1px solid rgba(48,96,160,0.25);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--blue2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.tip-box{background:rgba(200,134,26,0.08);border:1px solid rgba(200,134,26,0.2);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--amber2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.d-desc{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:16px;border-left:2px solid rgba(255,255,255,0.07);padding-left:12px;font-style:italic}
.dsec{margin-bottom:16px}
.dsec-title{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:7px}
.status-btns{display:flex;gap:4px;flex-wrap:wrap}
.sbtn{padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);font-size:11px;font-family:monospace;cursor:pointer;transition:all .15s;background:var(--bg3);color:var(--text2)}
.sbtn:hover{border-color:var(--amber);color:var(--amber2)}.sbtn.on{background:rgba(200,134,26,0.15);border-color:var(--amber);color:var(--amber2);font-weight:700}
.notes-ta{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text);font-size:12px;padding:8px 10px;border-radius:var(--radius);font-family:'Crimson Text',serif;resize:vertical;min-height:60px;transition:border-color .2s;line-height:1.5}
.notes-ta:focus{outline:none;border-color:var(--amber)}
.bdiag{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius2);overflow:hidden;margin-top:6px}
.bdiag-title{padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.dec-page,.end-page{padding:18px;max-width:740px;margin:0 auto}
.dec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:12px}
.dec-qname{font-size:10px;font-family:monospace;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.dec-q{font-family:'Cinzel',serif;font-size:13px;color:var(--text);margin-bottom:8px}
.dec-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.chbtn{padding:8px 11px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.12);background:var(--bg3);cursor:pointer;text-align:left;transition:all .15s}
.chbtn:hover{background:var(--bg4)}.chbtn.g{border-color:var(--green);background:rgba(58,138,88,0.1)}.chbtn.b{border-color:var(--red);background:rgba(168,56,48,0.1)}
.ch-type{font-size:9px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.ch-type.good{color:var(--green2)}.ch-type.bad{color:var(--red2)}.ch-type.neutral{color:var(--amber2)}
.ch-label{font-size:12px;color:var(--text);line-height:1.4}
.ch-cons{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4;font-family:monospace}
.end-card{border-radius:var(--radius2);padding:16px;margin-bottom:12px}
.end-good{background:var(--bg2);border:1px solid rgba(58,138,88,0.4)}.end-mid{background:var(--bg2);border:1px solid rgba(200,134,26,0.35)}.end-bad{background:var(--bg2);border:1px solid rgba(168,56,48,0.35)}
.end-hdr{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.end-ico{font-size:24px}
.end-title{font-family:'Cinzel',serif;font-size:16px;color:var(--text)}
.end-sub{font-size:11px;font-family:monospace;margin-top:2px}
.end-desc{font-size:12px;color:var(--text2);line-height:1.65;font-family:monospace;margin-bottom:10px}
.chk-list{display:grid;gap:5px}
.chk-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border)}
.chk-ico{font-size:12px;flex-shrink:0;margin-top:1px}
.chk-txt{font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5}
.chk-txt.done{color:var(--green2)}.chk-q{font-size:10px;color:var(--text3);margin-top:1px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">⚔️</div>
  <div><div class="hdr-title">Kingdom Come: Deliverance II</div><div class="hdr-sub">Quest Tracker · Branch Log · Endings Guide</div></div>
  <div class="hdr-stats">
    <div class="stat"><div class="stat-v" id="s-done">0</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v" id="s-pct" style="color:var(--amber2)">0%</div><div class="stat-l">Completed</div></div>
    <div class="stat"><div class="stat-v" id="s-main" style="color:var(--amber)">0/0</div><div class="stat-l">Main Story</div></div>
    <div class="stat"><div class="stat-v" id="s-side" style="color:var(--blue2)">0/0</div><div class="stat-l">Side Quests</div></div>
    <div class="stat"><div class="stat-v" id="s-miss" style="color:var(--red2)">0</div><div class="stat-l">Missable Left</div></div>
  </div>
</div>
<div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
<div class="tabs">
  <button class="tab on" id="tb-tracker" onclick="setTab('tracker')">📜 Quest Tracker</button>
  <button class="tab" id="tb-decisions" onclick="setTab('decisions')">🔀 Key Decisions</button>
  <button class="tab" id="tb-endings" onclick="setTab('endings')">🏆 Endings Guide</button>
  <button class="tab" id="tb-riddler" onclick="setTab('riddler')">🎭 Riddler Barley</button>
  <button class="tab" id="tb-npcs" onclick="setTab('npcs')">👥 Key NPCs</button>
  <button class="tab" id="tb-forge" onclick="setTab('forge')">🔨 Legacy of the Forge</button>
  <button class="tab" id="tb-missable" onclick="setTab('missable')">⚠️ Missable Quests</button>
  <button class="tab" id="tb-loot" onclick="setTab('loot')">💰 Notable Loot</button>
  <button class="tab" id="tb-romance" onclick="setTab('romance')">💕 Romance</button>
</div>
<div class="main" id="app-main">
  <div id="page-tracker" style="display:flex;flex:1;overflow:hidden">
    <div class="sidebar">
      <div class="filters">
        <input class="fsearch" id="search-inp" placeholder="🔍  Search quests…" oninput="renderList()">
        <select class="fsel" id="f-type" onchange="renderList()">
          <option value="">All Types</option><option value="Main Quest">Main Quests</option>
          <option value="Side Quest">Side Quests</option><option value="Task">Tasks</option>
          <option value="act-once">⚡ Activities (one-time)</option>
          <option value="act-rep">🔁 Activities (repeatable)</option>
        </select>
        <select class="fsel" id="f-status" onchange="renderList()">
          <option value="">All Statuses</option><option value="0">Not Started</option>
          <option value="1">In Progress</option><option value="2">Completed</option>
          <option value="3">Failed</option><option value="4">Skipped</option>
        </select>
        <select class="fsel" id="f-region" onchange="renderList()">
          <option value="">All Regions</option>
          <option value="Trosky">Trosky</option><option value="Kuttenberg">Kuttenberg</option>
          <option value="DLC1">DLC - Brushes with Death</option>
          <option value="DLC2">DLC - Legacy of the Forge</option>
          <option value="DLC3">DLC - Mysteria Ecclesiae</option>
          <option value="DLC4">DLC - Horse Races</option>
        </select>
      </div>
      <div id="quest-list"></div>
    </div>
    <div class="panel" id="detail-panel">
      <div class="detail-empty" style="height:100%">
        <div style="font-size:48px;opacity:0.15">📜</div>
        <div style="font-size:13px;font-family:monospace;color:var(--text3)">Select a quest to view details</div>
        <div style="font-size:11px;font-family:monospace;color:var(--text4);margin-top:4px">126 quests · 32 main · 40 side · 54 tasks</div>
      </div>
    </div>
  </div>
  <div id="page-decisions" style="display:none;flex:1;overflow-y:auto"><div class="dec-page" id="dec-content"></div></div>
  <div id="page-endings" style="display:none;flex:1;overflow-y:auto"><div class="end-page" id="end-content"></div></div>
  <div id="page-riddler" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="riddler-content"></div></div>
  <div id="page-npcs" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="npcs-content"></div></div>
  <div id="page-forge" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="forge-content"></div></div>
  <div id="page-missable" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="missable-content"></div></div>
  <div id="page-loot" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="loot-content"></div></div>
  <div id="page-romance" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="romance-content"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// REGIONS
// ═══════════════════════════════════════════════════
const REGIONS=[
  {id:"Trosky",label:"Trosky",icon:"🏰",dlc:false},
  {id:"Kuttenberg",label:"Kuttenberg",icon:"⛏️",dlc:false},
  {id:"DLC1",label:"DLC — Brushes with Death",icon:"🎨",dlc:true},
  {id:"DLC2",label:"DLC — Legacy of the Forge",icon:"🔨",dlc:true},
  {id:"DLC3",label:"DLC — Mysteria Ecclesiae",icon:"✝️",dlc:true},
  {id:"DLC4",label:"DLC — Horse Races",icon:"🐴",dlc:true},
];

// ═══════════════════════════════════════════════════
// QUESTS — 126 total (real names from game)
// status: 0=Not Started 1=In Progress 2=Completed 3=Failed 4=Skipped
// m=missable hm=highly_missable t=time_sensitive b=has_branches l=locks_content
// ═══════════════════════════════════════════════════
const Q=[
// ── TROSKY MAIN QUESTS (12) ──────────────────────
{id:"mq01",r:"Trosky",tp:"Main Quest",o:1,name:"Last Rites",m:false,hm:false,t:false,b:false,l:false,
 desc:"The prologue. Henry and his companions defend the castle in a desperate last stand before fleeing into the wilds of Bohemia.",
 tip:"Tutorial quest. Take your time learning the combat system — it's unforgiving throughout the game.",status:0,notes:""},
{id:"mq02",r:"Trosky",tp:"Main Quest",o:2,name:"Easy Riders",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and his party make camp and attempt to regroup after the chaos of the prologue.",
 tip:"Explore the camp area carefully — a collectible is hidden near the wagon.",status:0,notes:""},
{id:"mq03",r:"Trosky",tp:"Main Quest",o:3,name:"Fortuna",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans struggle to survive, searching for safety and supplies in hostile territory.",
 tip:"Looting enemies thoroughly here sets you up well for the early game.",status:0,notes:""},
{id:"mq04",r:"Trosky",tp:"Main Quest",o:4,name:"Laboratores",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans arrive in Troskowitz and begin planning their next move with local allies.",
 tip:"Talk to every named NPC in Troskowitz — several side quests become available here.",status:0,notes:""},
{id:"mq05",r:"Trosky",tp:"Main Quest",o:5,name:"Wedding Crashers",m:false,hm:false,t:false,b:true,l:true,
 desc:"The open world fully opens. To get into the Semine wedding Henry must choose between two paths: Blacksmith Radovan (combat-focused, unlocks The Blacksmith's Son / Jaunt / Hermit chains) or Miller Kreyzl (stealth-focused, unlocks Materia Prima / Forbidden Fruit / Opus Magnum). Both paths can be progressed but you must choose ONE to attend the wedding with. The Blacksmith path unlocks significantly more side content.",
 tip:"⚠️ You can do BOTH questlines right up until the moment you go to the wedding — only then must you pick one. Blacksmith path recommended for completionists. Also: win Farkle against Innkeeper Betty to get the Gold Wedding Badge (lets you reroll dice, very useful all game).",status:0,notes:""},
{id:"mq06",r:"Trosky",tp:"Main Quest",o:6,name:"For Whom the Bell Tolls",m:false,hm:false,t:true,b:true,l:false,
 desc:"Henry is freed from jail to work off his debt while Hans faces the gallows for poaching. 12 in-game hours to save him — each bell toll is one hour (every 5 real minutes). Multiple paths to reach Captain Thomas: carry charcoal sacks, forge a horseshoe for Blacksmith Osina, get lockpicks from Hired Hand Kabat (return his turquoise rosary from Father Nicodemus via dice, pickpocket, or coin), help Cook Fanka unlock her spice chest, or talk to Jarek to be escorted into the Maiden Tower. Craft Fever Tonic in the Crone Tower to cure Thomas.",
 tip:"⏱️ 12 bells = game over for Hans. You have enough time to do everything if you don't dawdle. Forge the horseshoe first (opens up Kabat), then get lockpicks, then the rosary route into the Maiden Tower is fastest. Also: Opus Magnum side quest can be advanced here — visit Scribe Erazim in the Crone Tower while you're brewing the tonic.",status:0,notes:""},
{id:"mq07",r:"Trosky",tp:"Main Quest",o:7,name:"Back in the Saddle",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry and Hans travel to reach Lord Nebak. A key early decision about the Semine family will either protect them or put them at risk — affecting Old Wounds and the eventual ending.",
 tip:"⚠️ Do NOT betray the Semine secret to Otto. This affects the ending path.",status:0,notes:""},
{id:"mq08",r:"Trosky",tp:"Main Quest",o:8,name:"Necessary Evil",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry must extract critical information from a prisoner. Morally uncomfortable but unavoidable.",
 tip:"⚠️ TROSKY POINT OF NO RETURN. Complete ALL Trosky side quests before starting this.",status:0,notes:""},
{id:"mq09",r:"Trosky",tp:"Main Quest",o:9,name:"For Victory!",m:false,hm:false,t:false,b:false,l:false,

{id:"sq07",r:"Trosky",tp:"Side Quest",o:7,name:"Frogs",m:false,hm:false,t:false,b:true,l:true,

{id:"sq16",r:"Trosky",tp:"Side Quest",o:16,name:"Bad Blood",m:false,hm:false,t:false,b:true,l:false,

function setTab(t){
  currentTab=t;
  ["tracker","decisions","endings","riddler","npcs","forge","missable","loot","romance"].forEach(id=>{
    document.getElementById("page-"+id).style.display=id===t?(id==="tracker"?"flex":"block"):"none";
    document.getElementById("tb-"+id).className="tab"+(t===id?" on":"");
  });
  if(t==="decisions")renderDecisions();
  if(t==="endings")renderEndings();
  if(t==="riddler")renderRiddler();
  if(t==="npcs")renderNPCs();
  if(t==="forge")renderForge();
  if(t==="missable")renderMissable();
  if(t==="loot")renderLoot();
  if(t==="romance")renderRomance();
}

function renderRiddler(){
  const riddles=[
    {
      n:1, wager:"Free (no wager)", reward:"150g OR skill buff (your choice)",
      q:"What belongs to you alone, but is used more often by others than by yourself?",
      a:"My Name",
      explain:"Everyone uses your name to address you, but you rarely refer to yourself by name in speech.",
      region:"Trosky or Kuttenberg — random fast travel encounter"
    },
    {
      n:2, wager:"100 Groschen", reward:"200g OR skill buff",
      q:"Once upon a time there was a fool of a farmer. Family he had none, no stable boys either, so he talked to his animals instead. And, good man that he was, whenever he made a Groschen or two, he shared it with them according to his own rules. Every hen in the coop was paid 5 Groschen, every bee in the hive 15, and the spider in the loft bagged a full 20 Groschen. And now you tell me, how much did the cat get?",
      a:"10 Groschen",
      explain:"The farmer pays 2.5 Groschen per leg. Hen = 2 legs × 2.5 = 5g. Bee = 6 legs × 2.5 = 15g. Spider = 8 legs × 2.5 = 20g. Cat = 4 legs × 2.5 = 10g.",
      region:"Kuttenberg region — random fast travel encounter"
    },
    {
      n:3, wager:"150 Groschen", reward:"300g OR skill buff",
      q:"Jaromir the coachman hailed from Raborsch. One morning, he set off for Kuttenberg with an empty coach. Three lads boarded in Bohunowitz. When he arrived in Bojischt, one of the boys got out and a washerwoman took his place. In Horschan, the washerwoman went on her way and a pedlar and his daughter boarded. In Pschitoky, the remaining lads alighted and took the pedlar's daughter with them. And straight away, two fishermen got in. And on reaching Kuttenberg that evening, they invited the coachman to the bathhouse and got pig-drunk. And now you tell me, what was the coachman's name?",
      a:"Jaromir",
      explain:"The riddle tells you outright: 'Jaromir the coachman hailed from Raborsch.' The long list of passengers is a deliberate distraction.",
      region:"Kuttenberg region — road southwest of Devil's Den"
    },
    {
      n:4, wager:"150 Groschen", reward:"300g OR skill buff",
      q:"A bailiff has twelve men join up for service one day. The bailiff was glad, but soon discovered that he didn't have enough gear for them in the armoury. Of the twelve, six got armour and four got helmets, but three of the men were fortunate enough to get both. How many of the bailiff's men had to go into battle without any protection at all?",
      a:"Five",
      explain:"6 got armour, 4 got helmets, 3 got both. Men with only armour: 6-3=3. Men with only helmet: 4-3=1. Men with either: 3+1+3=7. Men with nothing: 12-7=5.",
      region:"Kuttenberg region — final Barley encounter"
    },
    {
      n:"Bonus",wager:"N/A — story encounter",reward:"Romance scene with Klara",

      region:"Kuttenberg Bathhouse — during 'A Good Scrub' or bathhouse visit"
    },
  ];
  let h=`<p style="font-size:12px;color:var(--text3);font-family:monospace;line-height:1.6;margin-bottom:16px">
    Riddler Barley is a random fast travel encounter in the Kuttenberg region. He offers one riddle per encounter. The first is free — subsequent ones require a wager. Answer correctly to win the wager back <b>plus</b> Barley's own stake. If you answer wrong you lose your wager. There are exactly 4 Barley encounters, plus 1 bonus riddle from Klara. Total groschen if you take all coin rewards: <b style="color:var(--amber2)">~1,050g</b>.
  </p>`;
  riddles.forEach(r=>{
    h+=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="font-size:22px;width:36px;height:36px;background:var(--bg4);border:1px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;color:var(--amber2);font-size:14px;font-weight:700;flex-shrink:0">${r.n}</div>

          <div style="font-size:11px;font-family:monospace;color:var(--text3);margin-top:2px">📍 ${r.region}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:10px;font-family:monospace;color:var(--text3)">Wager</div>
          <div style="font-size:12px;font-family:monospace;color:var(--amber2)">${r.wager}</div>
        </div>
      </div>
      <div style="background:var(--bg3);border-radius:var(--radius);padding:11px 13px;margin-bottom:10px;border-left:3px solid var(--amber);font-size:13px;color:var(--text2);line-height:1.7;font-style:italic">"${r.q}"</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:rgba(58,138,88,0.1);border:1px solid rgba(58,138,88,0.35);border-radius:var(--radius);padding:10px 12px">
          <div style="font-size:10px;font-family:monospace;color:var(--green2);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">✅ Answer</div>
          <div style="font-size:15px;font-family:'Cinzel',serif;color:var(--text)">${r.a}</div>
        </div>
        <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px">
          <div style="font-size:10px;font-family:monospace;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">💡 Why</div>
          <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.5">${r.explain}</div>
        </div>
      </div>
      <div style="margin-top:8px;font-size:11px;font-family:monospace;color:var(--text3)">🎁 Reward: ${r.reward}</div>
    </div>`;
  });
  document.getElementById("riddler-content").innerHTML=h;
}

function updateStats(){
  const done=Q.filter(q=>q.status===2).length,total=Q.length;
  const mqs=Q.filter(q=>q.tp==="Main Quest"),mdone=mqs.filter(q=>q.status===2).length;
  const sqs=Q.filter(q=>q.tp==="Side Quest"),sdone=sqs.filter(q=>q.status===2).length;
  const missableLeft=Q.filter(q=>(q.m||q.hm)&&q.status===0).length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-pct").textContent=Math.round(done/total*100)+"%";
  document.getElementById("s-main").textContent=mdone+"/"+mqs.length;
  document.getElementById("s-side").textContent=sdone+"/"+sqs.length;
  document.getElementById("s-miss").textContent=missableLeft;
  document.getElementById("prog").style.width=(done/total*100)+"%";
}

function renderList(){
  const srch=(document.getElementById("search-inp").value||"").toLowerCase();
  const ftype=document.getElementById("f-type").value;
  const fstat=document.getElementById("f-status").value;
  const freg=document.getElementById("f-region").value;
  let html="";
  REGIONS.forEach(reg=>{
    const qs=Q.filter(q=>{
      if(q.r!==reg.id)return false;
      if(ftype==="act-once"&&q.act!=="once")return false;
      if(ftype==="act-rep"&&q.act!=="rep")return false;
      if(ftype&&ftype!=="act-once"&&ftype!=="act-rep"&&q.tp!==ftype)return false;
      if(fstat!==""&&q.status!==parseInt(fstat))return false;
      if(freg&&q.r!==freg)return false;
      if(srch&&!q.name.toLowerCase().includes(srch))return false;
      return true;
    });
    if(!qs.length)return;
    const done=qs.filter(q=>q.status===2).length;
    html+=`<div class="rhead"><span style="font-size:13px">${reg.icon}</span><span class="rname">${reg.label}</span>${reg.dlc?`<span class="rdlc">DLC</span>`:""}<span class="rcnt">${done}/${qs.length}</span></div>`;
    qs.forEach(q=>{
      const b=[

        q.b?`<span class="bdg b-branch">branching</span>`:"",

      html+=`<div class="qrow${selected===q.id?" sel":""}" onclick="selectQuest('${q.id}')">
        <span class="qico" style="color:${q.status===2?"var(--green2)":q.status===1?"var(--amber2)":q.status===3?"var(--red2)":"var(--text3)"}">${SICO[q.status]}</span>

function nodeStyle(t){
  return({decision:{fill:"#141e38",stroke:"#3060a0",text:"#88aade"},good:{fill:"#0f2a1a",stroke:"#3a8a58",text:"#52b872"},bad:{fill:"#2a0f0f",stroke:"#a83830",text:"#d05848"},neutral:{fill:"#221a08",stroke:"#c8861a",text:"#e8a83c"},"out-good":{fill:"#081a10",stroke:"#3a8a58",text:"#3a8a58"},"out-bad":{fill:"#1a0808",stroke:"#a83830",text:"#a83830"},"out-neutral":{fill:"#1a1408",stroke:"#c8861a",text:"#c8861a"}})[t]||{fill:"#141e38",stroke:"#3060a0",text:"#88aade"};
}
function buildBranch(bd){
  const{nodes,edges,title,w,h}=bd;
  let s=`<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/></marker></defs>`;
  edges.forEach(([f,t])=>{
    const fn=nodes.find(n=>n.id===f),tn=nodes.find(n=>n.id===t);
    if(!fn||!tn)return;
    const x1=fn.x+fn.w/2,y1=fn.y+fn.h,x2=tn.x+tn.w/2,y2=tn.y,mid=(y1+y2)/2;
    s+=`<path d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" marker-end="url(#arr)"/>`;
  });
  nodes.forEach(n=>{
    const c=nodeStyle(n.type),lines=n.label.split("\n"),cx=n.x+n.w/2;
    s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/>`;
    const lh=15,sh=lines.length*lh,sy=n.y+(n.h-sh)/2+lh*0.82;
    lines.forEach((l,i)=>s+=`<text x="${cx}" y="${sy+i*lh}" text-anchor="middle" fill="${c.text}" font-size="11" font-family="monospace" font-weight="${n.type==="decision"?"600":"400"}">${l}</text>`);
  });
  return `<div class="bdiag"><div class="bdiag-title">${title}</div><svg viewBox="0 0 ${w} ${h}" style="width:100%;max-height:${h}px">${s}</svg></div>`;
}

function renderDecisions(){

  DECISIONS.forEach(d=>{
    const q=Q.find(x=>x.id===d.qid),br=BRANCHES[d.qid];
    h+=`<div class="dec-card">
      <div class="dec-qname">${q?.name||d.qid}</div>
      <div class="dec-q">🤔 ${d.q}</div>
      ${d.lockout?`<div class="warn-box" style="margin-bottom:9px">🔒 ${d.lockout}</div>`:""}
      ${br?buildBranch(br):""}
      <div class="dec-choices">${d.choices.map(c=>`<div class="chbtn"><div class="ch-type ${c.t}">${c.t==="good"?"✅ Good":c.t==="bad"?"❌ Bad":"⚖️ Neutral"}</div><div class="ch-label">${c.l}</div><div class="ch-cons">${c.c}</div></div>`).join("")}</div>
      <div style="margin-top:9px"><div class="dsec-title" style="margin-bottom:5px">Your Choice</div>

}

const CHECKLIST=[

function renderEndings(){
  const done_ids=new Set(Q.filter(q=>q.status===2).map(q=>q.id));

function renderMissable(){
  // Group missable quests by region and sort by highly missable first
  const missable=Q.filter(q=>q.m||q.hm).sort((a,b)=>{
    if(a.r!==b.r)return REGIONS.findIndex(r=>r.id===a.r)-REGIONS.findIndex(r=>r.id===b.r);
    if(b.hm!==a.hm)return b.hm?1:-1;
    return a.o-b.o;
  });
  const total=missable.length;
  const done=missable.filter(q=>q.status===2||q.status===4).length;
  const remaining=missable.filter(q=>q.status===0||q.status===1).length;
  const failed=missable.filter(q=>q.status===3).length;

  // Group by region
  const byRegion={};
  REGIONS.forEach(r=>{byRegion[r.id]=[];});
  missable.forEach(q=>byRegion[q.r].push(q));

  let h=`
    <p style="font-size:12px;color:var(--text3);font-family:monospace;line-height:1.6;margin-bottom:14px">
      Every missable and highly missable quest in one place. <b style="color:var(--red2)">⚠ Highly Missable</b> quests are extremely easy to permanently lose — act on them immediately. Mark as Skipped if you've passed them intentionally.
    </p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--text)">${total}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Total Missable</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(82,184,114,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--green2)">${done}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Done / Skipped</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(200,134,26,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--amber2)">${remaining}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Still Available</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--red2)">${failed}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Missed / Failed</div>
      </div>
    </div>`;

  // Points of no return warning
  h+=`<div style="background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.35);border-radius:var(--radius2);padding:13px 15px;margin-bottom:16px">
    <div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--red2);margin-bottom:8px">🚫 POINTS OF NO RETURN — Complete ALL missable content before these quests</div>
    <div style="display:grid;gap:6px">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="color:var(--amber2);font-family:monospace;font-size:11px;white-space:nowrap">Trosky →</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Necessary Evil (MQ8)</b> — All Trosky side quests, tasks, and the full Gules questline (Canker → Casper) must be done before starting this. The Semine family decision here also permanently affects availability.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="color:var(--amber2);font-family:monospace;font-size:11px;white-space:nowrap">Kuttenberg →</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5"><b style="color:var(--text)">Oratores (MQ12)</b> — All Kuttenberg side quests must be done before this. Master Schindel's Toys, Rosa's Book, Under the Straw Hat, and Like Old Times are gated to specific earlier quest windows.</span>
      </div>
    </div>
  </div>`;

  REGIONS.forEach(reg=>{
    const rqs=byRegion[reg.id];
    if(!rqs.length)return;
    const rdone=rqs.filter(q=>q.status===2||q.status===4).length;
    h+=`<div style="margin-bottom:6px;padding:7px 12px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;gap:8px">
      <span style="font-size:14px">${reg.icon}</span>
      <span style="font-size:11px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">${reg.label}</span>
      ${reg.dlc?`<span style="font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)">DLC</span>`:""}
      <span style="margin-left:auto;font-size:11px;font-family:monospace;color:var(--text3)">${rdone}/${rqs.length} cleared</span>
    </div>`;
    rqs.forEach(q=>{
      const statusColors=["var(--text3)","var(--amber2)","var(--green2)","var(--red2)","var(--text3)"];
      const statusBg=["rgba(255,255,255,0.03)","rgba(200,134,26,0.1)","rgba(58,138,88,0.12)","rgba(168,56,48,0.12)","rgba(100,100,90,0.08)"];
      const SICO=["○","◐","✓","✗","—"];
      h+=`<div style="background:var(--bg2);border:1px solid ${q.hm?"rgba(168,56,48,0.4)":"var(--border)"};border-radius:var(--radius);padding:12px 14px;margin-bottom:7px;border-left:3px solid ${q.hm?"var(--red2)":q.m?"var(--orange2)":"var(--border2)"}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px">
              <span style="font-size:13px;color:var(--text);font-family:'Cinzel',serif">${q.name}</span>
              ${q.hm?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,56,48,0.25);color:var(--red2);font-weight:700;border:1px solid rgba(168,56,48,0.4)">⚠ HIGHLY MISSABLE</span>`:`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.2);color:var(--orange2);font-weight:700">missable</span>`}
              ${q.t?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,88,32,0.15);color:var(--orange2);font-weight:700">⏱ timed</span>`:""}
              <span style="font-size:9px;font-family:monospace;padding:2px 5px;border-radius:3px;background:${q.tp==="Main Quest"?"rgba(200,134,26,0.18)":q.tp==="Side Quest"?"rgba(48,96,160,0.2)":"rgba(96,64,160,0.18)"};color:${q.tp==="Main Quest"?"var(--amber2)":q.tp==="Side Quest"?"var(--blue2)":"var(--purple2)"}">${q.tp==="Main Quest"?"Main":q.tp==="Side Quest"?"Side":"Task"}</span>
            </div>
            <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55;margin-bottom:7px">${q.desc}</div>
            ${q.tip?`<div style="display:flex;gap:7px;padding:6px 9px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid ${q.hm?"var(--red2)":"var(--amber)"}"><span style="color:${q.hm?"var(--red2)":"var(--amber2)"};flex-shrink:0;font-size:12px">${q.hm?"⚠️":"💡"}</span><span style="font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5">${q.tip}</span></div>`:""}
          </div>
          <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px">
            <div style="font-size:16px;color:${statusColors[q.status]}">${SICO[q.status]}</div>
            <select style="font-size:9px;padding:2px 4px;border-radius:3px;border:1px solid var(--border2);font-family:monospace;cursor:pointer;background:${statusBg[q.status]};color:${statusColors[q.status]}" onchange="setStatus('${q.id}',parseInt(this.value));renderMissable()">
              ${["Not Started","In Progress","Completed","Failed","Skipped"].map((s,i)=>`<option value="${i}"${q.status===i?" selected":""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>`;
    });
  });
  document.getElementById("missable-content").innerHTML=h;
}

function toggleLoot(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_loot")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_loot",JSON.stringify(state));
  renderLoot();
}

function updateLootStats(){
  const state=JSON.parse(localStorage.getItem("kcd2_loot")||"{}");
  const mapIds=["tm01","tm02","tm03","tm04","tm05","tm06"];
  const poiIds=["poi01","poi02","poi03","poi04","poi05","poi06","poi07","poi08"];
  const chestIds=["lc01","lc02","lc03","lc04","lc05","lc06","lc07","lc08","lc09","lc10"];
  const mc=mapIds.filter(id=>state[id]).length;
  const pc=poiIds.filter(id=>state[id]).length;
  const cc=chestIds.filter(id=>state[id]).length;
  const mEl=document.getElementById("loot-stat-maps");
  const pEl=document.getElementById("loot-stat-pois");
  const cEl=document.getElementById("loot-stat-chests");
  if(mEl)mEl.textContent=mc+"/"+mapIds.length;
  if(pEl)pEl.textContent=pc+"/"+poiIds.length;
  if(cEl)cEl.textContent=cc+"/"+chestIds.length;
}

    <div style="font-size:12px;font-family:monospace;color:var(--text3);line-height:1.7;margin-bottom:14px">All romance options in KCD2 — who they are, where to find them, when they become available, and how to pursue them. Includes both full relationship arcs and one-time encounters.</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      <div style="background:var(--bg2);border:1px solid rgba(208,88,72,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--red2)">${ROMANCES.filter(r=>["Full Romance","Main Story Romance","Side Quest Romance","Side Story Encounter","Returning Character — Limited Encounter"].includes(r.type)).length}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Relationship Arcs</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(48,96,160,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--blue2)">${ROMANCES.filter(r=>r.type==="One-Night Encounter").length}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">One-Night Encounters</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--red2)">${ROMANCES.filter(r=>r.missable).length}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Missable</div>
      </div>
      <div style="background:var(--bg2);border:1px solid rgba(82,184,114,0.25);border-radius:var(--radius);padding:10px;text-align:center">
        <div style="font-size:20px;font-family:'Cinzel',serif;color:var(--green2)">${done}/${ROMANCES.length}</div>
        <div style="font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;margin-top:2px">Encountered</div>
      </div>
    </div>
  </div>`;

  ROMANCES.forEach(r=>{
    const isDone=state[r.id]||false;
    h+=`<div style="background:var(--bg2);border:1px solid ${isDone?"rgba(82,184,114,0.3)":"var(--border)"};border-radius:var(--radius2);padding:16px;margin-bottom:12px;opacity:${isDone?0.65:1};transition:opacity .2s">
      <div style="display:flex;align-items:flex-start;gap:13px">
        <div style="font-size:28px;width:48px;height:48px;flex-shrink:0;background:var(--bg4);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid ${typeCols[r.type]||"var(--border2)"}">${r.icon}</div>
        <div style="flex:1;min-width:0">

          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px">
            <span style="font-family:'Cinzel',serif;font-size:16px;color:${isDone?"var(--text3)":"var(--text)"};${isDone?"text-decoration:line-through":""}">${r.name}</span>
            <span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:${typeBg[r.type]||"var(--bg4)"};color:${typeCols[r.type]||"var(--text2)"};font-weight:700">${r.type}</span>
            <span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:${regionBg[r.region]||"var(--bg4)"};color:${regionCols[r.region]||"var(--text2)"};font-weight:700">${r.region}</span>
            ${r.missable?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(168,56,48,0.2);color:var(--red2);font-weight:700">⚠ missable</span>`:""}
            ${r.repeatable?`<span style="font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:rgba(48,96,160,0.15);color:var(--blue2);font-weight:700">🔁 repeatable</span>`:""}
          </div>

          <div style="font-size:11px;font-family:monospace;color:var(--text3);margin-bottom:10px;line-height:1.5">⏱ ${r.availability}</div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <div style="background:var(--bg3);border-radius:var(--radius);padding:10px">
              <div style="font-size:10px;font-family:monospace;font-weight:700;color:var(--amber2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px">📍 Where</div>
              <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55">${r.where}</div>
            </div>
            <div style="background:var(--bg3);border-radius:var(--radius);padding:10px">
              <div style="font-size:10px;font-family:monospace;font-weight:700;color:var(--amber2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px">🕐 When</div>
              <div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55">${r.when}</div>
            </div>
          </div>

          <div style="background:var(--bg3);border-radius:var(--radius);padding:10px;margin-bottom:10px">
            <div style="font-size:10px;font-family:monospace;font-weight:700;color:var(--amber2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px">❤️ How to pursue</div>
            <div style="display:grid;gap:5px">${r.how.map((step,i)=>`<div style="display:flex;gap:8px;align-items:flex-start"><span style="font-size:10px;font-family:monospace;color:var(--amber);background:var(--bg4);border-radius:50%;width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px">${i+1}</span><span style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.55">${step}</span></div>`).join("")}</div>
          </div>

          ${r.tips?`<div style="font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--bg3);border-radius:var(--radius);border-left:2px solid var(--amber);margin-bottom:${r.missableTip?8:0}px">💡 ${r.tips}</div>`:""}
          ${r.missableTip?`<div style="font-size:12px;font-family:monospace;color:var(--red2);line-height:1.6;padding:8px 10px;background:rgba(168,56,48,0.1);border-radius:var(--radius);border-left:2px solid var(--red)">${r.missableTip}</div>`:""}
          ${r.questLink?`<div style="font-size:10px;font-family:monospace;color:var(--text3);margin-top:7px">🔗 Related quest: <span style="color:var(--amber2)">${r.questLink}</span></div>`:""}
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px">
          <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">
            <input type="checkbox" ${isDone?"checked":""} onchange="toggleRomance('${r.id}',this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--red)">
            <span style="font-size:9px;font-family:monospace;color:var(--text3)">${isDone?"Done":"Track"}</span>
          </label>
        </div>
      </div>
    </div>`;
  });

  h+=`<div style="margin-top:16px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2)">
    <div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--amber2);margin-bottom:7px">ℹ️ Notes on KCD2 Romance</div>
    <div style="font-size:11px;font-family:monospace;color:var(--text3);line-height:1.8">
      • KCD2 does not penalise Henry for pursuing multiple romance options — there are no jealousy or exclusivity flags between most characters.<br>
      • Full relationship arcs (Klára, Katherine) have meaningfully different tones — Klára is passionate and tragic, Katherine is slow-burn and intellectually grounded.<br>
      • One-night encounters (bathhouse, inns) do not affect any relationship arcs or quest outcomes.<br>
      • Lady Stephanie's appearance is a cameo — pursuing the encounter does not reopen a full KCD1-style relationship.<br>
      • Speech and Charisma stats help unlock some encounter dialogue but are not required for the main romance arcs.
    </div>
  </div>`;

  document.getElementById("romance-content").innerHTML=h;
}

function toggleRomance(id,val){
  const state=JSON.parse(localStorage.getItem("kcd2_romance")||"{}");
  state[id]=val;
  localStorage.setItem("kcd2_romance",JSON.stringify(state));
  renderRomance();
}

renderList();renderDetail();updateStats();
</script>
</body>
</html>
