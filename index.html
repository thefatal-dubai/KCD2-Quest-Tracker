<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCD2 Quest Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d10;--bg2:#111418;--bg3:#181c24;--bg4:#1e2330;--bg5:#252b3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#ddd8c8;--text2:#9a9282;--text3:#5a5448;--text4:#3a3428;
  --amber:#c8861a;--amber2:#e8a83c;--amber3:#f8d080;
  --green:#3a8a58;--green2:#52b872;
  --red:#a83830;--red2:#d05848;
  --blue:#3060a0;--blue2:#5888cc;
  --purple:#6040a0;--purple2:#8868cc;
  --orange:#a85820;--orange2:#d07838;
  --radius:6px;--radius2:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.hdr{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,0.12);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr-icon{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--bg4);border:1px solid var(--amber);border-radius:50%;flex-shrink:0}
.hdr-title{font-family:'Cinzel',serif;font-size:16px;color:var(--amber2);letter-spacing:1px}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px;font-family:monospace}
.hdr-stats{margin-left:auto;display:flex;gap:16px}
.stat{text-align:center}
.stat-v{font-size:19px;font-weight:700;font-family:'Cinzel',serif;color:var(--amber2)}
.stat-l{font-size:10px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;font-family:monospace}
.progress{height:2px;background:var(--bg3);flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .6s}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0}
.tab{padding:9px 15px;font-size:12px;font-family:monospace;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab:hover{color:var(--text2)}.tab.on{color:var(--amber2);border-bottom-color:var(--amber2)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:295px;min-width:255px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.panel{flex:1;overflow-y:auto}
.filters{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;background:var(--bg2);position:sticky;top:0;z-index:20}
.fsearch{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 7px;border-radius:5px;font-family:monospace;width:100%;margin-bottom:3px}
.fsearch:focus{outline:none;border-color:var(--amber)}.fsearch::placeholder{color:var(--text3)}
.fsel{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 6px;border-radius:5px;font-family:monospace;cursor:pointer;flex:1;min-width:70px}
.fsel:focus{outline:none;border-color:var(--amber)}
.rhead{padding:7px 11px 4px;display:flex;align-items:center;gap:5px;position:sticky;top:70px;background:var(--bg2);z-index:19;border-bottom:1px solid var(--border)}
.rname{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)}
.rcnt{font-size:10px;color:var(--text4);font-family:monospace;margin-left:auto}
.rdlc{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;background:var(--bg4);color:var(--purple2);border:1px solid rgba(96,64,160,0.3)}
.qrow{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;border-bottom:1px solid var(--border)}
.qrow:hover{background:var(--bg3)}.qrow.sel{background:rgba(200,134,26,0.07);border-left-color:var(--amber)}
.qico{font-size:12px;width:15px;text-align:center;flex-shrink:0}
.qname{font-size:12px;color:var(--text);flex:1;line-height:1.3}
.qname.done{color:var(--text3);text-decoration:line-through}
.qbadges{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.bdg{font-size:9px;font-family:monospace;padding:1px 4px;border-radius:2px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
.b-main{background:rgba(200,134,26,0.18);color:var(--amber2);border:1px solid rgba(200,134,26,0.3)}
.b-side{background:rgba(48,96,160,0.2);color:var(--blue2);border:1px solid rgba(48,96,160,0.3)}
.b-task{background:rgba(96,64,160,0.18);color:var(--purple2);border:1px solid rgba(96,64,160,0.25)}
.b-miss{background:rgba(168,56,48,0.2);color:var(--red2);border:1px solid rgba(168,56,48,0.3)}
.b-hmiss{background:rgba(168,56,48,0.35);color:#f09090;border:1px solid rgba(168,56,48,0.5)}
.b-time{background:rgba(168,88,32,0.2);color:var(--orange2);border:1px solid rgba(168,88,32,0.3)}
.b-branch{background:rgba(82,184,114,0.12);color:var(--green2);border:1px solid rgba(82,184,114,0.2)}
.b-lock{background:rgba(168,56,48,0.25);color:#e88080;border:1px solid rgba(168,56,48,0.4)}
.b-act-once{background:rgba(0,180,160,0.15);color:#40d0c0;border:1px solid rgba(0,180,160,0.3)}
.b-act-rep{background:rgba(80,160,200,0.15);color:#70c0e8;border:1px solid rgba(80,160,200,0.3)}
.qstatus{font-size:9px;padding:2px 4px;border-radius:3px;border:none;font-family:monospace;cursor:pointer;flex-shrink:0}
.s0{background:rgba(255,255,255,0.05);color:var(--text3)}.s1{background:rgba(232,168,60,0.18);color:var(--amber2)}
.s2{background:rgba(82,184,114,0.2);color:var(--green2)}.s3{background:rgba(208,88,72,0.2);color:var(--red2)}
.s4{background:rgba(100,100,90,0.15);color:var(--text3)}
.detail{padding:20px 22px;max-width:760px;animation:fadeUp .2s ease}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px}
.d-type{font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.d-title{font-family:'Cinzel',serif;font-size:20px;color:var(--amber2);margin-bottom:3px;line-height:1.2}
.d-region{font-size:11px;color:var(--text3);font-family:monospace;margin-bottom:12px}
.warn-box{background:rgba(168,56,48,0.1);border:1px solid rgba(168,56,48,0.3);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--red2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.info-box{background:rgba(48,96,160,0.08);border:1px solid rgba(48,96,160,0.25);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--blue2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.tip-box{background:rgba(200,134,26,0.08);border:1px solid rgba(200,134,26,0.2);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--amber2);font-family:monospace;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.d-desc{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:16px;border-left:2px solid rgba(255,255,255,0.07);padding-left:12px;font-style:italic}
.dsec{margin-bottom:16px}
.dsec-title{font-size:10px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:7px}
.status-btns{display:flex;gap:4px;flex-wrap:wrap}
.sbtn{padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);font-size:11px;font-family:monospace;cursor:pointer;transition:all .15s;background:var(--bg3);color:var(--text2)}
.sbtn:hover{border-color:var(--amber);color:var(--amber2)}.sbtn.on{background:rgba(200,134,26,0.15);border-color:var(--amber);color:var(--amber2);font-weight:700}
.notes-ta{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,0.12);color:var(--text);font-size:12px;padding:8px 10px;border-radius:var(--radius);font-family:'Crimson Text',serif;resize:vertical;min-height:60px;transition:border-color .2s;line-height:1.5}
.notes-ta:focus{outline:none;border-color:var(--amber)}
.bdiag{background:var(--bg3);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius2);overflow:hidden;margin-top:6px}
.bdiag-title{padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-family:monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.dec-page,.end-page{padding:18px;max-width:740px;margin:0 auto}
.dec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:12px}
.dec-qname{font-size:10px;font-family:monospace;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.dec-q{font-family:'Cinzel',serif;font-size:13px;color:var(--text);margin-bottom:8px}
.dec-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.chbtn{padding:8px 11px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.12);background:var(--bg3);cursor:pointer;text-align:left;transition:all .15s}
.chbtn:hover{background:var(--bg4)}.chbtn.g{border-color:var(--green);background:rgba(58,138,88,0.1)}.chbtn.b{border-color:var(--red);background:rgba(168,56,48,0.1)}
.ch-type{font-size:9px;font-family:monospace;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.ch-type.good{color:var(--green2)}.ch-type.bad{color:var(--red2)}.ch-type.neutral{color:var(--amber2)}
.ch-label{font-size:12px;color:var(--text);line-height:1.4}
.ch-cons{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4;font-family:monospace}
.end-card{border-radius:var(--radius2);padding:16px;margin-bottom:12px}
.end-good{background:var(--bg2);border:1px solid rgba(58,138,88,0.4)}.end-mid{background:var(--bg2);border:1px solid rgba(200,134,26,0.35)}.end-bad{background:var(--bg2);border:1px solid rgba(168,56,48,0.35)}
.end-hdr{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.end-ico{font-size:24px}
.end-title{font-family:'Cinzel',serif;font-size:16px;color:var(--text)}
.end-sub{font-size:11px;font-family:monospace;margin-top:2px}
.end-desc{font-size:12px;color:var(--text2);line-height:1.65;font-family:monospace;margin-bottom:10px}
.chk-list{display:grid;gap:5px}
.chk-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border)}
.chk-ico{font-size:12px;flex-shrink:0;margin-top:1px}
.chk-txt{font-size:11px;font-family:monospace;color:var(--text2);line-height:1.5}
.chk-txt.done{color:var(--green2)}.chk-q{font-size:10px;color:var(--text3);margin-top:1px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">⚔️</div>
  <div><div class="hdr-title">Kingdom Come: Deliverance II</div><div class="hdr-sub">Quest Tracker · Branch Log · Endings Guide</div></div>
  <div class="hdr-stats">
    <div class="stat"><div class="stat-v" id="s-done">0</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v" id="s-pct" style="color:var(--amber2)">0%</div><div class="stat-l">Completed</div></div>
    <div class="stat"><div class="stat-v" id="s-main" style="color:var(--amber)">0/0</div><div class="stat-l">Main Story</div></div>
    <div class="stat"><div class="stat-v" id="s-side" style="color:var(--blue2)">0/0</div><div class="stat-l">Side Quests</div></div>
    <div class="stat"><div class="stat-v" id="s-miss" style="color:var(--red2)">0</div><div class="stat-l">Missable Left</div></div>
  </div>
</div>
<div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
<div class="tabs">
  <button class="tab on" id="tb-tracker" onclick="setTab('tracker')">📜 Quest Tracker</button>
  <button class="tab" id="tb-decisions" onclick="setTab('decisions')">🔀 Key Decisions</button>
  <button class="tab" id="tb-endings" onclick="setTab('endings')">🏆 Endings Guide</button>
  <button class="tab" id="tb-riddler" onclick="setTab('riddler')">🎭 Riddler Barley</button>
  <button class="tab" id="tb-npcs" onclick="setTab('npcs')">👥 Key NPCs</button>
  <button class="tab" id="tb-forge" onclick="setTab('forge')">🔨 Legacy of the Forge</button>
  <button class="tab" id="tb-missable" onclick="setTab('missable')">⚠️ Missable Quests</button>
  <button class="tab" id="tb-loot" onclick="setTab('loot')">💰 Notable Loot</button>
  <button class="tab" id="tb-romance" onclick="setTab('romance')">💕 Romance</button>
  <button class="tab" id="tb-trophies" onclick="setTab('trophies')">🏆 Trophies</button>
  <button class="tab" id="tb-shepherds" onclick="setTab('shepherds')">🐑 Shepherd Questline</button>
  <button class="tab" id="tb-secrets" onclick="setTab('secrets')">🥚 Secrets & Easter Eggs</button>
  <button class="tab" id="tb-guild" onclick="setTab('guild')">⚖️ The Guild</button>
</div>
<div class="main" id="app-main">
  <div id="page-tracker" style="display:flex;flex:1;overflow:hidden">
    <div class="sidebar">
      <div class="filters">
        <input class="fsearch" id="search-inp" placeholder="🔍  Search quests…" oninput="renderList()">
        <select class="fsel" id="f-type" onchange="renderList()">
          <option value="">All Types</option><option value="Main Quest">Main Quests</option>
          <option value="Side Quest">Side Quests</option><option value="Task">Tasks</option>
          <option value="act-once">⚡ Activities (one-time)</option>
          <option value="act-rep">🔁 Activities (repeatable)</option>
        </select>
        <select class="fsel" id="f-status" onchange="renderList()">
          <option value="">All Statuses</option><option value="0">Not Started</option>
          <option value="1">In Progress</option><option value="2">Completed</option>
          <option value="3">Failed</option><option value="4">Skipped</option>
        </select>
        <select class="fsel" id="f-region" onchange="renderList()">
          <option value="">All Regions</option>
          <option value="Trosky">Trosky</option><option value="Kuttenberg">Kuttenberg</option>
          <option value="Guild">⚖️ The Guild (Kuttenberg)</option>
          <option value="DLC1">DLC - Brushes with Death</option>
          <option value="DLC2">DLC - Legacy of the Forge</option>
          <option value="DLC3">DLC - Mysteria Ecclesiae</option>
          <option value="DLC4">DLC - Horse Races</option>
        </select>
      </div>
      <div id="quest-list"></div>
    </div>
    <div class="panel" id="detail-panel">
      <div class="detail-empty" style="height:100%">
        <div style="font-size:48px;opacity:0.15">📜</div>
        <div style="font-size:13px;font-family:monospace;color:var(--text3)">Select a quest to view details</div>
        <div style="font-size:11px;font-family:monospace;color:var(--text4);margin-top:4px">126 quests · 32 main · 40 side · 54 tasks</div>
      </div>
    </div>
  </div>
  <div id="page-decisions" style="display:none;flex:1;overflow-y:auto"><div class="dec-page" id="dec-content"></div></div>
  <div id="page-endings" style="display:none;flex:1;overflow-y:auto"><div class="end-page" id="end-content"></div></div>
  <div id="page-riddler" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="riddler-content"></div></div>
  <div id="page-npcs" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="npcs-content"></div></div>
  <div id="page-forge" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="forge-content"></div></div>
  <div id="page-missable" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:740px;margin:0 auto" id="missable-content"></div></div>
  <div id="page-loot" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="loot-content"></div></div>
  <div id="page-romance" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:800px;margin:0 auto" id="romance-content"></div></div>
  <div id="page-trophies" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:860px;margin:0 auto" id="trophies-content"></div></div>
  <div id="page-shepherds" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:760px;margin:0 auto" id="shepherds-content"></div></div>
  <div id="page-secrets" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:860px;margin:0 auto" id="secrets-content"></div></div>
  <div id="page-guild" style="display:none;flex:1;overflow-y:auto"><div style="padding:20px;max-width:860px;margin:0 auto" id="guild-content"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// REGIONS
// ═══════════════════════════════════════════════════
const REGIONS=[
  {id:"Trosky",label:"Trosky",icon:"🏰",dlc:false},
  {id:"Kuttenberg",label:"Kuttenberg",icon:"⛏️",dlc:false},
  {id:"Guild",label:"The Guild (Kuttenberg)",icon:"⚖️",dlc:false},
  {id:"DLC1",label:"DLC — Brushes with Death",icon:"🎨",dlc:true},
  {id:"DLC2",label:"DLC — Legacy of the Forge",icon:"🔨",dlc:true},
  {id:"DLC3",label:"DLC — Mysteria Ecclesiae",icon:"✝️",dlc:true},
  {id:"DLC4",label:"DLC — Horse Races",icon:"🐴",dlc:true},
];

// ═══════════════════════════════════════════════════
// QUESTS — 126 total (real names from game)
// status: 0=Not Started 1=In Progress 2=Completed 3=Failed 4=Skipped
// m=missable hm=highly_missable t=time_sensitive b=has_branches l=locks_content
// ═══════════════════════════════════════════════════
const Q=[
// ── TROSKY MAIN QUESTS (12) ──────────────────────
{id:"mq01",r:"Trosky",tp:"Main Quest",o:1,name:"Last Rites",m:false,hm:false,t:false,b:false,l:false,
 desc:"The prologue. Henry and his companions defend the castle in a desperate last stand before fleeing into the wilds of Bohemia.",
 tip:"Tutorial quest. Take your time learning the combat system — it's unforgiving throughout the game.",status:0,notes:""},
{id:"mq02",r:"Trosky",tp:"Main Quest",o:2,name:"Easy Riders",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and his party make camp and attempt to regroup after the chaos of the prologue.",
 tip:"Explore the camp area carefully — a collectible is hidden near the wagon.",status:0,notes:""},
{id:"mq03",r:"Trosky",tp:"Main Quest",o:3,name:"Fortuna",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans struggle to survive, searching for safety and supplies in hostile territory.",
 tip:"Looting enemies thoroughly here sets you up well for the early game.",status:0,notes:""},
{id:"mq04",r:"Trosky",tp:"Main Quest",o:4,name:"Laboratores",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Hans arrive in Troskowitz and begin planning their next move with local allies.",
 tip:"Talk to every named NPC in Troskowitz — several side quests become available here.",status:0,notes:""},
{id:"mq05",r:"Trosky",tp:"Main Quest",o:5,name:"Wedding Crashers",m:false,hm:false,t:false,b:true,l:true,
 desc:"The open world fully opens. To get into the Semine wedding Henry must choose between two paths: Blacksmith Radovan (combat-focused, unlocks The Blacksmith's Son / Jaunt / Hermit chains) or Miller Kreyzl (stealth-focused, unlocks Materia Prima / Forbidden Fruit / Opus Magnum). Both paths can be progressed but you must choose ONE to attend the wedding with. The Blacksmith path unlocks significantly more side content.",
 tip:"⚠️ You can do BOTH questlines right up until the moment you go to the wedding — only then must you pick one. Blacksmith path recommended for completionists. Also: win Farkle against Innkeeper Betty to get the Gold Wedding Badge (lets you reroll dice, very useful all game).",status:0,notes:""},
{id:"mq06",r:"Trosky",tp:"Main Quest",o:6,name:"For Whom the Bell Tolls",m:false,hm:false,t:true,b:true,l:false,
 desc:"Henry is freed from jail to work off his debt while Hans faces the gallows for poaching. 12 in-game hours to save him — each bell toll is one hour (every 5 real minutes). Multiple paths to reach Captain Thomas: carry charcoal sacks, forge a horseshoe for Blacksmith Osina, get lockpicks from Hired Hand Kabat (return his turquoise rosary from Father Nicodemus via dice, pickpocket, or coin), help Cook Fanka unlock her spice chest, or talk to Jarek to be escorted into the Maiden Tower. Craft Fever Tonic in the Crone Tower to cure Thomas.",
 tip:"⏱️ 12 bells = game over for Hans. You have enough time to do everything if you don't dawdle. Forge the horseshoe first (opens up Kabat), then get lockpicks, then the rosary route into the Maiden Tower is fastest. Also: Opus Magnum side quest can be advanced here — visit Scribe Erazim in the Crone Tower while you're brewing the tonic.",status:0,notes:""},
{id:"mq07",r:"Trosky",tp:"Main Quest",o:7,name:"Back in the Saddle",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry and Hans travel to reach Lord Nebak. A key early decision about the Semine family will either protect them or put them at risk — affecting Old Wounds and the eventual ending.",
 tip:"⚠️ Do NOT betray the Semine secret to Otto. This affects the ending path.",status:0,notes:""},
{id:"mq08",r:"Trosky",tp:"Main Quest",o:8,name:"Necessary Evil",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry must extract critical information from a prisoner. Morally uncomfortable but unavoidable.",
 tip:"⚠️ TROSKY POINT OF NO RETURN. Complete ALL Trosky side quests before starting this.",status:0,notes:""},
{id:"mq09",r:"Trosky",tp:"Main Quest",o:9,name:"For Victory!",m:false,hm:false,t:false,b:false,l:false,
 desc:"The Trosky forces muster for a decisive engagement. Henry's role is crucial to the outcome.",
 tip:"Stock up on healing supplies and repair your gear before this quest.",status:0,notes:""},
{id:"mq10",r:"Trosky",tp:"Main Quest",o:10,name:"Divine Messenger",m:false,hm:false,t:false,b:false,l:false,
 desc:"A mission that requires subtlety and disguise. Henry acts as an unlikely emissary.",
 tip:"Speech skill above 10 opens several extra dialogue paths.",status:0,notes:""},
{id:"mq11",r:"Trosky",tp:"Main Quest",o:11,name:"The Finger of God",m:false,hm:false,t:false,b:false,l:false,
 desc:"A dramatic confrontation with heavy consequences for Trosky's political landscape.",
 tip:"Preparation pays off here — complete combat training side quests first.",status:0,notes:""},
{id:"mq12",r:"Trosky",tp:"Main Quest",o:12,name:"Storm",m:false,hm:false,t:false,b:true,l:true,
 desc:"The Trosky storyline's climax. Istvan Toth must be confronted. Two branches: (A) Offer Istvan a honourable duel — fight him one-on-one. If you win, it counts as an honourable kill and awards the Honourable Duel trophy. Affects ending score positively and parents approve. (B) Defenestrate Istvan — throw him from the castle window during the confrontation. Counts as dishonourable, negatively affects ending score, parents disapprove. There is no middle path; one of these two must happen before you can advance to Kuttenberg.",
 tip:"⚠️ FIGHT THE DUEL. Defenestration is faster but permanently costs you Honour and the good ending path. Prepare for the duel: Sword 15+, your best weapon fully repaired. Istvan fights dirty at low health — don't let up.",status:0,notes:""},

// ── KUTTENBERG MAIN QUESTS (20) ──────────────────
{id:"mq13",r:"Kuttenberg",tp:"Main Quest",o:1,name:"The Sword and the Quill",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry arrives in the silver city of Kuttenberg — wealthier, more dangerous, and more politically complex than Trosky.",
 tip:"Talk to the bathhouse owner Adam early — he's a major quest hub for Kuttenberg.",status:0,notes:""},
{id:"mq14",r:"Kuttenberg",tp:"Main Quest",o:2,name:"Speak of the Devil",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry begins navigating the dangerous web of factions operating in and around Kuttenberg. Several major side quest chains open here — this is the best moment to branch out before pushing the main story.",
 tip:"In Vino Veritas, A Good Scrub, Yackers 'n' Fash, and the Kuttenberg Tournament all become available around this quest. Prioritise them before advancing.",status:0,notes:""},
{id:"mq15",r:"Kuttenberg",tp:"Main Quest",o:3,name:"Into the Underworld",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry goes deeper into Kuttenberg's criminal underworld to find the information he needs.",
 tip:"Master Schindel's Toys task and Rosa's Book task unlock during this quest — don't miss them.",status:0,notes:""},
{id:"mq16",r:"Kuttenberg",tp:"Main Quest",o:4,name:"Via Argentum",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry follows the trail of silver — and corruption — deeper into the mines and the city's power structures.",
 tip:"The Fifth Commandment and Post Scriptum side quests unlock after this.",status:0,notes:""},
{id:"mq17",r:"Kuttenberg",tp:"Main Quest",o:5,name:"The Devil's Pack",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and Zizka work to reunite their scattered band of fighters. The quest focuses on tracking down and recruiting Dry Devil's former companions who have dispersed across the Kuttenberg region.",
 tip:"The Collector task becomes available from Bailiff Crux during this quest — it's missable if you skip it and advance. Do it immediately.",status:0,notes:""},
{id:"mq18",r:"Kuttenberg",tp:"Main Quest",o:6,name:"Taking French Leave",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry must navigate a delicate situation requiring stealth and discretion to slip away from a dangerous location without arousing suspicion. A tense quest that rewards careful preparation.",
 tip:"Keep Mutt with you — his alert behaviour can save your life in this quest.",status:0,notes:""},
{id:"mq19",r:"Kuttenberg",tp:"Main Quest",o:7,name:"The King's Gambit",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry is drawn into a web of political intrigue as the factions around Kuttenberg manoeuvre for power. Careful dialogue choices matter here — who you side with shapes the alliances available in the final act.",
 tip:"Speech skill above 10 opens several extra dialogue paths.",status:0,notes:""},
{id:"mq20",r:"Kuttenberg",tp:"Main Quest",o:8,name:"The Feast",m:false,hm:false,t:false,b:false,l:false,
 desc:"A high-stakes social event that serves as cover for a dangerous intelligence operation. Henry must attend and navigate the gathering while pursuing a hidden objective. Dress appropriately — the right clothes give bonuses in conversation.",
 tip:"Dress appropriately — wearing the right clothes gives bonuses in conversation.",status:0,notes:""},
{id:"mq21",r:"Kuttenberg",tp:"Main Quest",o:9,name:"Exodus",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry and his allies are forced to make a rapid departure from a dangerous situation. A quest of urgency and consequence as the Kuttenberg situation escalates.",
 tip:"Stock up on healing supplies and repair your gear before this quest — combat encounters can be sudden.",status:0,notes:""},
{id:"mq22",r:"Kuttenberg",tp:"Main Quest",o:10,name:"The Lion's Den",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry must infiltrate Sigismund's camp. During this quest you can unlock the highly missable task The Stalker by examining Chertan's body in the infirmary tent and choosing the right dialogue option.",
 tip:"⚠️ TRIGGER THE STALKER TASK HERE: When examining Chertan's body in the infirmary, say 'A girl from the baths will help' — this opens the optional objective to ask Katherine for help, which starts The Stalker side task.",status:0,notes:""},
{id:"mq23",r:"Kuttenberg",tp:"Main Quest",o:11,name:"Dancing with the Devil",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry faces the most important moral choice in the game — Dry Devil demands an act of atrocity to prove loyalty. This decision has permanent ending consequences. Also unlocks the Thou art but dust… side quest at Sedletz Monastery.",
 tip:"⚠️ REFUSE to burn Maleshov. Agreement permanently blocks the good ending. No redemption exists. Complete ALL Kuttenberg side quests before this quest — it is very close to the point of no return.",status:0,notes:""},
{id:"mq24",r:"Kuttenberg",tp:"Main Quest",o:12,name:"Oratores",m:false,hm:false,t:false,b:false,l:false,
 desc:"A critical story advancement. Henry's actions here set the stage for the final act.",
 tip:"⚠️ KUTTENBERG POINT OF NO RETURN. Complete ALL Kuttenberg side quests before this.",status:0,notes:""},
{id:"mq25",r:"Kuttenberg",tp:"Main Quest",o:13,name:"The Italian Job",m:false,hm:false,t:false,b:false,l:false,
 desc:"A daring heist involving the royal silver. Henry and his companions plan and execute an elaborate operation that puts everything at risk for a massive payoff.",
 tip:"Preparation pays off here — gather all intel from previous quests before committing to the plan.",status:0,notes:""},
{id:"mq26",r:"Kuttenberg",tp:"Main Quest",o:14,name:"Civitas Pragensis",m:false,hm:false,t:false,b:true,l:false,
 desc:"The second quest after the point of no return. Henry faces a 1v1 duel against Erik. Choices made here have consequences for the ending. A victory celebration opens the quest before the duel.",
 tip:"Talk to Janosh, Dry Devil, Katherine, and Samuel at the celebration — toast 'To the fallen' for a reputation boost. Then prepare for the Erik duel: keep your weapon in top repair.",status:0,notes:""},
{id:"mq27",r:"Kuttenberg",tp:"Main Quest",o:15,name:"So it begins...",m:false,hm:false,t:false,b:true,l:true,
 desc:"Henry and his allies defend Suchdol against an enemy assault. Two waves of intense combat. Gather supplies from Janosh (food), Katherine and Musa (medical), and Frenzl (ammunition) before the siege begins.",
 tip:"⚠️ Two tough back-to-back battles. Repair all gear beforehand. Use the Voulge available in the fortress to knock down enemy ladders during the second wave — five ladders destroyed ends the assault.",status:0,notes:""},
{id:"mq28",r:"Kuttenberg",tp:"Main Quest",o:16,name:"Besieged",m:false,hm:false,t:false,b:false,l:false,
 desc:"The siege of Suchdol continues. Henry must hold out as the pressure mounts. A critical juncture in the final act.",
 tip:"Stock up on healing supplies. This is deep in the endgame — no more side questing after this.",status:0,notes:""},
{id:"mq29",r:"Kuttenberg",tp:"Main Quest",o:17,name:"Hunger and Despair",m:false,hm:false,t:false,b:false,l:false,
 desc:"The siege of Suchdol takes its toll. Henry must manage dire conditions — morale, supplies, and the growing desperation of defenders all become critical factors.",
 tip:"Keep resources stocked heading into this quest. Companions' states affect how the quest resolves.",status:0,notes:""},
{id:"mq30",r:"Kuttenberg",tp:"Main Quest",o:18,name:"Reckoning",m:false,hm:false,t:false,b:true,l:true,
 desc:"Three pivotal choices in quick succession: spare or kill Brabant after the duel, let Markvart von Aulitz die naturally or kill him yourself, and whether to save Samuel. These three choices together determine the ending.",
 tip:"⚠️ Spare Brabant. Let Markvart die naturally. Save Samuel. All three = good ending path.",status:0,notes:""},
{id:"mq31",r:"Kuttenberg",tp:"Main Quest",o:19,name:"Last Rites (Godwin)",m:false,hm:false,t:false,b:false,l:false,
 desc:"A companion's story reaches its conclusion. A quieter, character-driven chapter before the final battle.",
 tip:"No combat. Take your time with the dialogue — Godwin's arc gets a meaningful send-off here.",status:0,notes:""},
{id:"mq32",r:"Kuttenberg",tp:"Main Quest",o:20,name:"Judgement Day",m:false,hm:false,t:false,b:true,l:false,
 desc:"The final quest. The siege of Suchdol reaches its conclusion and Henry faces the ultimate reckoning — but the ending is already sealed by every choice made before this moment.",
 tip:"There is no last-minute choice that changes your ending. It is determined by prior decisions.",status:0,notes:""},

// ── TROSKY SIDE QUESTS (17) ──────────────────────
{id:"sq01",r:"Trosky",tp:"Side Quest",o:1,name:"The Blacksmith's Son",m:false,hm:false,t:false,b:false,l:false,
 desc:"Help the blacksmith in Tachov deal with a family crisis. Start of the Blacksmith's questline.",
 tip:"Start this as soon as you arrive in Tachov. Required to unlock The Jaunt.",status:0,notes:""},
{id:"sq02",r:"Trosky",tp:"Side Quest",o:2,name:"The Jaunt",m:true,hm:false,t:false,b:false,l:false,
 desc:"The blacksmith's questline continues with a more adventurous errand. Introduces the rogue character Gules.",
 tip:"Must finish before the Semine wedding. Talk to Blacksmith Radovan in Tachov after The Blacksmith's Son.",status:0,notes:""},
{id:"sq03",r:"Trosky",tp:"Side Quest",o:3,name:"The Hermit",m:false,hm:false,t:false,b:false,l:false,
 desc:"A reclusive hermit holds answers about a local mystery. Complete ALL optional objectives to unlock A Sinful Soul.",
 tip:"Do every optional step — skipping any locks out the 'A Sinful Soul' task permanently.",status:0,notes:""},
{id:"sq04",r:"Trosky",tp:"Side Quest",o:4,name:"Materia Prima",m:false,hm:false,t:false,b:false,l:false,
 desc:"Begin the Miller's questline at Lower Semine Mill. The miller has an unusual and philosophical hobby.",
 tip:"Part 1 of 3 in the Miller questline. Do them in order.",status:0,notes:""},
{id:"sq05",r:"Trosky",tp:"Side Quest",o:5,name:"Forbidden Fruit",m:false,hm:false,t:false,b:true,l:false,
 desc:"Miller Kreyzl needs saltpetre for his alchemy. Part 2 of the Miller questline (Kreyzl path only). Bonnie directs Henry to Gravedigger Ignatius east of Troskowitz — his carcass burial pits are rich in saltpetre. Two branches: (A) Help Ignatius on his rounds — accompany him on his wagon at daybreak (5am), help him find a rotting deer carcass, investigate poisoned animal deaths at a farm (the river upstream is the source), bag and load two dead pigs, and deal with a greengrocer's dog. After completing all tasks Ignatius takes Henry to the pit. Reward: Knacker's Gloves + pit location. Required for the Boneworks trophy. (B) Skip Ignatius and find the pit yourself — the saltpetre pit is directly east of the graveyard, past the sheep pen next to the road. No need to do any of Ignatius's tasks. You miss the Knacker's Gloves but complete the quest faster.",
 tip:"The Ignatius route (A) is worth doing for the Boneworks trophy (requires this + Thou art but dust…). Tell Ignatius the truth when he asks why you need the pit — it gives reputation. Bring fresh meat as a gift (optional — doesn't skip his tasks but gives rep). Wait until 5am to meet him or he'll refuse to start. The dog task has a surprise: follow the barking to find it with Bonnie, then tell her the truth — she'll take the dog away and you can lie to Ignatius that it's done.",status:0,notes:""},
{id:"sq06",r:"Trosky",tp:"Side Quest",o:6,name:"Opus Magnum",m:false,hm:false,t:false,b:false,l:false,
 desc:"The conclusion of the Miller's questline. The results of his experiments are finally revealed.",
 tip:"Best rewards in this questline come from following all optional steps in parts 1 and 2.",status:0,notes:""},
{id:"sq07",r:"Trosky",tp:"Side Quest",o:7,name:"Frogs",m:false,hm:false,t:false,b:true,l:true,
 desc:"A bitter feud between Tachov and Zhelejov villages. Olbram (Zhelejov) wants Henry to steal the Maypole. Mutually exclusive with Mice — you cannot complete both fully. A third peaceful resolution exists via the Iron Nail oak tree.",
 tip:"To unlock the peaceful resolution in Battle of the Frogs and Mice: investigate local history with the Bailiff in Troskowitz. This reveals the Iron Nail embedded in an oak tree marking the true border — forcing a peace treaty. Best outcome for both villages.",status:0,notes:""},
{id:"sq08",r:"Trosky",tp:"Side Quest",o:8,name:"Mice",m:false,hm:false,t:false,b:true,l:true,
 desc:"The other side of the Tachov/Zhelejov feud. Prochek (Tachov) wants Henry to paint the bull. Mutually exclusive with Frogs — you cannot fully complete both. To start Mice after starting Frogs: rat out Prochek to Olbram.",
 tip:"Both Frogs and Mice must be started to unlock Battle of the Frogs and Mice. Truce trophy requires all three quests.",status:0,notes:""},
{id:"sq09",r:"Trosky",tp:"Side Quest",o:9,name:"Battle of the Frogs and Mice",m:false,hm:false,t:false,b:true,l:false,
 desc:"The conclusion of the Tachov/Zhelejov conflict. Three possible outcomes: side with Tachov (Mice ending), side with Zhelejov (Frogs ending), or broker a lasting peace via the Iron Nail border marker.",
 tip:"Peaceful resolution (best outcome): investigate local history with the Bailiff in Troskowitz. This reveals an Iron Nail embedded in an oak tree between the villages — the true historical border. Using this evidence lets Henry force a peace treaty. Earns the Truce trophy.",status:0,notes:""},
{id:"sq10",r:"Trosky",tp:"Side Quest",o:10,name:"Troubadours",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest givers: George and Michael, sitting at a table in the outdoor area of Zhelejov Wagoners' Inn (requires Wedding Crashers started). The two aspiring bards ask Henry to steal a lute from the carpenter's house in Troskowitz — the carpenter refuses to sell it. Steal it at night by lockpicking the workshop door (Very Easy). Return to George and Michael; a drunkard immediately breaks the strings. Beat him up or pass a Persuasion check to have him apologise. George and Michael then ask Henry to get new strings — they suggest Huntsman Vostatek, who made strings once before. This triggers Lackey (if not already done). After rescuing Vostatek, ask him about strings the next morning; he needs sheep guts. Buy sheep guts from the Troskowitz butcher (Butcher Bashka, under 0.5g for 3). Return the strings. Back at the inn: the innkeeper reveals George and Michael owe a debt — pay 100g outright, or do two chores: carry 8 sacks from the barrel cart, then dig out the latrine. After the debt is cleared, the musicians perform a song for Henry and the quest ends.",
 tip:"Buy sheep guts from Butcher Bashka in Troskowitz before triggering the strings step — saves a trip. The latrine-digging option is memorable. If you've already done Lackey you'll skip that section. Reward: nothing (the song is its own reward). George and Michael can be found at the inn from early evening.",status:0,notes:""},
{id:"sq11",r:"Trosky",tp:"Side Quest",o:11,name:"Mutt",m:false,hm:false,t:false,b:false,l:false,
 desc:"Find and rescue your loyal dog. Mutt becomes a permanent companion who alerts Henry to enemies and hidden items.",
 tip:"Get Mutt as early as possible — he's invaluable throughout the game and earns the Man's Best Friend trophy.",status:0,notes:""},
{id:"sq12",r:"Trosky",tp:"Side Quest",o:12,name:"Lackey",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Zlata at the farmhouse near Vidlak Pond, west of Tachov. Her husband Vostatek (the Troskowitz huntsman) has gone missing. Her son Vitek is unhelpful unless you pass a Persuasion check. Follow the path around Vidlak Pond north to find Vostatek stuck up a tree, drunk, being circled by wolves — kill the wolves to rescue him. He twists his ankle jumping down and asks Henry to carry him to his hidden camp. The journey is deliberately confusing: follow his drunk navigation past a fallen log, an anthill, a split birch tree, and a cairn. At the camp, his friend Pepik (and his horse) have been captured by poachers in a nearby bandit camp. Clear the five bandits (one armoured, the rest light), free Pepik the horse. Return to Vostatek's hut for up to 80g reward (80g if you kill all enemies and rescue Pepik; 45g if Pepik dies or you avoid the fight). Vostatek then unlocks as a skill trainer and the Bird of Prey task follow-up opens.",
 tip:"Don't walk away from Vostatek after approaching him or the wolves kill him, permanently locking Bird of Prey. If you're on a Lent run, fight the wolves unarmed. There's a hidden stash near the horse at the north edge of the bandit camp. The Vostatek 'drunk at the wedding' moment in Wedding Crashers is a separate optional activity. Completing Lackey also lets you ask Vostatek about lute strings for Troubadours — bring sheep guts (buy from Butcher Bashka in Troskowitz for <0.5g).",status:0,notes:""},
{id:"sq13",r:"Trosky",tp:"Side Quest",o:13,name:"Combat Training 1",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Train with the fighters at the Nomad's Camp. Significantly improves Henry's combat skills.",
 tip:"Do both Combat Training quests before any major combat — the skill bonuses are substantial.",status:0,notes:""},
{id:"sq14",r:"Trosky",tp:"Side Quest",o:14,name:"Combat Training 2",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Advanced combat training at the Nomad's Camp.",
 tip:"",status:0,notes:""},
{id:"sq15",r:"Trosky",tp:"Side Quest",o:15,name:"Miri Fajta",m:false,hm:false,t:false,b:true,l:false,
 desc:"'Our family' in Romani. Quest giver: Voivode (camp leader) at the Nomad's Camp, requires Wedding Crashers started. His daughter Marika is missing. Search Marika's tent for her scarf, speak to Aranka and Bozhena — Bozhena knows where Marika fled. Track Marika with Mutt using the scarf to rocks near Apollonia, where you find her nursing her wounded Semine lover, Bohush. She needs healing herbs (comfrey, marigold, bandages — bring them) and the Voivode's amulet. Back at camp, the Voivode demands Henry first rescue his captured son Tibor from villagers in Semine (Saddler's shop, southwest — Speech/Intimidate/sneak through back window) and bury his dead son Gejza. Only then will he wager the amulet in three contests: a horse race against Tibor, a fistfight, and dice. Win 2 of 3 contests to take the amulet to Marika. Best ending: win the wager so the Voivode personally accompanies you to Marika's camp, reconciles with her, and she returns home with Bohush. If you lose: Aranka intervenes and delivers the amulet, but Marika refuses to return.",
 tip:"Bring comfrey, marigold decoction, and bandages before travelling to Apollonia — Marika asks for them immediately. Speak to Aranka before the wager contests — she can coach you on how to win. Don't give the Voivode Marika's document unless you want a bad ending; use it as leverage for the wager instead. No coin reward — the best outcome is the celebratory night at camp. Unlocks The Voivode's Curse task (Aranka) afterward.",status:0,notes:""},
{id:"sq16",r:"Trosky",tp:"Side Quest",o:16,name:"Bad Blood",m:false,hm:false,t:false,b:true,l:false,
 desc:"Herbwoman Bozhena's daughter Pavlena has gone missing in Troskowitz. Investigate her disappearance — she was secretly seeing a man named Roman, who is found murdered. Farmhand Straw's brother Ota has taken Pavlena hostage. At the gorge: don't move when you enter or Ota kills her. Negotiate — appeal to God's forgiveness, then promise to put in a good word with Von Bergow. After rescuing her, Bozhena demands you kill farmer Jakesh (the man who had her banished). You can kill him, take him to the bailiff, or persuade him to make peace. The ending depends on this final choice.",
 tip:"BEST OUTCOME: Persuade Jakesh to make peace (pays Bozhena 100g compensation, she returns to town). Pavlena and Bozhena become available as trainers/traders. WARNING: If you refuse to help at all, Bozhena hangs herself and Pavlena is executed days later. Keep Ota's dog alive — mention it during negotiations for better outcomes.",status:0,notes:""},
{id:"sq17",r:"Trosky",tp:"Side Quest",o:17,name:"Invaders",m:false,hm:false,t:false,b:true,l:false,
 desc:"Quest giver: Innkeeper Betty in Troskowitz (requires Wedding Crashers started; must return to Troskowitz after at least one in-game day). Betty tells Henry that a group of Cumans are sitting in the tavern making the locals uneasy. Speak to Vuytek (usually outside the apothecary) — he wants the Cumans gone. Head to their camp northwest of the Nomad's Camp and talk to their leader Vasko. The best outcome involves drinking with Vasko: exhaust his dialogue about Hungary, Skalitz, and Sigismund (stacking reputation), then redirect to the matter of Troskowitz. Vasko agrees to stay away. The infamous drinking check: if you fail, Henry vomits on Vasko's shoes — apologise quickly to recover some rep. Henry gets so drunk he ends up speaking Hungarian. Wake up with a hangover next morning (without your clothes if you drank deeply enough), wait for it to clear, then return to Vuytek. You can be honest or lie (Speech 10+ to convince him you handled it peacefully). Alternatively, fight the Cumans and report back — but they're tough and killing them makes their allies hostile later. Reward: 25 Groschen.",
 tip:"Best outcome: drink with Vasko, redirect to Troskowitz, apologise if you vomit, and report honestly to Vuytek (Charisma 10+ or Speech needed). Don't fight them — they're formidable and the peaceful route gives better long-term relations with the Cumans.",status:0,notes:""},

// ── TROSKY TASKS (19) ────────────────────────────
{id:"t01",r:"Trosky",tp:"Task",o:1,name:"A Sinful Soul",m:true,hm:true,t:false,b:false,l:false,
 desc:"Only unlocked by completing every optional objective in The Hermit — including exhausting all dialogues with Innkeeper Betty, speaking to all witnesses, and investigating the black horse in Apollonia. The Hermit (whose real name is revealed through this investigation) then confesses a sin of his past and gives Henry a task: bring a conciliatory cross to Widow Margaret in Troskowitz in exchange for his sword. Margaret, it turns out, has been waiting years for acknowledgement of her deceased husband Jan — a man with no grave. Henry must escort her to the graveyard at night to lay Jan to rest.",
 tip:"🔴 HIGHLY MISSABLE: This task only unlocks if you do ALL optional steps in The Hermit in order. Speak to Betty first, complete every witness, investigate the horse, THEN confront the Hermit with 'I learned some strange things about you…' and exhaust his dialogue fully. Margaret is in Troskowitz in the evenings, usually across from the tailor. The graveyard scene is one of the quietest and most moving moments in the game.",status:0,notes:""},
{id:"t02",r:"Trosky",tp:"Task",o:2,name:"Canker",m:true,hm:false,t:false,b:false,l:false,
 desc:"First task in the Gules questline (Semine). Gules — a former bandit turned guard — needs Henry's help tracking a criminal called Canker.",
 tip:"⛔ BLOCKED if Semine family was destroyed in Necessary Evil (Hashek path). Gules only exists if the family survived. Complete before Necessary Evil.",status:0,notes:""},
{id:"t03",r:"Trosky",tp:"Task",o:3,name:"Handsome Charlie",m:true,hm:false,t:false,b:false,l:false,
 desc:"Second task in the Gules questline. Track down a criminal called Handsome Charlie.",
 tip:"⛔ BLOCKED if Semine family destroyed. Requires Canker to be completed first. Must complete before Necessary Evil.",status:0,notes:""},
{id:"t04",r:"Trosky",tp:"Task",o:4,name:"Johnny the Gob",m:true,hm:false,t:false,b:true,l:false,
 desc:"Third task in the Gules questline. Track down Johnny the Gob. Note: if you spare Johnny he surrenders his shield and flees — fast travel back to Gules immediately or the quest bugs out. Knocking him out after he surrenders is a reliable workaround.",
 tip:"⛔ BLOCKED if Semine family destroyed. Bug warning: if Johnny is spared, fast travel to Gules instantly or knock Johnny out first to prevent auto-complete failure.",status:0,notes:""},
{id:"t05",r:"Trosky",tp:"Task",o:5,name:"Casper",m:true,hm:false,t:false,b:false,l:false,
 desc:"Fourth and final task in the Gules questline.",
 tip:"⛔ BLOCKED if Semine family destroyed. Must complete before Necessary Evil.",status:0,notes:""},
{id:"t06",r:"Trosky",tp:"Task",o:6,name:"Melee at the Mill",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Brawler questline begins at Lower Semine Mill. Fight in underground bare-knuckle bouts.",
 tip:"Win all four brawler questline tasks for the Henry the Bruiser trophy.",status:0,notes:""},
{id:"t07",r:"Trosky",tp:"Task",o:7,name:"More Melee at the Mill",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"Repeatable brawler fights at the mill. Doesn't count toward the 'Been There Done That' total.",
 tip:"Only the first completion of each unique fight counts toward trophies.",status:0,notes:""},
{id:"t08",r:"Trosky",tp:"Task",o:8,name:"Wine, Women and Blood",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Brawler questline moves to the Zhelejov Wagoners' Inn.",
 tip:"",status:0,notes:""},
{id:"t09",r:"Trosky",tp:"Task",o:9,name:"The Best for Last",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"Final brawler questline task. The toughest fight of the questline.",
 tip:"Having Combat Training 1 and 2 done makes this significantly easier.",status:0,notes:""},
{id:"t10",r:"Trosky",tp:"Task",o:10,name:"The Voivode's Curse",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Aranka at the Nomad's Camp, after completing Miri Fajta. Aranka believes the Voivode (her husband, the camp leader) has been cursed by an enemy. She wants Henry to forge a special Rikonaris' Sabre at the blacksmith in Tachov, using materials she provides plus items Henry must source (Iron, Copper, Steel, Fastening Material from Radovan; Deer Skin from hunting or a trader). She also gives Charcoal Water to quench the blade after forging. Once forged and quenched, the ritual requires killing an animal with the sabre. Return the sabre to Aranka. Reward: Vagrant Hat, 45 Groschen.",
 tip:"You can lie to Aranka about killing an animal with the sabre and she won't know. Wolves count for the animal kill, or you can slash a wolf/dog corpse at an angle. All crafting materials except Deer Skin can be bought from Blacksmith Radovan in Tachov. Deer Skin can be bought from hunters and traders.",status:0,notes:""},
{id:"t11",r:"Trosky",tp:"Task",o:11,name:"The Axe from the Lake",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Zdenyek the Mouth in Tachov. He tells Henry the story of two brothers and a silver axe buried near Rocktower Pond. Bring a Spade (essential). Travel east of Zhelejov Wagoners' Inn to the Rocktower Pond Pier, then head northeast to find the old oak tree, continue northeast to find a rock and a graveyard nearby. Dig at the marked spot to uncover a stash containing a Broken Round Shield, Gemstone Silver Ring, Marigold x5, and a Broken Axe. The axe can be repaired by a blacksmith. Return to Zdenyek to complete the task.",
 tip:"Bring a Spade before starting — you cannot complete the dig without one. The stash is in a small graveyard north of the rock, not actually in the lake (the name is part of the legend). A broken axe from the stash can be repaired into a usable weapon.",status:0,notes:""},
{id:"t12",r:"Trosky",tp:"Task",o:12,name:"Bird of Prey",m:false,hm:false,t:false,b:false,l:false,
 desc:"Follow-up to Lackey. After rescuing Vostatek and getting lute strings for Troubadours, Vostatek asks Henry to help him set a trap for the poachers at his regular hunting ground. Follow Vostatek at night to the poaching spot, ambush the group of poachers, and defeat them. Return to Vostatek afterward. Reward: coin + Vostatek remains available as a skill trainer.",
 tip:"Straightforward combat ambush at night. Have a torch ready. Completing this quest unlocks Vostatek as a permanent skill trainer in Troskowitz.",status:0,notes:""},
{id:"t13",r:"Trosky",tp:"Task",o:13,name:"Sheep among Wolves",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain: Mutt → Sheep among Wolves → The Lost Sheep → Carrot on a Stick → Hunting the Werewolf. Triggered by Innkeeper Betty in Troskowitz 72 hours after completing Mutt. She mentions Herdsboy Siegfried has wolf trouble — go see him north of Tachov. Siegfried asks Henry to track down the wolf pack killing his sheep. Follow blood trail west into the woods, find the pack and kill them, bring back two wolf ears as proof. Siegfried rewards Henry with a special die and points him toward Smoliek and Stanislav for more shepherd work.",
 tip:"Must complete Mutt first, then wait 3 in-game days before Betty has the tip. Mutt is invaluable here — he alerts you to the wolves before you see them. Earns Shepherd's Champion trophy only if you complete all four tasks through Hunting the Werewolf.",status:0,notes:""},
{id:"t14",r:"Trosky",tp:"Task",o:14,name:"The Lost Sheep",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain quest 2 of 4. Shepherd Smoliek, southwest of Tachov (met during Mutt), has lost a sheep to wolves and needs its branded ear as proof it wasn't sold. Head into the woods west of Smoliek — find the dead sheep in the centre of the search area surrounded by wolves. Loot the ear directly from the dead sheep (no butchering needed). Return to Smoliek. He rewards Henry with cheap wine, Weak Marigold decoction, bandages, dried apple, cooked carrot, and the Die of Misfortune.",
 tip:"The wolves around the sheep can be avoided — just rush in and loot the ear if your combat level is low. Keep the Cooked Carrot reward; you'll need it for Carrot on a Stick.",status:0,notes:""},
{id:"t15",r:"Trosky",tp:"Task",o:15,name:"Carrot on a Stick",m:false,hm:false,t:false,b:false,l:false,
 desc:"Chain quest 3 of 4. Shepherd Stanislav near Apollonia fast travel point bought a new ram that ran off into the wolf-filled forest. Find the ram in the woods east of Stanislav — it's alone on a meadow. To get it to follow you back, you need a Carrot in your inventory (the Cooked Carrot from The Lost Sheep works). Walk it back to the pen at Stanislav's farm. Stanislav rewards Henry with coin, supplies, and the Lucky Die. If all three previous shepherd tasks are done, Stanislav marks the final task: Hunting the Werewolf.",
 tip:"The sheep follows you automatically if you have any carrot in inventory — don't eat them before this quest. Once the ram starts following, walk slowly back; it keeps pace but can get stuck on terrain.",status:0,notes:""},
{id:"t16",r:"Trosky",tp:"Task",o:16,name:"Hunting the Werewolf",m:false,hm:false,t:false,b:false,l:false,
 desc:"Final task in the Shepherd questline. Quest giver: Herdsboy Natan in Semine (available after completing Carrot on a Stick — Smoliek marks him). Natan says a werewolf is stealing sheep at night. Head north of Semine and pull a bloodied broken arrow from a tree, which opens a wider search area. Follow the blood trail west through the woods — bloodstains lead off the path to a camp behind a large rock. Three hostile vagabonds are guarding the camp — they cannot be talked to and will attack. Kill them. Examine the dead sheep in the camp to complete the investigation. Return to Natan. Reward: Survival XP, Reputation, 25 Groschen, 1 Schnapps, 1 Weak Saviour Schnapps, 2 Bandages, 1 Bread, 2 Cooked Onion, Even Die.",
 tip:"Mutt is invaluable here for tracking the blood trail through the woods. The vagabonds are not especially tough but they're grouped — approach the camp carefully. Completing this quest earns the Shepherd's Champion trophy (requires Mutt + Sheep among Wolves + The Lost Sheep + Carrot on a Stick + this quest all completed).",status:0,notes:""},
{id:"t17",r:"Trosky",tp:"Task",o:17,name:"Demons of Trosky",m:true,hm:true,t:false,b:false,l:false,
 desc:"Speak to Chamberlain Ulrich in Trosky Castle after starting 'Back in the Saddle'.",
 tip:"🔴 HIGHLY MISSABLE: Must complete before the end of Necessary Evil.",status:0,notes:""},
{id:"t18",r:"Trosky",tp:"Task",o:18,name:"Pilgrimage",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"If Henry has broken the law, he can atone by speaking to Father Nicodemus and undertaking a pilgrimage.",
 tip:"Repeatable. Does NOT count toward 'Been There Done That' trophy.",status:0,notes:""},
{id:"t19",r:"Trosky",tp:"Task",o:19,name:"The Lion's Crest",m:false,hm:false,t:false,b:false,l:false,
 desc:"Pre-order DLC task in the Trosky region. A unique item hunt.",
 tip:"Pre-order / DLC content.",status:0,notes:""},

// ── KUTTENBERG SIDE QUESTS (23) ──────────────────
{id:"sq18",r:"Kuttenberg",tp:"Side Quest",o:1,name:"Yackers 'n' Fash",m:false,hm:false,t:false,b:false,l:false,
 desc:"An introduction to Kuttenberg's criminal underworld through a pair of colourful local criminals.",
 tip:"Earns the 'Under a Brown Flag' trophy. Leads into Striped Tonies.",status:0,notes:""},
{id:"sq19",r:"Kuttenberg",tp:"Side Quest",o:2,name:"Striped Tonies",m:false,hm:false,t:false,b:false,l:false,
 desc:"Continuation of the criminal underworld questline begun in Yackers 'n' Fash.",
 tip:"Both Yackers 'n' Fash and Striped Tonies needed for the Under a Brown Flag trophy.",status:0,notes:""},
{id:"sq20",r:"Kuttenberg",tp:"Side Quest",o:3,name:"A Good Scrub",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Bathhouse owner Betty at the Kingfisher Bathhouse in the Hoprink district (southeast Kuttenberg). Requires MQ14: Speak of the Devil. Betty is trying to restart her bankrupt bathhouse. She needs Henry to collect her 'package' from Grund — Wagoner Matsek is nervous about transporting the girls who will work there. Convince Matsek (Easy Persuasion or Impression check), speak to the four girls at outdoor tables, then ride the wagon back to Kuttenberg. Betty then asks Henry to act as a town crier: help compose the promotional speech, then visit four daytime locations (Grain Market, Horse Market, Merchants' Street, Vintners' Street) and shout the opening announcement. A religious critic at one stop may need to be talked down or fought. After the opening party, a bathhouse maid wakes Henry — the Alderman is doing an unannounced inspection. Before his timer expires: carry four unconscious guests to the upstairs bedroom, collect six scattered tankards, pick up five pieces of clothing, and scrub the pile of sick by the middle bathtub. Follow the Alderman outside for his verdict. Reward: 100g + permanent discount at Kingfisher. Leads to Ill Repute.",
 tip:"Announce during the day only — no one hears you at night. The cleanup has a tight timer; prioritise unconscious guests first, then tankards, clothes, scrub. Do not leave the bathhouse before finishing or the Alderman starts his inspection early.",status:0,notes:""},
{id:"sq21",r:"Kuttenberg",tp:"Side Quest",o:4,name:"Ill Repute",m:false,hm:false,t:false,b:false,l:false,
 desc:"Continuation of A Good Scrub — return to Betty at the Kingfisher Bathhouse a few in-game days after opening. The city council is voting to elevate one bathhouse to Municipal Bathhouse status (exempt from the new clean tax). Rival bathhouse owner Adam is bribing Councillor Jerome Naaz to get the title. Betty needs Henry to sabotage Naaz and win over Councillor Tuchmacher. Sabotage options via the City Bathhouse (southwest Kuttenberg): talk to Meaty Mary (Speech/Charisma check or bribe) to learn Naaz is allergic to chamomile and keeps special wine upstairs — pour Chamomile Brew into the cask (Hard lockpick, second floor). Talk to Katcha (Speech check or bribe) to learn Naaz has a flea phobia — get a flea-ridden blanket from a sack east of Town Hall and sprinkle fleas on his chest and basket. Buy a Noblewoman's Cotchardie from the tailor north of the bathhouse to get Foreign Fragrant Oil intel from Lida. Report findings to Betty. Win Tuchmacher's vote by defeating his champion in a duel. Best outcome: Betty wins Municipal Bathhouse title. Reward: free Kingfisher services permanently + Kuttenberg reputation bump.",
 tip:"Chamomile Brew can be bought from the apothecary north of the City Bathhouse. Lock the door to Naaz's floor or wait until evening to reduce detection. The duel with Tuchmacher's champion requires decent combat skill — eat a meal first for the stat boost. The more sabotage actions you complete, the more certain Betty's win.",status:0,notes:""},
{id:"sq22",r:"Kuttenberg",tp:"Side Quest",o:5,name:"Feast for the Poor",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Chenyek at The Hole in the Wall tavern (southeast Kuttenberg, Hoprink district). Steal quality sausages from Sigismund's supply warehouse south of the city and distribute them to five beggars around Kuttenberg. Optionally steal wine for Knuckles. Starts the Kuttenberg thieves' Guild questline. See the ⚖️ The Guild tab for the full questline details.",
 tip:"Requires MQ14: Speak of the Devil. The warehouse is south of the walls; go at night in cloth armour or just sprint in. Buy a cabbage beforehand to leave as a prank in the chest. Give wine to Knuckles for 100g. Completing this unlocks The Thieves' Code.",status:0,notes:""},
{id:"sq23",r:"Kuttenberg",tp:"Side Quest",o:6,name:"The Spark",m:true,hm:false,t:false,b:true,l:false,g:true,
 desc:"⚠️ GATED: Requires completing MQ17: Via Argentum AND The Thieves' Code first, then waiting 2-3 in-game days. A messenger intercepts Henry near Suchdol. ⚠️ MUTUALLY EXCLUSIVE WITH CIVIC DUTY. ⚠️ MISSABLE if Goliath dies during Ransom. The Guild plans to sabotage Sigismund's silver mine near Horschan. Henry gets a Black Powder Keg, meets Goliath's crew at the campfire, follows Goliath into the mine at night, plants the keg at the marked support beam, escapes the blast. Reward: 150g (side with Chenyek) or 60g (side with Knuckles). See the ⚖️ The Guild tab for full details.",
 tip:"🔴 GATED behind Via Argentum + Thieves' Code. MISSABLE if Goliath dies. Do NOT complete Civic Duty if you want this quest. For Remember, Remember… trophy: save at mine entrance, kill Goliath, throw barrel into campfire (game over + trophy), reload and redo properly.",status:0,notes:""},
{id:"sq24",r:"Kuttenberg",tp:"Side Quest",o:7,name:"In Vino Veritas",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Casper Rudolf at a wine stall north of the fountain on Vintners' Street, Kuttenberg. Casper planted a vineyard but can't compete with the Sedletz Monastery wine. He asks Henry to pose as a connoisseur and impress Innkeeper Havel at The Emperor Charles Tavern (northeast of Casper) to learn the monks' secret. Optionally: retrieve Casper's wine manuscript from Adleta Mannlicher (his ex-lover's daughter, found in a garden in southeast Kuttenberg — pass two Speech checks with guard Hugo to enter, or climb the wall). Reading the book makes Havel's wine quiz significantly easier. Impress Havel by agreeing with his tastes and using Drinking skill responses — he eventually reveals the monks' secret ingredient is sulphur burned in barrels. Return to Casper; he pays 55g and asks Henry to infiltrate the monastery vineyard north of Kuttenberg and steal five grape seedlings plus a sample of the sulphur compound. Get hired via Under the Straw Hat (speak to Administrator Jerome at the vineyard entrance) for legitimate access, or lockpick the cellar — pickpocket Jerome for the Vineyard Cellar Key to skip this. Return everything to Casper. Reward: 205g (minimum) up to 425g+ with all optional objectives.",
 tip:"Get the manuscript from Adleta first — it guarantees Havel's tasting answers. Under the Straw Hat is the cleanest vineyard infiltration route and runs simultaneously. The sulphur compound and seedlings are in the vineyard cellar building (centre of vineyard). Casper is on Vintners' Street, not near any tavern.",status:0,notes:""},
{id:"sq25",r:"Kuttenberg",tp:"Side Quest",o:8,name:"Ars Dimicatoria",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"A formal combat questline involving the art of swordsmanship and a challenging instructor.",
 tip:"Leads into the Kuttenberg Tournament. Complete this first.",status:0,notes:""},
{id:"sq26",r:"Kuttenberg",tp:"Side Quest",o:9,name:"Kuttenberg Tournament",m:false,hm:false,t:false,b:false,l:false,act:"once",
 desc:"A full tournament held in Kuttenberg. Multiple combat disciplines. Strong rewards and prestige.",
 tip:"Requires completing Ars Dimicatoria first. Keep your weapon in top repair.",status:0,notes:""},
{id:"sq27",r:"Kuttenberg",tp:"Side Quest",o:10,name:"Lost Honour",m:true,hm:false,t:false,b:true,l:false,
 desc:"Random encounter on the road southwest of Horschan (crossroads south of Devil's Den). Fast-travel between Horschan and Miskowitz repeatedly to trigger the 'Polite Armed Man' prompt. Jezhek of Holohlavy calls Henry into the bushes and half-heartedly tries to rob him — he is clearly a desperate, down-on-his-luck knight. Pass a Speech or Dread check to avoid a fight, or duel him briefly and stop when he surrenders (do not kill him). He reveals he lost his horse Gringolet and his family armour in a wager to Zavish of Garbow at Sigismund's Camp. Two paths: (Noble) Find Zavish in his tent near the mercenary camp centre — pass a Domination check (medium difficulty, recommended over Warfare which is Very Hard) to challenge him to a duel. Beat him in up to three rounds to win the armour and horse back. (Sneaky) Steal the armour from the Hard-locked chest in Zavish's tent (pickpocket Zavish for the key while he sleeps) and take Gringolet from the stables. Bring horse and armour to Jezhek waiting at the inn in Pschitoky. Reward: 500g + Lord of Holohlavy heater shield (if you return armour) + Jezhek's spurs. Master of Masters trophy if you beat Zavish in all three duel rounds.",
 tip:"⚠️ MISSABLE: Requires MQ14 to be active. The trigger is a fast-travel interrupt — if it doesn't fire, fast-travel back from Miskowitz to Horschan and try again. Save before speaking to Zavish — the duel is tough. Domination is the easier skill check. You can lie to Jezhek about the armour to keep it, but he gives you nothing. Must park Gringolet at the Pschitoky inn stables before talking to Jezhek.",status:0,notes:""},
{id:"sq28",r:"Kuttenberg",tp:"Side Quest",o:11,name:"The Mouth of Hell",m:false,hm:false,t:false,b:false,l:false,
 desc:"Speak to Father Marian in Old Kutna. A dark and atmospheric quest involving religious superstition and real danger.",
 tip:"You may need to complete a Pilgrimage task first.",status:0,notes:""},
{id:"sq29",r:"Kuttenberg",tp:"Side Quest",o:12,name:"Thou art but dust…",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Brother Morticius at Sedletz Monastery (northeast Kuttenberg, east of Old Kutna). The blind, rhyming ossuary caretaker asks Henry to tidy the long-neglected chapel — collect and arrange scattered bones and skulls into three separate pyramids (skulls, cracked skulls, thigh bones). Bones come in groups; interact with piles to collect. Once the main floor is cleared, interact with the trapdoor in the middle to fall into the lower crypt. Collect remaining bones there, arrange them, then find the way out through a tunnel (go south through the room with a preserved body). Above ground: speak to the gravedigger and monks to ask about Morticius — his identity is revealed through their reactions. The twist ending is one of the memorable moments in the Kuttenberg region. Best combined with The Reliquary (the Humble Knight northeast of Kuttenberg starts it; one objective leads you to the same crypt).",
 tip:"Do NOT interact with the trapdoor until you've collected all bones on the main floor or you'll fall early. Morticius can be found just outside the chapel near the cemetery, talking to himself in rhyme. Running this alongside The Reliquary is efficient — same crypt, same trip.",status:0,notes:""},
{id:"sq30",r:"Kuttenberg",tp:"Side Quest",o:13,name:"Spoils of War",m:false,hm:false,t:false,b:false,l:false,
 desc:"A Sigismund quartermaster soldier at Sigismund's Camp near Kuttenberg has commandeered a village's food supply and refuses to leave. Henry must negotiate to get the soldiers to move on. Find additional food sources for the soldiers — the village has cows, beer, and a hidden cache. Combine food with a coin bribe for the most reliable outcome; soldiers care more about money than food alone.",
 tip:"Bribe the commander with coin alongside pointing out the village's beer and cows. Food donations alone are not enough. A straightforward negotiation task.",status:0,notes:""},
{id:"sq31",r:"Kuttenberg",tp:"Side Quest",o:14,name:"Hush, My Darling…",m:false,hm:false,t:false,b:true,l:false,
 desc:"Quest giver: Martha, the blacksmith's wife in Miskowitz (east side of village). She asks Henry to forge two sets of horseshoes (craft at the nearby blacksmith station using Scrap Metal + Farmer's Horseshoes sketch; or pass a Hard Craftsmanship check with her husband for free materials). Deliver the horseshoes to Victoria in the house south of the smithy — Victoria is gone, blood on the floor. Return to Martha; ask the butcher, innkeeper, Kuba the farmer (pickpocket him for Victoria's Scarf to let Mutt track her), and a Sigismund's Camp blacksmith. Trail leads to Black, a soldier in the camp's field infirmary with a stomach ailment — give him a Digestive Potion to get Victoria's location. Find Victoria: convince her to return (or she may take her life — prevent this at all costs). Henry the Matchmaker trophy: carry Black to Victoria personally so they can resolve things face to face. Multiple outcomes depending on whether you convince Black to take responsibility. Reward: 60g (horseshoes) + trophy if you reunite them properly.",
 tip:"Bring a Digestive Potion before going to Sigismund's Camp — it's needed for Black. If you have Mutt's Houndmaster skill, pickpocket the Scarf from Kuba to skip much of the investigation. The hidden timer is tight — do not sleep or skip time after discovering Victoria is missing. 'Henry the Matchmaker' trophy requires physically carrying Black to Victoria.",status:0,notes:""},
{id:"sq32",r:"Kuttenberg",tp:"Side Quest",o:15,name:"All's fair…",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this quest need verification — placeholder. Name confirmed real. A side quest in Kuttenberg near Wysoka. Connects to Seeking Justice task.",
 tip:"Details to be confirmed.",status:0,notes:""},
{id:"sq33",r:"Kuttenberg",tp:"Side Quest",o:16,name:"Bellatores",m:false,hm:false,t:false,b:false,l:false,
 desc:"Quest giver: Jan Posy of Zimburg, outside the tavern in Bylany. Jan's brother has been kidnapped by Cumans and he wants Henry's help. Ride alongside Jan from Bylany — you can gather information about the situation on horseback. Find and fight the group of Cumans at the first camp. Continue to track the kidnapped brother across multiple Cuman locations, fighting through the group. Rescue Jan's brother and return.",
 tip:"Fairly straightforward combat quest — ride with Jan and clear the Cuman camps. Talk to Jan during the ride for backstory. Leads to Dragon's Lair.",status:0,notes:""},
{id:"sq34",r:"Kuttenberg",tp:"Side Quest",o:17,name:"Dragon's Lair",m:false,hm:false,t:false,b:false,l:false,
 desc:"Continuation of Bellatores — follows on from rescuing Jan's brother. Details involve tracking down the remaining Cuman threat and a larger confrontation. Leads directly from the Bellatores questline in Bylany.",
 tip:"Complete Bellatores fully before starting this. Combat-focused quest.",status:0,notes:""},
{id:"sq35",r:"Kuttenberg",tp:"Side Quest",o:18,name:"The Thunderstone",m:false,hm:false,t:false,b:true,l:false,
 desc:"Quest giver: Kona in Grund (near the drying racks/herb garden). Requires MQ14 Speak of the Devil. Kona is the blacksmith's wife and wants Henry to find a Thunderstone — a meteorite fragment believed to be a powerful protective charm — for personal reasons. The last known holder is Thomlin Bruthans in Horschan to the west. Thomlin hosts fistfights and wagers the stone; Henry must fight him (500g wager, Hard speech checks to arrange it, or leverage from Fight Dirty task). After winning, Thomlin admits he no longer has it — it was stolen by Peter and Hensel of Raborsch. Head to Raborsch; Peter says Hensel was captured by Andrew's bandit camp northeast of Raborsch. Rescue Hensel (pay 1000g, pass Intimidation check, or fight). Hensel reveals he and Peter sold the stone to Mlada in Suchdol. Find Mlada in the southernmost house in Suchdol — she bought it to help her ailing husband (unlocks task Primum Nil Nocere). After resolving her husband's illness via Primum Nil Nocere, Mlada returns the stone. Final choice: give to Kona (100g + Alchemy XP + Grund horse trader discount, unlocks Primum Nil Nocere), return to Thomlin (150g OR Unarmed XP), or keep it as an inventory item.",
 tip:"Long quest that crosses most of the Kuttenberg map. Bring Strong Quickfinger potions in case you need to fight at the bandit camp. If you've done Fight Dirty you can get Thomlin to fight without speech checks. Killing Thomlin lets you loot a 'fake thunderstone' from him — you can give this fake to Kona to deceive her (but lose rep). Hensel can also point you to a hidden stash at the Two Dead Trees site (357g). Give to Kona for the Primum Nil Nocere follow-up task. Return to Thomlin for 150g OR Unarmed XP — not both.",status:0,notes:""},
{id:"sq36",r:"Kuttenberg",tp:"Side Quest",o:19,name:"The Magic Arrow",m:false,hm:false,t:false,b:false,l:false,
 desc:"Archery-focused quest at the Devil's Den area. Tests marksmanship skills.",
 tip:"",status:0,notes:""},
{id:"sq37",r:"Kuttenberg",tp:"Side Quest",o:20,name:"The Heirloom",m:false,hm:false,t:false,b:false,l:false,
 desc:"Retrieve a stolen family heirloom. The owner's story is more complicated than it first appears.",
 tip:"",status:0,notes:""},
{id:"sq38",r:"Kuttenberg",tp:"Side Quest",o:21,name:"Ransom",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this task need verification — placeholder. A side quest in the Kuttenberg region. Name confirmed real. Note: Goliath (used in The Spark) may be connected — if Goliath dies during Ransom, The Spark is permanently locked.",
 tip:"⚠️ Do NOT let Goliath die during this quest if you want to do The Spark. Details to be confirmed.",status:0,notes:""},
{id:"sq39",r:"Kuttenberg",tp:"Side Quest",o:22,name:"Post Scriptum",m:false,hm:false,t:false,b:true,l:false,
 desc:"Requires MQ16: Into the Underworld. Quest giver: Kvyertsolav at a roadside tavern west of Kuttenberg (usually at the farthest outdoor table). He asks Henry to help compose a letter. Go to the designated house in Kuttenberg (the same location used in Into the Underworld). After writing the letter, the associates decide to kill Henry to keep him quiet. Escape via Persuasion or Intimidation check. Three paths: (A) Escape then side with the miners — meet at Hloushetz Gate, defeat Markold of Lourny together. Best reward: 150g. (B) Escape then turn the miners over to the bailiff — quick resolution, 100g. (C) Work with Markold against the miners — attack the miners' camp, 60g from Markold.",
 tip:"Path (A) gives the best reward. Select 'Justice is worth more than silver' when composing the letter. Kvyertsolav is at the outdoor tables of the tavern west of Kuttenberg — don't approach via the innkeeper.",status:0,notes:""},
{id:"sq40",r:"Kuttenberg",tp:"Side Quest",o:23,name:"The Fifth Commandment",m:false,hm:false,t:false,b:false,l:false,
 desc:"⚠️ Details for this quest need verification — placeholder. Name confirmed real. A side quest in Kuttenberg.",
 tip:"Details to be confirmed.",status:0,notes:""},

// ── KUTTENBERG TASKS (36) ────────────────────────
{id:"t20",r:"Kuttenberg",tp:"Task",o:1,name:"Arrow-head",m:true,hm:true,t:true,b:false,l:false,
 desc:"On a wilderness road near Kuttenberg, Henry encounters Karel Arrowhead — a man with a crossbow bolt lodged in his skull who is miraculously still alive and in good spirits. He explains the bolt has been there for years and he's learned to live with it. He asks Henry to help him find a barber-surgeon willing to attempt removal. The task is as absurd as it sounds — most surgeons refuse, but the eccentric barber-surgeon in Suchdol will consider it.",
 tip:"🔴 HIGHLY MISSABLE + TIME SENSITIVE: Karel's location on the road is a scripted one-time encounter that disappears once you pass through the area during a specific main quest window. Once he's gone, he's gone. Also: Karel is a walking Skyrim 'arrow to the knee' reference — the moment is worth stopping for even if you rush the task.",status:0,notes:""},
{id:"t21",r:"Kuttenberg",tp:"Task",o:2,name:"Popinjay Shoot",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"A traditional archery competition held regularly in Kuttenberg City. A wooden 'popinjay' (parrot) is mounted on a tall pole and competitors shoot it down in layers. Good coin reward for consistent wins.",
 tip:"Archery skill 12+ makes this comfortable. The parrot is stationary — no wind adjustment needed. A good repeatable source of Groschen if your bow game is solid.",status:0,notes:""},
{id:"t22",r:"Kuttenberg",tp:"Task",o:3,name:"The Thieves' Code",m:false,hm:false,t:false,b:false,l:false,
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Chenyek at The Hole in the Wall. Investigate chalk symbols on Kuttenberg buildings — thieves' cant used by the Guild. Find the parchment with drawings via the fountain riddle on Vintners' Street (go at noon, watch the shadow direction). Earn 100g from Chenyek and optionally 150g from Knuckles for showing them the parchment. Leads to Beyond the Grave.",
 tip:"Show Knuckles the parchment first for 150g, then Chenyek for 100g — you keep the same parchment. Must be at the fountain around noon to see the shadow. See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t23",r:"Kuttenberg",tp:"Task",o:4,name:"Beyond the Grave",m:false,hm:false,t:false,b:false,l:false,
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Rat at The Hole in the Wall. Rat needs a seal from the tomb of mine owner Hanuman Rot in the Sedletz Monastery ossuary crypt. Find the tomb via the trap door in the ossuary chapel — it's behind a suspicious brick wall to the south. The seal has already been taken by Gravedigger Lenek; his house is north of the monastery. Pickpocket him during the day or lockpick his house at night to retrieve it. Return to Rat. Reward: 225g + Agility XP.",
 tip:"Combines efficiently with Thou art but dust… — same crypt, same visit. Pickpocketing Lenek is easier than his Very Hard door lock. See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t24",r:"Kuttenberg",tp:"Task",o:5,name:"The German's Treasure",m:false,hm:false,t:false,b:false,l:false,
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Rat at The Hole in the Wall (after Beyond the Grave). Steal three items from the basement of the All Saints Tavern (south-centre Kuttenberg): an Old Rusty Sword, Bloodied Wedding Dress, and Old Painted Statuette. Best accessed via the Kuttenberg Underground (enter via crumbling building southwest of the city — keep right at crossroads, find the Wasteyard, climb the ladder to the tavern basement). Take the items to Innkeeper Helga at a tavern west of Kuttenberg; give the password 'big-eyed monkey.' Pass a Speech check to convince her and haggle for the price. Reward: up to 295g.",
 tip:"The underground tunnel route bypasses all guards entirely — recommended. Night entry through the tavern itself also works. Password for Helga is said as 'I'll have a big-eyed monkey.' See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t25",r:"Kuttenberg",tp:"Task",o:6,name:"Teeth in the Bag",m:false,hm:false,t:false,b:false,l:false,
 desc:"A task for a Kuttenberg dentist with more teeth than patience.",
 tip:"Leads into More Teeth in a Bag.",status:0,notes:""},
{id:"t26",r:"Kuttenberg",tp:"Task",o:7,name:"More Teeth in a Bag",m:false,hm:false,t:false,b:false,l:false,
