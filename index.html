 tip:"🏆 UNDER A BROWN FLAG TROPHY: Complete both Yackers 'n' Fash and Striped Tonies. The Tragedy in Danemark task must be triggered during Yackers 'n' Fash (find the tied-up family before clearing the mill) to earn its completion. Part of the questline: Yackers 'n' Fash → Tragedy in Danemark → Striped Tonies → Popinjay Shoot.",status:0,notes:""},
{id:"sq20",r:"Kuttenberg",tp:"Side Quest",o:3,name:"A Good Scrub",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Bathhouse owner Betty at the Kingfisher Bathhouse in the Hoprink district (southeast Kuttenberg). Requires MQ14: Speak of the Devil. Betty is trying to restart her bankrupt bathhouse. She needs Henry to collect her 'package' from Grund — Wagoner Matsek is nervous about transporting the girls who will work there. Convince Matsek (Easy Persuasion or Impression check), speak to the four girls at outdoor tables, then ride the wagon back to Kuttenberg. Betty then asks Henry to act as a town crier: help compose the promotional speech, then visit four daytime locations (Grain Market, Horse Market, Merchants' Street, Vintners' Street) and shout the opening announcement. A religious critic at one stop may need to be talked down or fought. After the opening party, a bathhouse maid wakes Henry — the Alderman is doing an unannounced inspection. Before his timer expires: carry four unconscious guests to the upstairs bedroom, collect six scattered tankards, pick up five pieces of clothing, and scrub the pile of sick by the middle bathtub. Follow the Alderman outside for his verdict. Reward: 100g + permanent discount at Kingfisher. Leads to Ill Repute.",
 tip:"Announce during the day only — no one hears you at night. The cleanup has a tight timer; prioritise unconscious guests first, then tankards, clothes, scrub. Do not leave the bathhouse before finishing or the Alderman starts his inspection early.",status:0,notes:""},
{id:"sq21",r:"Kuttenberg",tp:"Side Quest",o:4,name:"Ill Repute",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after A Good Scrub)",
 desc:"Continuation of A Good Scrub — return to Betty at the Kingfisher Bathhouse a few in-game days after opening. The city council is voting to elevate one bathhouse to Municipal Bathhouse status (exempt from the new clean tax). Rival bathhouse owner Adam is bribing Councillor Jerome Naaz to get the title. Betty needs Henry to sabotage Naaz and win over Councillor Tuchmacher. Sabotage options via the City Bathhouse (southwest Kuttenberg): talk to Meaty Mary (Speech/Charisma check or bribe) to learn Naaz is allergic to chamomile and keeps special wine upstairs — pour Chamomile Brew into the cask (Hard lockpick, second floor). Talk to Katcha (Speech check or bribe) to learn Naaz has a flea phobia — get a flea-ridden blanket from a sack east of Town Hall and sprinkle fleas on his chest and basket. Buy a Noblewoman's Cotchardie from the tailor north of the bathhouse to get Foreign Fragrant Oil intel from Lida. Report findings to Betty. Win Tuchmacher's vote by defeating his champion in a duel. Best outcome: Betty wins Municipal Bathhouse title. Reward: free Kingfisher services permanently + Kuttenberg reputation bump.",
 tip:"Chamomile Brew can be bought from the apothecary north of the City Bathhouse. Lock the door to Naaz's floor or wait until evening to reduce detection. The duel with Tuchmacher's champion requires decent combat skill — eat a meal first for the stat boost. The more sabotage actions you complete, the more certain Betty's win.",status:0,notes:""},
{id:"sq22",r:"Kuttenberg",tp:"Side Quest",o:5,name:"Feast for the Poor",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Chenyek at The Hole in the Wall tavern (southeast Kuttenberg, Hoprink district). Steal quality sausages from Sigismund's supply warehouse south of the city and distribute them to five beggars around Kuttenberg. Optionally steal wine for Knuckles. Starts the Kuttenberg thieves' Guild questline. See the ⚖️ The Guild tab for the full questline details.",
 tip:"Requires MQ14: Speak of the Devil. The warehouse is south of the walls; go at night in cloth armour or just sprint in. Buy a cabbage beforehand to leave as a prank in the chest. Give wine to Knuckles for 100g. Completing this unlocks The Thieves' Code.",status:0,notes:""},
{id:"sq23",r:"Kuttenberg",tp:"Side Quest",o:6,name:"The Spark",m:true,hm:false,t:false,b:true,l:false,g:true,req:"Via Argentum + Thieves' Code (MQ17 + Guild questline)",
 desc:"⚠️ GATED: Requires completing MQ17: Via Argentum AND The Thieves' Code first, then waiting 2-3 in-game days. A messenger intercepts Henry near Suchdol. ⚠️ MUTUALLY EXCLUSIVE WITH CIVIC DUTY. ⚠️ MISSABLE if Goliath dies during Ransom. The Guild plans to sabotage Sigismund's silver mine near Horschan. Henry gets a Black Powder Keg, meets Goliath's crew at the campfire, follows Goliath into the mine at night, plants the keg at the marked support beam, escapes the blast. Reward: 150g (side with Chenyek) or 60g (side with Knuckles). See the ⚖️ The Guild tab for full details.",
 tip:"🔴 GATED behind Via Argentum + Thieves' Code. MISSABLE if Goliath dies. Do NOT complete Civic Duty if you want this quest. For Remember, Remember… trophy: save at mine entrance, kill Goliath, throw barrel into campfire (game over + trophy), reload and redo properly.",status:0,notes:""},
{id:"sq24",r:"Kuttenberg",tp:"Side Quest",o:7,name:"In Vino Veritas",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Casper Rudolf at a wine stall north of the fountain on Vintners' Street, Kuttenberg. Casper planted a vineyard but can't compete with the Sedletz Monastery wine. He asks Henry to pose as a connoisseur and impress Innkeeper Havel at The Emperor Charles Tavern (northeast of Casper) to learn the monks' secret. Optionally: retrieve Casper's wine manuscript from Adleta Mannlicher (his ex-lover's daughter, found in a garden in southeast Kuttenberg — pass two Speech checks with guard Hugo to enter, or climb the wall). Reading the book makes Havel's wine quiz significantly easier. Impress Havel by agreeing with his tastes and using Drinking skill responses — he eventually reveals the monks' secret ingredient is sulphur burned in barrels. Return to Casper; he pays 55g and asks Henry to infiltrate the monastery vineyard north of Kuttenberg and steal five grape seedlings plus a sample of the sulphur compound. Get hired via Under the Straw Hat (speak to Administrator Jerome at the vineyard entrance) for legitimate access, or lockpick the cellar — pickpocket Jerome for the Vineyard Cellar Key to skip this. Return everything to Casper. Reward: 205g (minimum) up to 425g+ with all optional objectives.",
 tip:"Get the manuscript from Adleta first — it guarantees Havel's tasting answers. Under the Straw Hat is the cleanest vineyard infiltration route and runs simultaneously. The sulphur compound and seedlings are in the vineyard cellar building (centre of vineyard). Casper is on Vintners' Street, not near any tavern.",status:0,notes:""},
{id:"sq25",r:"Kuttenberg",tp:"Side Quest",o:8,name:"Ars Dimicatoria",m:false,hm:false,t:false,b:false,l:false,act:"once",req:"MQ14 — Speak of the Devil",
 desc:"A formal combat questline involving the art of swordsmanship and a challenging instructor.",
 tip:"Leads into the Kuttenberg Tournament. Complete this first.",status:0,notes:""},
{id:"sq26",r:"Kuttenberg",tp:"Side Quest",o:9,name:"Kuttenberg Tournament",m:false,hm:false,t:false,b:false,l:false,act:"once",req:"MQ14 — Speak of the Devil (after Ars Dimicatoria)",
 desc:"A full tournament held in Kuttenberg. Multiple combat disciplines. Strong rewards and prestige.",
 tip:"Requires completing Ars Dimicatoria first. Keep your weapon in top repair.",status:0,notes:""},
{id:"sq27",r:"Kuttenberg",tp:"Side Quest",o:10,name:"Lost Honour",m:true,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Random encounter on the road southwest of Horschan (crossroads south of Devil's Den). Fast-travel between Horschan and Miskowitz repeatedly to trigger the 'Polite Armed Man' prompt. Jezhek of Holohlavy calls Henry into the bushes and half-heartedly tries to rob him — he is clearly a desperate, down-on-his-luck knight. Pass a Speech or Dread check to avoid a fight, or duel him briefly and stop when he surrenders (do not kill him). He reveals he lost his horse Gringolet and his family armour in a wager to Zavish of Garbow at Sigismund's Camp. Two paths: (Noble) Find Zavish in his tent near the mercenary camp centre — pass a Domination check (medium difficulty, recommended over Warfare which is Very Hard) to challenge him to a duel. Beat him in up to three rounds to win the armour and horse back. (Sneaky) Steal the armour from the Hard-locked chest in Zavish's tent (pickpocket Zavish for the key while he sleeps) and take Gringolet from the stables. Bring horse and armour to Jezhek waiting at the inn in Pschitoky. Reward: 500g + Lord of Holohlavy heater shield (if you return armour) + Jezhek's spurs. Master of Masters trophy if you beat Zavish in all three duel rounds.",
 tip:"⚠️ MISSABLE: Requires MQ14 to be active. The trigger is a fast-travel interrupt — if it doesn't fire, fast-travel back from Miskowitz to Horschan and try again. Save before speaking to Zavish — the duel is tough. Domination is the easier skill check. You can lie to Jezhek about the armour to keep it, but he gives you nothing. Must park Gringolet at the Pschitoky inn stables before talking to Jezhek.",status:0,notes:""},
{id:"sq28",r:"Kuttenberg",tp:"Side Quest",o:11,name:"The Mouth of Hell",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Speak to Father Marian in Old Kutna. A dark and atmospheric quest involving religious superstition and real danger.",
 tip:"You may need to complete a Pilgrimage task first.",status:0,notes:""},
{id:"sq29",r:"Kuttenberg",tp:"Side Quest",o:12,name:"Thou art but dust…",m:false,hm:false,t:false,b:false,l:false,req:"MQ23 — Dancing with the Devil (refuse to burn Maleshov)",
 desc:"Quest giver: Brother Morticius at Sedletz Monastery (northeast Kuttenberg, east of Old Kutna). The blind, rhyming ossuary caretaker asks Henry to tidy the long-neglected chapel — collect and arrange scattered bones and skulls into three separate pyramids (skulls, cracked skulls, thigh bones). Bones come in groups; interact with piles to collect. Once the main floor is cleared, interact with the trapdoor in the middle to fall into the lower crypt. Collect remaining bones there, arrange them, then find the way out through a tunnel (go south through the room with a preserved body). Above ground: speak to the gravedigger and monks to ask about Morticius — his identity is revealed through their reactions. The twist ending is one of the memorable moments in the Kuttenberg region. Best combined with The Reliquary (the Humble Knight northeast of Kuttenberg starts it; one objective leads you to the same crypt).",
 tip:"Do NOT interact with the trapdoor until you've collected all bones on the main floor or you'll fall early. Morticius can be found just outside the chapel near the cemetery, talking to himself in rhyme. Running this alongside The Reliquary is efficient — same crypt, same trip.",status:0,notes:""},
{id:"sq30",r:"Kuttenberg",tp:"Side Quest",o:13,name:"Spoils of War",m:false,hm:false,t:false,b:false,l:false,
 desc:"A Sigismund quartermaster soldier at Sigismund's Camp near Kuttenberg has commandeered a village's food supply and refuses to leave. Henry must negotiate to get the soldiers to move on. Find additional food sources for the soldiers — the village has cows, beer, and a hidden cache. Combine food with a coin bribe for the most reliable outcome; soldiers care more about money than food alone.",
 tip:"Bribe the commander with coin alongside pointing out the village's beer and cows. Food donations alone are not enough. A straightforward negotiation task.",status:0,notes:""},
{id:"sq31",r:"Kuttenberg",tp:"Side Quest",o:14,name:"Hush, My Darling…",m:false,hm:false,t:false,b:true,l:false,
 desc:"Quest giver: Martha, the blacksmith's wife in Miskowitz (east side of village). She asks Henry to forge two sets of horseshoes (craft at the nearby blacksmith station using Scrap Metal + Farmer's Horseshoes sketch; or pass a Hard Craftsmanship check with her husband for free materials). Deliver the horseshoes to Victoria in the house south of the smithy — Victoria is gone, blood on the floor. Return to Martha; ask the butcher, innkeeper, Kuba the farmer (pickpocket him for Victoria's Scarf to let Mutt track her), and a Sigismund's Camp blacksmith. Trail leads to Black, a soldier in the camp's field infirmary with a stomach ailment — give him a Digestive Potion to get Victoria's location. Find Victoria: convince her to return (or she may take her life — prevent this at all costs). Henry the Matchmaker trophy: carry Black to Victoria personally so they can resolve things face to face. Multiple outcomes depending on whether you convince Black to take responsibility. Reward: 60g (horseshoes) + trophy if you reunite them properly.",
 tip:"Bring a Digestive Potion before going to Sigismund's Camp — it's needed for Black. If you have Mutt's Houndmaster skill, pickpocket the Scarf from Kuba to skip much of the investigation. The hidden timer is tight — do not sleep or skip time after discovering Victoria is missing. 'Henry the Matchmaker' trophy requires physically carrying Black to Victoria.",status:0,notes:""},
{id:"sq32",r:"Kuttenberg",tp:"Side Quest",o:15,name:"All's fair…",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Hired Hand Pavel in Wysoka (southwest Kuttenberg, south of Suchdol; speak to Innkeeper Zdeslav in Miskowitz for a tip). Pavel is in love with Ursula but she is betrothed to farmer's son Pivetz. His plan: steal 5 personal items from Wysoka villagers and plant them on Pivetz's property to ruin the engagement. The 5 targets: (1) Cobbler's Boots — in Vejmola's bedroom (Pavel gives you the key); (2) Vejmola's Medal — knock a magpie nest from the big tree in Bohushka's yard with a rock or arrow; (3) Gemstone Rosary — hard locked chest in Ursula's mother's room (or pickpocket her key at night); (4) Priest's Alchemy Book — on a table in Father Anthony's house (front door, go right); (5) Bohuska's Ring — speak to Bohuska, say 'I'm Francis, your husband' to gain free access, then eat the Kolachs on the baking table. Return all items to Pavel. Outcomes: (A) Give Pavel items — he trains Henry in Vitality; (B) Give Pavel 1000g — he gives Vitality training + teaches Speech; (C) Return items to Father Anthony — Anthony becomes an Alchemy and Scholarship skill trainer; (D) Keep items — Pavel reports Henry as criminal in Wysoka. Hard Speech check on Pavel reveals his real plan was to sell the items and fund a journeyman apprenticeship, not actually win Ursula.",
 tip:"Best outcome: Return items to Father Anthony (C) — unlocks him as Alchemy + Scholarship trainer AND gives extra XP. Read the Priest's Alchemy Book before handing it over for a free Alchemy level. Do all stealing at night. Seek Justice follow-up only unlocks if you give Pavel the physical items (option A).",status:0,notes:""},
{id:"sq33",r:"Kuttenberg",tp:"Side Quest",o:16,name:"Bellatores",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Jan Posy of Zimburg, outside the tavern in Bylany. Jan's brother has been kidnapped by Cumans and he wants Henry's help. Ride alongside Jan from Bylany — you can gather information about the situation on horseback. Find and fight the group of Cumans at the first camp. Continue to track the kidnapped brother across multiple Cuman locations, fighting through the group. Rescue Jan's brother and return.",
 tip:"Fairly straightforward combat quest — ride with Jan and clear the Cuman camps. Talk to Jan during the ride for backstory. Leads to Dragon's Lair.",status:0,notes:""},
{id:"sq34",r:"Kuttenberg",tp:"Side Quest",o:17,name:"Dragon's Lair",m:false,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Monk Slava in Bylany (bench under the tree near the church; speak to the Bylany innkeeper first if the '!' doesn't appear). Requires MQ14. Slava asks Henry to deliver a message to Abbot Jan III at a small church just outside Kuttenberg city. En route, mercenary Gerhard intercepts Henry and offers a competing deal: bring him the 'dragon bones' for 275 Groschen instead (for King Sigismund). The abbot sends Henry back to Bylany to help Slava find the bones in a cave northeast of Bylany. Three outcomes: (A) Side with Slava — secure bones for destruction; Gerhard sends mercenary waves to stop you; fight them off for 60g + rep. (B) Side with Gerhard — hand bones to him for 275g; Slava and abbot betrayed. (C) Negotiate both sides mid-quest for ~150g partial reward.",
 tip:"Path (B) gives most groschen; Path (A) gives best reputation. Gerhard sends 3 mercenary waves during Path A — funnel them at the cave exit. The cave itself has no enemies. Talk to the Bylany innkeeper first if Monk Slava's quest icon won't appear.",status:0,notes:""},
{id:"sq35",r:"Kuttenberg",tp:"Side Quest",o:18,name:"The Thunderstone",m:false,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Kona in Grund (near the drying racks/herb garden). Requires MQ14 Speak of the Devil. Kona is the blacksmith's wife and wants Henry to find a Thunderstone — a meteorite fragment believed to be a powerful protective charm — for personal reasons. The last known holder is Thomlin Bruthans in Horschan to the west. Thomlin hosts fistfights and wagers the stone; Henry must fight him (500g wager, Hard speech checks to arrange it, or leverage from Fight Dirty task). After winning, Thomlin admits he no longer has it — it was stolen by Peter and Hensel of Raborsch. Head to Raborsch; Peter says Hensel was captured by Andrew's bandit camp northeast of Raborsch. Rescue Hensel (pay 1000g, pass Intimidation check, or fight). Hensel reveals he and Peter sold the stone to Mlada in Suchdol. Find Mlada in the southernmost house in Suchdol — she bought it to help her ailing husband (unlocks task Primum Nil Nocere). After resolving her husband's illness via Primum Nil Nocere, Mlada returns the stone. Final choice: give to Kona (100g + Alchemy XP + Grund horse trader discount, unlocks Primum Nil Nocere), return to Thomlin (150g OR Unarmed XP), or keep it as an inventory item.",
 tip:"Long quest that crosses most of the Kuttenberg map. Bring Strong Quickfinger potions in case you need to fight at the bandit camp. If you've done Fight Dirty you can get Thomlin to fight without speech checks. Killing Thomlin lets you loot a 'fake thunderstone' from him — you can give this fake to Kona to deceive her (but lose rep). Hensel can also point you to a hidden stash at the Two Dead Trees site (357g). Give to Kona for the Primum Nil Nocere follow-up task. Return to Thomlin for 150g OR Unarmed XP — not both.",status:0,notes:""},
{id:"sq36",r:"Kuttenberg",tp:"Side Quest",o:19,name:"The Magic Arrow",m:false,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Requires completing t20 Arrow-head first. Quest giver: Pasha at the Devil's Den tavern (sit at his table and offer to listen). Pasha and bandit Hare explain their dead leader Karel is buried with a legendary magic arrow in his skull — they want it retrieved. Gravedigger Lenek (north of Sedletz Monastery) reveals Karel was buried as a sorcerer behind the big willow north of the cemetery. Dig up the grave (shovel near the tree if needed), remove the arrow (crushing the skull is most reliable), and return to Devil's Den. Pasha is gone — Hare leads Henry to the forest camp. On the way, Hare stops and asks for the arrow: he fears it will drive Pasha to suicidal raids. Choices: (A) Give arrow to Hare — Pasha loses power; Hare becomes leader; camp disbands. (B) Give arrow to Pasha — he keeps leading raids (eventually leads to Something Rotten). (C) Refuse both (persuasion/strength check) — Henry keeps the Magic Arrowhead as a unique item.",
 tip:"⚠️ Highly time-sensitive — must complete Arrow-head (t20) very soon after MQ14, then this follows naturally. Give arrow to Pasha (B) to unlock the Something Rotten → Something Rotten full questline via Innkeeper Grosch. Pass Lenek's easy Speech check by agreeing Karel was a sorcerer — avoids reputation loss.",status:0,notes:""},
{id:"sq37",r:"Kuttenberg",tp:"Side Quest",o:20,name:"The Heirloom",m:false,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Svatava Mikush at the Huntsman's Lodge west of Bylany (day only; follow the road west from Bylany into the forest). Her husband Tailor Mikush fled the burning of Mesoles and never returned from Bylany. Talk to daughter Vendula (Speech check) — Mikush got into a dice dispute. In Bylany tavern, find dice player Chernik, who points to Drat at a farm north of the tavern. Drat (persuade or fight) reveals Mikush was taken by bandits west of Bylany. Track blood trail from Mikush's hat to a bandit camp; fight or stealth to rescue him. Mikush reveals the family inheritance (up to ~700g) is buried near Mesoles — dig it up. Outcomes: (A) Return all inheritance to Svatava — 60g reward + Survival and Strength XP; (B) Return only the family keepsake — keep the coin; (C) Lie — say you found nothing; keep everything.",
 tip:"Best outcome (A) gives all XP rewards plus 60g. Talk to Vendula before going to the tavern — the Speech check skips a step. Bring a spade; the treasure is buried and there's no shovel nearby at the dig site. The camp has 2 bandits — stealth kill the armoured one first from behind.",status:0,notes:""},
{id:"sq38",r:"Kuttenberg",tp:"Side Quest",o:21,name:"Ransom",m:false,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Triggered by a random encounter near Danemark (southeast Kuttenberg) — fast-travel from Kuttenberg toward Danemark to trigger it. Jan of Suchotlesky is fighting Cumans; help him and he explains his brother Peter has been taken prisoner by mercenary Laszlo Farkas at Sigismund's Camp. Visit the camp to investigate: speak to Camp Chaplain Father Bohumil (large white tent near Field Chapel), Musa the Healer (Field Infirmary), and a third contact for Scholarship XP. Confirm Peter's fate, then find Laszlo. Optional: recruit reinforcements — Goliath and Hog (from Teeth in the Bag), Kubyenka and Adder (Devil's Den), Menhard's swordsman Arne, or Benesh and his mercenaries from Mesoles. At the handover, choose to stay with Jan or side with Laszlo. Reward: 125g + Peter's sword if you sided with Jan; Peter's armour if you sided with Laszlo.",
 tip:"⚠️ Do NOT let Goliath die here — The Spark is permanently locked if he does. Recruit all 4 groups for the best outcome and intimidation dialogue. Complete The Devil's Pack first to have the most allies available. If you miss the road encounter, Jan can be found in a nearby inn.",status:0,notes:""},
{id:"sq39",r:"Kuttenberg",tp:"Side Quest",o:22,name:"Post Scriptum",m:false,hm:false,t:false,b:true,l:false,req:"MQ17 — Via Argentum",
 desc:"Requires MQ16: Into the Underworld. Quest giver: Kvyertsolav at a roadside tavern west of Kuttenberg (usually at the farthest outdoor table). He asks Henry to help compose a letter. Go to the designated house in Kuttenberg (the same location used in Into the Underworld). After writing the letter, the associates decide to kill Henry to keep him quiet. Escape via Persuasion or Intimidation check. Three paths: (A) Escape then side with the miners — meet at Hloushetz Gate, defeat Markold of Lourny together. Best reward: 150g. (B) Escape then turn the miners over to the bailiff — quick resolution, 100g. (C) Work with Markold against the miners — attack the miners' camp, 60g from Markold.",
 tip:"Path (A) gives the best reward. Select 'Justice is worth more than silver' when composing the letter. Kvyertsolav is at the outdoor tables of the tavern west of Kuttenberg — don't approach via the innkeeper.",status:0,notes:""},
{id:"sq40",r:"Kuttenberg",tp:"Side Quest",o:23,name:"The Fifth Commandment",m:true,hm:false,t:false,b:true,l:false,req:"MQ16 — Into the Underworld",
 desc:"Quest giver: Katherine at the Hangman's Halter Tavern in Kuttenberg after completing MQ16 Into the Underworld (must speak to her while she is still in Kuttenberg — she leaves after Taking French Leave). Katherine's contacts are being murdered. Investigate: go to the cemetery (northwest Kuttenberg), inspect the body of girl Alice in the small church, speak to Maid Barbora. Track down drunk witness Lumir near the Hole in the Wall (sober him with Hair o' the Dog potion). Ask Father Prokop about Jarka. Interrogate alehouse maid Stanya — hard Speech check or fistfight. She points to a fence near Bylany mills. Follow the trail to von Grolle's house: gain entry via Servant Thaddeus (Speech check, or fight his son Hendl if Ars Dimicatoria is done). Find bloodstained key on the second floor. Expose serial killer Hendl von Grolle — Katherine poses as bait; Thaddeus attacks Henry in Katherine's room; defeat him; force confession or kill him. Final choice: let Katherine kill Mandelina von Grolle (romance reward — Katherine becomes romanceable) or turn her over to the law. Reward: 150g + Kuttenberg Knight Shield.",
 tip:"⚠️ MISSABLE — Katherine leaves Kuttenberg after Taking French Leave (MQ18). Start this immediately after MQ16. Complete Ars Dimicatoria first to unlock the Hendl fight entry option (avoids skill checks at the door). Required for Katherine romance. Hair o' the Dog potion can be bought from the apothecary near the City Bathhouse.",status:0,notes:""},

// ── KUTTENBERG TASKS (36) ────────────────────────
{id:"t20",r:"Kuttenberg",tp:"Task",o:1,name:"Arrow-head",m:true,hm:true,t:true,b:false,l:false,
 desc:"On a wilderness road near Kuttenberg, Henry encounters Karel Arrowhead — a man with a crossbow bolt lodged in his skull who is miraculously still alive and in good spirits. He explains the bolt has been there for years and he's learned to live with it. He asks Henry to help him find a barber-surgeon willing to attempt removal. The task is as absurd as it sounds — most surgeons refuse, but the eccentric barber-surgeon in Suchdol will consider it.",
 tip:"🔴 HIGHLY MISSABLE + TIME SENSITIVE: Karel's location on the road is a scripted one-time encounter that disappears once you pass through the area during a specific main quest window. Once he's gone, he's gone. Also: Karel is a walking Skyrim 'arrow to the knee' reference — the moment is worth stopping for even if you rush the task.",status:0,notes:""},
{id:"t21",r:"Kuttenberg",tp:"Task",o:2,name:"Popinjay Shoot",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"A traditional archery competition held regularly in Kuttenberg City. A wooden 'popinjay' (parrot) is mounted on a tall pole and competitors shoot it down in layers. Good coin reward for consistent wins.",
 tip:"Archery skill 12+ makes this comfortable. The parrot is stationary — no wind adjustment needed. A good repeatable source of Groschen if your bow game is solid.",status:0,notes:""},
{id:"t22",r:"Kuttenberg",tp:"Task",o:3,name:"The Thieves' Code",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Feast for the Poor)",
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Chenyek at The Hole in the Wall. Investigate chalk symbols on Kuttenberg buildings — thieves' cant used by the Guild. Find the parchment with drawings via the fountain riddle on Vintners' Street (go at noon, watch the shadow direction). Earn 100g from Chenyek and optionally 150g from Knuckles for showing them the parchment. Leads to Beyond the Grave.",
 tip:"Show Knuckles the parchment first for 150g, then Chenyek for 100g — you keep the same parchment. Must be at the fountain around noon to see the shadow. See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t23",r:"Kuttenberg",tp:"Task",o:4,name:"Beyond the Grave",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Thieves' Code)",
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Rat at The Hole in the Wall. Rat needs a seal from the tomb of mine owner Hanuman Rot in the Sedletz Monastery ossuary crypt. Find the tomb via the trap door in the ossuary chapel — it's behind a suspicious brick wall to the south. The seal has already been taken by Gravedigger Lenek; his house is north of the monastery. Pickpocket him during the day or lockpick his house at night to retrieve it. Return to Rat. Reward: 225g + Agility XP.",
 tip:"Combines efficiently with Thou art but dust… — same crypt, same visit. Pickpocketing Lenek is easier than his Very Hard door lock. See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t24",r:"Kuttenberg",tp:"Task",o:5,name:"The German's Treasure",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Beyond the Grave)",
 desc:"Part of the thieves' guild questline (see ⚖️ The Guild tab). Quest giver: Rat at The Hole in the Wall (after Beyond the Grave). Steal three items from the basement of the All Saints Tavern (south-centre Kuttenberg): an Old Rusty Sword, Bloodied Wedding Dress, and Old Painted Statuette. Best accessed via the Kuttenberg Underground (enter via crumbling building southwest of the city — keep right at crossroads, find the Wasteyard, climb the ladder to the tavern basement). Take the items to Innkeeper Helga at a tavern west of Kuttenberg; give the password 'big-eyed monkey.' Pass a Speech check to convince her and haggle for the price. Reward: up to 295g.",
 tip:"The underground tunnel route bypasses all guards entirely — recommended. Night entry through the tavern itself also works. Password for Helga is said as 'I'll have a big-eyed monkey.' See ⚖️ The Guild tab for full questline details.",status:0,notes:""},
{id:"t25",r:"Kuttenberg",tp:"Task",o:6,name:"Teeth in the Bag",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Innkeeper Mole at The Hole in the Wall tavern in Kuttenberg (Hoprink district). Ask about the fights and pay 50 Groschen entry fee. Three consecutive bare-knuckle bouts in the barn: (1) Beggar Damian — easy warm-up fight, 10g bet. (2) Drunkard Zavish — must give him two beers first (buy from Mole) before he'll agree to fight, 10g bet. (3) Goliath — the toughest of the three, 10g bet. After winning all three, collect winnings from each fighter then return to Mole. Reward: 65 Groschen + Molar Die, Premolar Die, Wisdom Tooth Die, and Hugo's Die (unique dice) + Unarmed XP. Leads to More Teeth in a Bag (rematch activity), then eventually to Nail in the Coffin.",
 tip:"High Unarmed skill helps. Goliath (the big fighter) is also recruitable for the Ransom quest — defeat him here first. Questline: Teeth in the Bag → More Teeth in a Bag → Enough! → Fight Dirty → Nail in the Coffin.",status:0,notes:""},
{id:"t26",r:"Kuttenberg",tp:"Task",o:7,name:"More Teeth in a Bag",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Teeth in the Bag)",
 desc:"Repeatable rematch activity unlocked after completing Teeth in the Bag. Quest giver: Goliath, Beggar Damian, or Drunkard Zavish at The Hole in the Wall. Speak to any of them and ask for another fight — each will agree to a 10 Groschen bet rematch. They are no stronger than in Teeth in the Bag. Reward: 20 Groschen (10g winnings per fight) + Unarmed XP. Can be repeated every few in-game days per fighter.",
 tip:"Repeatable for Unarmed XP and coin. Part of the questline: Teeth in the Bag → More Teeth in a Bag → Enough! → Fight Dirty → Nail in the Coffin.",status:0,notes:""},
{id:"t27",r:"Kuttenberg",tp:"Task",o:8,name:"High Toll",m:false,hm:false,t:false,b:true,l:false,req:"MQ24 — Oratores",
 desc:"A toll blockade on the road near Kuttenberg is causing problems for travellers. Soldiers are charging inflated rates. To resolve the dispute, Henry must obtain a writ from the soldiers' commanding officer. Note: the blockade camp only appears after starting the 'Return to Ruthard Palace' objective in Oratores (MQ). If the camp location looks empty, continue the main quest first. Speak to the soldiers' commander at the camp and either negotiate, find documentation proving the toll is illegal, or pay off the soldiers.",
 tip:"Gated by Oratores progress — if the camp is empty, progress the main quest first. The commander's writ resolves the blockade. Straightforward once the camp appears.",status:0,notes:""},
{id:"t28",r:"Kuttenberg",tp:"Task",o:9,name:"Warding Off Evil",m:false,hm:false,t:false,b:false,l:false,
 desc:"An elderly woman in Miskowitz is convinced her neighbour is a witch whose curse has been souring her milk, wilting her garden, and making her chickens stop laying. She asks Henry to perform a ward — or expose the so-called witch. Investigation reveals the neighbour is not a witch at all, but has been using herbs from her garden that are leaching into the shared well. Henry can explain the truth or perform a theatrical 'warding ritual' to satisfy the old woman without embarrassing anyone.",
 tip:"The theatrical ritual (lie charitably) is actually the funniest and most satisfying option — Henry hams it up, the old woman is delighted, and the neighbour is quietly grateful. No Speech check required for either resolution.",status:0,notes:""},
{id:"t29",r:"Kuttenberg",tp:"Task",o:10,name:"Under the Straw Hat",m:true,hm:true,t:false,b:false,l:false,req:"MQ16 — Into the Underworld (via Adam)",
 desc:"During 'Into the Underworld', bathhouse owner Adam tips Henry that the monks of Sedletz Monastery are hiring day labourers for their gardens and harvest. Henry can get hired by speaking to the Monastery's lay brother at the Kuttenberg market and passing a simple interview. Working at the monastery gives disguised access to its restricted garden areas — critical for In Vino Veritas's monastery infiltration objective and for exploring Sedletz before Dancing with the Devil locks monastery relations.",
 tip:"🔴 HIGHLY MISSABLE: Only triggered during 'Into the Underworld' via Adam at the bathhouse. Once you advance past this quest window, the hiring opportunity closes permanently. Completing it makes In Vino Veritas's monastery objective trivially easy and gives early access to Sedletz loot.",status:0,notes:""},
{id:"t30",r:"Kuttenberg",tp:"Task",o:11,name:"Mark of the Brotherhood",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Ars Dimicatoria)",
 desc:"Unlocked by completing Ars Dimicatoria and the Kuttenberg Tournament. Quest giver: Menhard van Frankfurt at the Swordfighting Guild (southwest Kuttenberg, near the Black Horse Tavern) — ask 'What are you planning next?'. Menhard needs the ceremonial Guild Longsword recovered: ex-member Emmeram took it after losing the tournament in humiliation. Find Emmeram at his butcher shop north of Kuttenberg Town Hall. He confesses he threw the sword in the rubbish heap on the south side of the city. Dig up three marked spots in the trash heap — wild dogs roam here. Return the broken sword fragments to Menhard, who asks Henry to reforge it using the Guild Longsword recipe (iron ingot ×2 + handle + pommel + grip — buy from any Kuttenberg blacksmith). Forge to at least Silver quality. Return repaired sword to Menhard. Reward: 60g + Guild Longsword recipe unlocked permanently.",
 tip:"Bring a shovel to the rubbish heap — only the three marked dig spots matter. Emmeram can be optional-fought before or after handing over the sword (fistfight only). Reforging requires access to a forge; the nearest is the blacksmith in Kuttenberg's weapons district. Aim for Gold quality for maximum prestige.",status:0,notes:""},
{id:"t31",r:"Kuttenberg",tp:"Task",o:12,name:"Last Will",m:false,hm:false,t:false,b:true,l:false,
 desc:"Requires Ars Dimicatoria completed. Quest giver: Menhard at the Kuttenberg Swordfighting Guild (ask if he has work). He directs Henry to Widow Gerda nearby — her late husband left debts, and his rival Radmil is claiming what she owes through a duel. Henry fights as her champion. First speak to Radmil at the Cobbler Shops (centre of Kuttenberg): he suggests throwing the fight so he can use the prize money to open his shop. Options: (A) Agree to throw the fight — Radmil wins, Gerda loses the duel; Radmil pays you 125g (175g with a Presence speech check). (B) Agree to throw the fight, then win anyway — break the deal and defeat Radmil; Gerda pays 250g. (C) Refuse to throw the fight — go straight to the duel and defeat Radmil honestly; Gerda pays 250g. Radmil is not a skilled fighter regardless of path. Reward: 250g from Gerda (win) or 125–175g from Radmil (lose).",
 tip:"Winning for Gerda is the better reward (250g vs 125g). Radmil is an easy opponent — any weapon works. To maximise coin: agree to throw it, then defeat him anyway and collect from Gerda. Part of the Ars Dimicatoria questline: Ars Dimicatoria → Kuttenberg Tournament → Mark of the Brotherhood → Last Will.",status:0,notes:""},


{id:"t34",r:"Kuttenberg",tp:"Task",o:15,name:"The Collector",m:true,hm:false,t:false,b:false,l:false,req:"MQ15 — The Devil's Pack",
 desc:"An eccentric collector in Miskowitz — a retired merchant named Václav Zbrojník — is searching for a specific illuminated manuscript page that was torn from a rare book years ago. The page is in the possession of a monastery scribe who doesn't know its value. Henry must acquire it either by trade, theft, or by convincing the scribe of its true owner.",
 tip:"⚠️ Must complete before the end of Oratores. The scribe is at Sedletz — visiting him while working there (Under the Straw Hat) makes acquisition easiest. The collector's reward includes a unique decorative item that counts toward the Notable Loot tab.",status:0,notes:""},
{id:"t35",r:"Kuttenberg",tp:"Task",o:16,name:"Enough!",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Teeth in the Bag + More Teeth in a Bag)",
 desc:"Part of the brawler questline: Teeth in the Bag → More Teeth in a Bag → Enough! → Fight Dirty → Nail in the Coffin. After completing More Teeth in a Bag (the rematch activity), the next fight in the chain becomes available. Speak to Innkeeper Mole at The Hole in the Wall to advance the questline.",
 tip:"Completing Enough!, Fight Dirty, and Teeth in the Bag all together automatically triggers Nail in the Coffin — the final brawler fight against gravedigger Frantishek in the Kuttenberg cemetery at night. Don't advance this chain before finishing Teeth in the Bag.",status:0,notes:""},
{id:"t36",r:"Kuttenberg",tp:"Task",o:17,name:"Fight Dirty",m:false,hm:false,t:false,b:false,l:false,act:"rep",
 desc:"Underground bare-knuckle fighting in Hroschan, run by a tout named Brůha near the tavern. Less structured than the Brawler questline — no ceremony, smaller crowds, and opponents who genuinely fight dirty (expect grabs, headbutts, and low blows). Better coin per fight than the mill brawls but the opponents are less predictable.",
 tip:"Repeatable for coin. Grappling skill is far more important here than in the official brawler circuit — opponents grab constantly. Keep your Stamina up and don't let them get you into a clinch.",status:0,notes:""},
{id:"t37",r:"Kuttenberg",tp:"Task",o:18,name:"A Moment of Fame",m:false,hm:false,t:false,b:false,l:false,
 desc:"Task in Hroschan. Speak to NPCs in Hroschan to trigger this activity, which ties into the local character interactions there.",
 tip:"Part of the Hroschan local quest activity cluster. Pick up other Hroschan-area tasks (Fight Dirty) at the same time.",status:0,notes:""},
{id:"t38",r:"Kuttenberg",tp:"Task",o:19,name:"X Marks the Spot",m:false,hm:false,t:false,b:false,l:false,
 desc:"A treasure map task in the Kuttenberg region. Find a hand-drawn map showing a marked location — decode the landmarks to find a buried cache. Bring a spade to dig up the treasure.",
 tip:"Bring a spade before setting out — you cannot dig without one. The landmarks on the map correspond to real recognisable features on the Kuttenberg map.",status:0,notes:""},
{id:"t39",r:"Kuttenberg",tp:"Task",o:20,name:"Tragedy in Danemark",m:true,hm:true,t:false,b:false,l:false,
 desc:"During the 'Follow the clues' step of Yackers 'n' Fash, Henry arrives at Danemark Mill to find it occupied by bandits who have slaughtered the hired hands and taken miller Hermann's family captive. Finding and untying Hermann in the northernmost building triggers this task. Kill all the bandits, then return to Hermann for a reward.",
 tip:"🔴 HIGHLY MISSABLE: Only triggers during the 'Follow the clues' objective of Yackers 'n' Fash. If you clear the mill without first finding the tied-up family, the task never starts. Be careful approaching the barn — if any bandit sees you enter, they may attack the family. Part of the questline: Yackers 'n' Fash → Tragedy in Danemark → Striped Tonies → Popinjay Shoot.",status:0,notes:""},
{id:"t40",r:"Kuttenberg",tp:"Task",o:21,name:"Hammer and Tongs",m:false,hm:false,t:false,b:false,l:false,
 desc:"A blacksmithing task available in Kuttenberg. Speak to a blacksmith in Grund to pick it up.",
 tip:"Related to the crafting system. Having Craftsmanship levelled makes this easier.",status:0,notes:""},
{id:"t41",r:"Kuttenberg",tp:"Task",o:22,name:"The White Roebuck",m:false,hm:false,t:false,b:false,l:false,
 desc:"A hunting task in the Kuttenberg region involving a legendary white deer. Speak to hunters or the gamekeeper near Suchdol to begin.",
 tip:"Hunting skill and stealth help. Approach carefully on foot to avoid spooking the animal.",status:0,notes:""},
{id:"t42",r:"Kuttenberg",tp:"Task",o:23,name:"Primum Nil Nocere",m:false,hm:false,t:false,b:true,l:false,
 desc:"A follow-up task unlocked by giving the Thunderstone to Kona (quest giver of The Thunderstone) in Grund. A sick man in Suchdol needs medical help — Mlada's husband, who has been ill. Henry must help diagnose and treat him with the barber-surgeon in Suchdol. The course of treatment determines the outcome.",
 tip:"Unlocked by giving the Thunderstone to Kona at the end of The Thunderstone side quest. If you kept the stone or gave it to Thomlin, this task does not open.",status:0,notes:""},
{id:"t43",r:"Kuttenberg",tp:"Task",o:24,name:"The Reliquary",m:false,hm:false,t:false,b:false,l:false,
 desc:"A monk from Sedletz Monastery reports that a silver reliquary — a saint's finger bone in a jewelled case — has been stolen during a robbery on the road from Kuttenberg. He believes it was taken by a bandit group camped in the hills north of Suchdol. Henry must infiltrate or assault the camp and retrieve the reliquary. The bandit leader has it as a personal trophy and won't surrender it willingly.",
 tip:"The camp has 4–5 bandits. Stealth approach at night lets you pickpocket the reliquary from the sleeping leader without fighting anyone. Combat approach works but is significantly harder — the leader wears padded armour and fights with a mace. Return it to the monk for an Honour bonus and a blessed item reward.",status:0,notes:""},
{id:"t44",r:"Kuttenberg",tp:"Task",o:25,name:"The Stalker",m:true,hm:true,t:false,b:false,l:false,req:"MQ22 — The Lion's Den",
 desc:"Only available during Main Quest 22: The Lion's Den. After searching the spot where Chertan was stabbed, Henry goes to the infirmary tent and finds Chertan has died. During the conversation with Grozav, Ditrich, and Musa, Henry must say 'A girl from the baths will help' — this triggers the optional objective to ask Katherine for help with the guard. Katherine is at the camp baths and agrees to help in exchange for Henry dealing with a soldier named Chakan who has been stalking and peeping on her at night. Find out who's stalking her, then confront Chakan to ensure he leaves her in peace.",
 tip:"🔴 HIGHLY MISSABLE: Must say 'A girl from the baths will help' during The Lion's Den infirmary dialogue. If you pick another option, the task never opens. Katherine is only at the camp baths during this quest window. Reward: reputation gained with Katherine.",status:0,notes:""},
{id:"t45",r:"Kuttenberg",tp:"Task",o:26,name:"Absolver",m:false,hm:false,t:false,b:false,l:false,
 desc:"A task at Sigismund's Camp involving a guilt-ridden soldier. Speak to soldiers at the camp to find this optional task.",
 tip:"Directing the soldier to the camp chaplain is the clean resolution.",status:0,notes:""},
{id:"t46",r:"Kuttenberg",tp:"Task",o:27,name:"Nail in the Coffin",m:false,hm:false,t:false,b:false,l:false,
 desc:"Automatically triggered upon completing the three tasks Enough!, Fight Dirty, and Teeth in the Bag. Henry hears that the strongest unarmed fighter around can be found at the cemetery in Kuttenberg — the gravedigger Frantishek. Search for him, then challenge him to a fight at night in the graveyard. Defeating grandmaster Frantishek earns the Shoulder Throw combo and Unarmed XP.",
 tip:"Complete Enough!, Fight Dirty, and Teeth in the Bag to trigger this automatically. The fight is at night — wait at the cemetery after sundown. Frantishek is the toughest unarmed opponent in the Kuttenberg questline; high Unarmed skill and the Clinch technique help significantly.",status:0,notes:""},
{id:"t47",r:"Kuttenberg",tp:"Task",o:28,name:"Skeleton in the Closet",m:false,hm:false,t:false,b:false,l:false,
 desc:"Follow-up to Bellatores. Quest giver: Jan Posy of Zimburg at the Ruins of Zimburg (south of Bylany). After completing Bellatores, wait 3–5 in-game days, then return to the ruins — Jan has located the Cuman camp that stole his chest. He asks Henry to help raid it with himself and brother Miroslav 'Tugbone'. Fast-travel triggers to the camp outskirts. Speak to Jan about the plan: charge in together or let Henry go alone for stealth. Fight or sneak through the camp, loot the Zimburg Reliquary from the chest inside the red tent (Easy lockpick), then return the chest to Jan. Reward: 150 Groschen. Hidden bonus: after completing, Jan Posy will offer to train Henry in Polearms, Swordsmanship, and Heavy Weapons to Master Grade, and teach the False Edge (Tier IV) combo.",
 tip:"⚠️ If you complete Skeleton in the Closet before Ransom, the Zimburg brothers can no longer be recruited for that quest. Stealth with poison, ranged, and dirty tactics is strongly recommended — the camp is large. Leave the area for 5 days after Bellatores to trigger the quest icon; waiting near the ruins doesn't count.",status:0,notes:""},
{id:"t48",r:"Kuttenberg",tp:"Task",o:29,name:"Like Old Times",m:true,hm:true,t:false,b:false,l:false,req:"MQ22 — The Lion's Den",
 desc:"🔴 HIGHLY MISSABLE — only available during Main Quest 22: The Lion's Den. Quest giver: Sir Hans Capon at the Devil's Den tavern. After the meeting between Henry and Hans, talk to Hans and choose: 'Thank you, it was rough' → 'It reminded me of Skalitz' → 'No need to thank me' (receive Hunting Bow) → 'Duty calls' → 'A just reward!' → 'That's a good idea' → 'Let's go!' This starts the task. Follow Hans on horseback to an old hunting camp west of Sigismund's Camp. Hans says 'Can you hear that? There are people in the camp!' — the camp is now occupied by Sigismund's soldiers. Three options: negotiate (hard Speech checks), stealth (Henry alone, get spotted and it switches to fight), or charge in with Hans. Kill all soldiers, then speak to Hans. No monetary reward — reward is the Hunting Bow from Hans and the interaction itself. Fast-travel back to Devil's Den available after.",
 tip:"🔴 If you progress The Lion's Den without talking to Hans at the start, this task closes permanently. Talk to him immediately on entering the tavern before doing anything else. Hans will join the fight regardless of approach if combat starts.",status:0,notes:""},
{id:"t49",r:"Kuttenberg",tp:"Task",o:30,name:"Civic Duty",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Feast for the Poor)",
 desc:"Part of the thieves' guild questline — see ⚖️ The Guild tab. ⚠️ MUTUALLY EXCLUSIVE WITH THE SPARK. After starting Feast for the Poor, visit Bailiff Andreas Plumel in Kuttenberg town hall (upstairs, daytime) to report the Guild's activities. Earn 30g per piece of information. To fully complete: play through The Spark until you have the black powder keg, deliver it to the campfire, then abandon the plan (or throw it in the fire for the Remember, Remember… trophy). Return to Plumel for 150g final reward. Completing this cancels The Spark permanently.",
 tip:"⚠️ Completing Civic Duty locks out The Spark. If you want The Spark (more content, better trophy options), do NOT complete Civic Duty. See ⚖️ The Guild tab for full details.",status:0,notes:""},
{id:"t50",r:"Kuttenberg",tp:"Task",o:31,name:"Damsel in Distress",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Baker Lapek in Bylany (marked with '!' at some point between MQ14 and MQ24) — or discovered by exploring. A mill between Bylany and Old Lhota has a woman crying for help from inside a locked shed. Unlock the door (keys are on a table inside the mill, or lockpick), and she tells you her miller husband locked her up and went to fetch an axe. Go to the woodshed out back to find him — but he's not there. Return to find the miller and a guard confused: the woman has vanished. The twist: she was not a 'damsel in distress' at all — she had stolen from her husband and staged her distress to cover the theft. Henry is left empty-handed unless he pays 500g for the stolen goods (reputation boost + Speech XP) or talks his way out. No further reward otherwise.",
 tip:"A fun quest with a classic bait-and-switch twist. Paying 500g is the 'good' option for reputation. The shed key is on the table inside the mill building — grab it to skip the lockpick. Accessible as soon as Baker Lapek in Bylany shows the '!' icon on the map.",status:0,notes:""},
{id:"t51",r:"Kuttenberg",tp:"Task",o:32,name:"The Peasants' Revolt",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Quest giver: Kubyenka at the Devil's Den (usually on the second-floor balcony). Ask him 'About the rebellious peasants…' and say you should help them. He gives you the password 'The fox is in the henhouse' and directs you to Herbwoman Vlasta southwest of Miskowitz. Tell her the password; she gives Henry supplies to deliver to the rebel camp. Go west into the forest and find the camp — it has been massacred. The sole survivor is a wounded young man named Otter. Pass a medium Survival check to treat his wounds, then fight off a wolf pack. Otter admits the revolt is finished; as thanks he reveals the location of his hidden coin stash (Otter's Treasure — ~850 Groschen in a jug at a nearby cliff). Report back to Vlasta to close the quest. Reward: Strong potions (Aqua Vitalis, Marigold Decoction, Painkillers × 2 each).",
 tip:"Do not use weapon kills on wolves if attempting the Lent achievement — use kicks only. Otter's Treasure is a separate optional step after closing the quest with Vlasta. The coin stash is in a jug at the base of the cliff face Otter marks on your map.",status:0,notes:""},
{id:"t52",r:"Kuttenberg",tp:"Task",o:33,name:"Something rotten…",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Part of the questline: Arrowhead → The Magic Arrow → Something Rotten. Quest giver: Innkeeper Grosch at the Grund tavern (ask 'How goes it?' → 'What's going on?' → offer to help). Grosch has been terrorised by a gang of bandits led by a man called Eggman, who trashes his inn. Grosch gives Henry a Strong Bane poison and directions: the camp is northwest of Grund in a small woods (same camp from The Magic Arrow). Two approaches: (A) Poison — sneak in at night and dose the cooking pot with the Bane; wait for them to eat. (B) Fight — six or seven well-armed bandits; they surround you and attack from all directions. Either way, kill Eggman and take his distinctive hat as proof. Return the hat to Grosch. Optional: pass a medium Scholarship check to request a mass for the pilgrim the hat once belonged to (the man was forced to walk until he died of exhaustion) — earns reputation. Reward: 150 Groschen. Grosch will subsequently wear the hat.",
 tip:"The Bane poison goes in the cooking pot, not on your weapon. Night entry is essential for the poison route — patrols are frequent. If you completed Arrowhead, Henry notes the camp must have been Karel's. Scholarship check for the mass is optional but earns rep with no downside.",status:0,notes:""},
{id:"t53",r:"Kuttenberg",tp:"Task",o:34,name:"Seeking Justice",m:true,hm:false,t:false,b:true,l:false,req:"MQ14 — Speak of the Devil (after All's Fair)",
 desc:"Follow-up to All's Fair. 🔴 MISSABLE: Only available if you gave Pavel the stolen items (not money) at the end of All's Fair — any other choice locks this out. Wait a few days, then speak to Captain Frenzl in Suchdol. He's investigating a runaway farmhand from Wysoka named Pavel who's been fencing stolen goods. Frenzl suspects Pavel is in Kuttenberg. Track him: ask any merchant where to sell stolen goods → directed to The Hole in the Wall → speak to Innkeeper Mole (bribe or persuade) → he confirms Pavel sold items → follow the trail to the town hall scribe → Linhart the cobbler's workshop in north Kuttenberg. Pavel is in the back room. Confront him and decide: (A) Turn him in to Frenzl — 100 Groschen reward; Pavel faces punishment. (B) Lie to Frenzl that Pavel went to Prague — 60 Groschen; Pavel escapes. (C) Accept money from Pavel — reward varies.",
 tip:"⚠️ You MUST give Pavel the items (not pay him) during All's Fair to unlock this. The cobbler shop you want is the northern one of the two in Kuttenberg. Turning Pavel in earns more coin; lying to Frenzl is the merciful option.",status:0,notes:""},
{id:"t54",r:"Kuttenberg",tp:"Task",o:35,name:"Attila",m:true,hm:false,t:false,b:false,l:false,req:"MQ23 — Dancing with the Devil (refuse to burn Maleshov)",
 desc:"In Maleshov (only accessible if it was not burned during Dancing with the Devil), a child named Tomík has named his cat 'Attila' and the cat has gotten itself stuck high in the rafters of the mill and refuses to come down. Henry must coax it down using food — Tomík suggests dried fish — or find another way. The cat, true to its name, is belligerent and will swipe at Henry if he gets too close without the right approach.",
 tip:"⚠️ Only available if you refused to burn Maleshov in Dancing with the Devil. Bring dried fish or buy it from the Maleshov cook. Patience is the only skill needed. A short, light-hearted task that serves as a palate cleanser after the weight of the main quest's choices.",status:0,notes:""},
{id:"t55",r:"Kuttenberg",tp:"Task",o:36,name:"Victimised",m:false,hm:false,t:false,b:false,l:false,
 desc:"A task in Pschitoky involving a robbery and stolen goods. Speak to the quest giver in Pschitoky to investigate the theft and recover stolen property.",
 tip:"Investigation and dialogue are the primary tools for this task — gather evidence before confronting anyone.",status:0,notes:""},

// ── THE GUILD — KUTTENBERG THIEVES' GUILD QUESTLINE ──────────────
// Quest giver: Chenyek at The Hole in the Wall tavern (southeast Kuttenberg, Hoprink district)
// Starts during Main Quest 16: Into the Underworld (Chenyek is met while searching for Goatskin)
// Full chain: Feast for the Poor → (Civic Duty OR) The Thieves' Code → Beyond the Grave → The German's Treasure → The Spark
// ⚠️ CIVIC DUTY and THE SPARK are MUTUALLY EXCLUSIVE — reporting to bailiff cancels The Spark
{id:"guild1",r:"Guild",tp:"Side Quest",o:1,name:"Feast for the Poor",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil",
 desc:"Henry's introduction to the Kuttenberg Guild — a thieves' collective that styles itself as a Robin Hood-style people's movement against Sigismund. Quest giver: Chenyek at The Hole in the Wall tavern. Chenyek asks Henry to infiltrate Sigismund's supply warehouse south of the city walls, steal quality sausages from a locked chest (and optionally leave a cabbage in their place as a prank), then distribute the sausages to five beggars around Kuttenberg. Knuckles (outside the tavern) offers an optional side task to also steal a bottle of fine wine from the same warehouse, in exchange for lockpicks and potions. After feeding the beggars, return to Chenyek to complete the quest. Reward: 100 Groschen (if you give the wine to Knuckles). Completing this unlocks The Thieves' Code.",
 tip:"The warehouse is south of the city walls — wait until night and wear cloth armour for stealth, or just sprint in and out during the day (guards give up quickly). Buy at least one cabbage before going — leaving it in the chest is optional but keeps things clean. You can let both Chenyek and Knuckles copy the symbols in The Thieves' Code; they're not fully opposed yet. Starts after completing Main Quest 14: Speak of the Devil.",status:0,notes:""},
{id:"guild2",r:"Guild",tp:"Task",o:2,name:"The Thieves' Code",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Feast for the Poor)",
 desc:"Chenyek sends Henry to investigate the meaning of chalk symbols marked on buildings across Kuttenberg — a secret thieves' cant used by the Guild. First step: visit a house in the north of Kuttenberg where Chenyek sent Hog to see an old fence named Hynek. Henry finds Hynek dead in the kitchen (Hog is standing there looking guilty). Search the body to find Hynek's Letter, which contains a cryptic riddle: 'A vineyard in town? Strange, but who knows! And yet there it is, quite nearby. By the water that gushes, now listen and try to keep your eyes open — shortly after the midday bell, you'll find us where the shadow goes.' The answer: go to the fountain on Vintner's Street (west side of the city) at noon and watch the shadow — it points north to the trader's shop. Enter, go behind the counter, down to the basement, pick the Hard locked door (or use the Cellar Door Key from Hynek's house) and find a Parchment with Drawings in an Easy locked chest inside. Return to The Hole — you can let Knuckles copy the symbols (150g) and/or Chenyek copy them (100g + quest progression). You must show Chenyek to advance the questline.",
 tip:"The fountain on Vintner's Street is near the west city gate fast-travel point. You must be there around noon — skip time at the fountain to trigger it. The cellar door key is in Hynek's house safe if you want to skip the Hard lock. You can earn 150g from Knuckles AND 100g from Chenyek for the same parchment — show Knuckles first, then Chenyek. Reward: 100-250g depending on who you show. Next: Beyond the Grave.",status:0,notes:""},
{id:"guild3",r:"Guild",tp:"Task",o:3,name:"Beyond the Grave",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Thieves' Code)",
 desc:"After completing Feast for the Poor, speak to Rat at The Hole in the Wall and ask for work. Rat — a cleaning woman and fence for the Guild — needs a seal stolen from the grave of a dead mine owner named Hanuman Rot in the Sedletz Monastery ossuary northeast of Kuttenberg. Travel to Sedletz, enter the monastery chapel, and use the trap door in the floor to access the crypt. Go south through the arch and interact with a suspicious brick wall — it opens to reveal the tomb. The seal has already been taken by Gravedigger Lenek. Track him to his house north of the monastery: either pickpocket him during the day or lockpick his door at night and steal the seal while he sleeps. Return to Rat. Reward: 225 Groschen + Agility XP.",
 tip:"Running this alongside the Thou art but dust… side quest is efficient — Brother Morticius is in the graveyard and starts that quest, and you go into the same crypt. The Gravedigger Lenek's door is a Very Hard lock at night; pickpocketing during the day is easier if your Pickpocket skill is decent. Strong Quickfinger potions help with the lock. Leads to The German's Treasure.",status:0,notes:""},
{id:"guild4",r:"Guild",tp:"Task",o:4,name:"The German's Treasure",m:false,hm:false,t:false,b:false,l:false,req:"MQ14 — Speak of the Devil (after Beyond the Grave)",
 desc:"After Beyond the Grave, speak to Rat again and ask for more work. She sends Henry to steal valuables from the basement of the All Saints Tavern (near the large church, south-center of Kuttenberg), run by innkeeper Beikovetz — a Sigismund loyalist who made his money from banditry. The easiest route is through the Kuttenberg Underground: enter the network from a crumbling building on the southwest side of the city. Navigate the tunnels (keep right at the main crossroads, find the Wasteyard area, climb the ladder) to reach the tavern basement. Find and steal three items: an Old Rusty Sword, Bloodied Wedding Dress, and Old Painted Statuette. Then take the stolen items to Innkeeper Helga at a tavern west of Kuttenberg — give the password 'big-eyed monkey.' Pass a Speech check to convince her to take the items, then haggle for the price. Reward: up to 295 Groschen.",
 tip:"If you've already done Yackers 'n' Fash you'll have been in the All Saints Tavern basement before and may have a key. The underground tunnel route bypasses all guards and sleeping residents entirely — recommended. Night is still easiest if you go through the tavern itself. Password for Helga is 'I'll have a big-eyed monkey.' Leads to The Spark.",status:0,notes:""},
{id:"guild5",r:"Guild",tp:"Task",o:5,name:"Civic Duty",m:false,hm:false,t:true,b:false,l:true,
 desc:"⚠️ MUTUALLY EXCLUSIVE WITH THE SPARK. After starting Feast for the Poor, at any point you can visit Bailiff Andreas Plumel in Kuttenberg's town hall (upstairs, daytime) and report the Guild. He pays 30 Groschen per piece of information about Guild activities across Feast for the Poor, The Thieves' Code, Beyond the Grave, and The German's Treasure. To fully complete Civic Duty you must play through The Spark until you have the black powder keg, deliver it to the guildsmen at the campfire — then abandon the plan without destroying the mine (run away or throw the barrel into the campfire for the 'Remember, Remember…' trophy, which fails The Spark). Return to Plumel for the final 150 Groschen reward. Completing Civic Duty cancels The Spark permanently; completing The Spark cancels Civic Duty.",
 tip:"PowerPyx recommends doing The Spark (not Civic Duty) if you want maximum content and trophies. Civic Duty gives slightly better 'lawful' roleplay. To get the Remember, Remember… trophy while on The Spark path: save before going into the mine with Goliath, kill Goliath, walk to the campfire and throw the barrel in (instant game over + trophy), then reload and do the quest properly. You can earn 30g per report throughout the questline by keeping Plumel informed even if you ultimately do The Spark.",status:0,notes:""},
{id:"guild6",r:"Guild",tp:"Side Quest",o:6,name:"The Spark",m:true,hm:false,t:false,b:true,l:false,g:true,req:"Via Argentum + Thieves' Code (MQ17 + Guild questline)",
 desc:"⚠️ MUTUALLY EXCLUSIVE WITH CIVIC DUTY. ⚠️ MISSABLE: If you recruit Goliath for the Ransom quest and he dies there, Chenyek will say the plan makes no sense and The Spark is permanently locked. Triggered by a messenger intercepting Henry on the road after completing Via Argentum (Main Quest 17) and The Thieves' Code — wait 2-3 in-game days and fast-travel near Suchdol. Chenyek's Guild plans to sabotage the silver mine near Horschan (southwest of Grund) used by Sigismund. Henry must obtain a Black Powder Keg from a cart (Prokop Eldris has the key), then meet Goliath and the guildsmen at the campfire east of the mine road. Wait for nightfall, then follow Goliath into the mine, place the keg at the marked support beam (red cloth), light the fuse, and escape. Henry is knocked out by the blast; Goliath drags him clear. Guards then confront you — intimidate them or fight. Return to Chenyek at The Hole: if you stayed loyal to Chenyek, 150 Groschen; if you sided with Knuckles (who tried to sell Henry to the guards), 60 Groschen.",
 tip:"🔴 MISSABLE if Goliath dies in Ransom. For Remember, Remember… trophy: save at mine entrance, kill Goliath, return to campfire and throw barrel into fire (game over + trophy), reload. The exit route from the mine is: turn left at the wheelbarrow twice to get out quickly. Reward: 150g (Chenyek) or 60g (Knuckles). This quest closes the Guild storyline.",status:0,notes:""},

// ── DLC1 — BRUSHES WITH DEATH (10) ───────────────
{id:"dlc1_1",r:"DLC1",tp:"Main Quest",o:1,name:"A Sketchy Situation",m:false,hm:false,t:false,b:false,l:false,
 desc:"The Brushes with Death DLC begins. A purple quest icon appears over Apollonia in Trosky after completing For Whom the Bell Tolls. Henry is hired by a local lord to accompany a travelling painter named Vojtech (Voyta) through the Trosky region. Shortly after starting work with him, Henry discovers that people who sit for Voyta's portraits keep ending up dead.",
 tip:"Start the DLC by finding the purple quest marker near Apollonia in Trosky (available after For Whom the Bell Tolls). The DLC spans both Trosky and Kuttenberg. Voyta is the central character — how you treat him in dialogue matters for God Disposes.",status:0,notes:""},
{id:"dlc1_2",r:"DLC1",tp:"Main Quest",o:2,name:"Source of Inspiration",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry assists Voyta in finding and preparing willing portrait subjects across the Trosky region. The sittings gradually expose an unsettling pattern — the subjects share something in common, and their fates after being painted are increasingly grim.",
 tip:"Earns the Poet's Gut trophy. Pay close attention to what Voyta says during the sittings — his comments are clues about the conspiracy.",status:0,notes:""},
{id:"dlc1_3",r:"DLC1",tp:"Main Quest",o:3,name:"Chiaroscuro",m:false,hm:false,t:false,b:false,l:false,
 desc:"The investigation deepens as Henry follows the trail of evidence from Trosky into Kuttenberg. This is the quest where The Night-Mare (the next quest) takes place in Kuttenberg — completing Storm first is recommended before this DLC.",
 tip:"This is where the DLC transitions from Trosky to Kuttenberg. Make sure you've completed Storm (the end of Trosky's main quest) before this quest for full story context.",status:0,notes:""},
{id:"dlc1_4",r:"DLC1",tp:"Main Quest",o:4,name:"Portrait in Red",m:false,hm:false,t:false,b:false,l:false,
 desc:"A portrait with a red background is discovered — a signal of imminent death, according to the pattern Henry has uncovered. Henry must race to identify the next victim and prevent the killing.",
 tip:"Earns the Vengeance Solves Nothing trophy. Time-sensitive objectives begin here — be thorough but don't linger.",status:0,notes:""},
{id:"dlc1_5",r:"DLC1",tp:"Main Quest",o:5,name:"The Night-Mare",m:false,hm:false,t:false,b:false,l:false,
 desc:"The first quest to take place entirely in Kuttenberg. The conspiracy behind the painter's killings expands dramatically as Henry uncovers the true political scope of what Voyta has been doing — and who has been directing him.",
 tip:"Have your Kuttenberg fast-travel points unlocked before this quest. The events here tie directly back to the main Kuttenberg political storyline.",status:0,notes:""},
{id:"dlc1_6",r:"DLC1",tp:"Main Quest",o:6,name:"Man Proposes",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry confronts the architect of the conspiracy — the noble who has been using Voyta's paintings as a cover for targeted assassinations. The full scheme is revealed: what appeared to be an eccentric artist's curse is a calculated political operation.",
 tip:"Earns the Curiosity Killed the Cat trophy. Exhaust all dialogue before acting — it affects what's available in the final confrontation.",status:0,notes:""},
{id:"dlc1_7",r:"DLC1",tp:"Main Quest",o:7,name:"God Disposes",m:false,hm:false,t:false,b:true,l:false,
 desc:"The climactic confrontation with Voyta — Henry must decide what to do with everything he's discovered about the painter's past and complicity. Exhausting ALL of Voyta's dialogue about his history and motivations is essential. This is also where you choose whether to let Voyta finish his masterpiece or convince him to destroy it.",
 tip:"🏆 CONFESSOR TROPHY (Silver): Requires exhausting ALL dialogue about Voyta's past during this quest — every option, including the uncomfortable ones. Do not skip or rush any dialogue. Also: the choice to let Voyta finish his painting (vs. destroy it) determines whether you get the Painter's Skull item and Rest in One Piece trophy.",status:0,notes:""},
{id:"dlc1_8",r:"DLC1",tp:"Main Quest",o:8,name:"Stained Honour",m:false,hm:false,t:false,b:false,l:false,
 desc:"The immediate aftermath of the God Disposes confrontation. Henry deals with the consequences of what happened and reports back. The question of who bears responsibility for the killings — Voyta, his patron, or those who looked away — is left partially open.",
 tip:"Earns the Painted trophy. If you let Voyta finish his masterpiece in the previous quest, return to his grave afterward and dig up the Painter's Skull to complete the burial for the Rest in One Piece trophy.",status:0,notes:""},
{id:"dlc1_9",r:"DLC1",tp:"Main Quest",o:9,name:"Root of Evil",m:false,hm:false,t:false,b:false,l:false,
 desc:"The investigation wraps up as Henry traces the full chain of guilt — the noble patron, Voyta's original artistic talent, and how both were corrupted. Several loose threads are tied off.",
 tip:"Earns the Nothing But the Best trophy. Any unresolved optional objectives from earlier quests should be completed before finishing this one.",status:0,notes:""},
{id:"dlc1_10",r:"DLC1",tp:"Main Quest",o:10,name:"Unveiling",m:false,hm:false,t:false,b:true,l:false,
 desc:"The DLC's final quest and its culmination: Voyta's completed (or destroyed) masterpiece is exhibited. Henry attends the unveiling and confronts the last remaining threads of the conspiracy. The DLC's ending varies based on whether you allowed Voyta to finish his painting and whether his full confession was obtained in God Disposes.",
 tip:"🏆 REST IN ONE PIECE TROPHY: If Voyta finished his masterpiece in God Disposes, he gives you the Painter's Skull before his death — return it to his grave and dig it up. 🏆 MASTERPIECE TROPHY: Unlocked if you let Voyta complete the painting. 🏆 ALL FUN AND GAMES TROPHY: Awarded for completing the full DLC questline.",status:0,notes:""},

// ── DLC2 — LEGACY OF THE FORGE (7) ───────────────
{id:"dlc2_1",r:"DLC2",tp:"Main Quest",o:1,name:"Adept",m:false,hm:false,t:false,b:false,l:false,
 desc:"Henry discovers his adoptive father Martin's abandoned forge in east Kuttenberg near Caslavska Gate. Magdalena manages the property. He meets Magdalena, who manages the property. To use the forge Henry must join the Blacksmiths' Guild — pay 200g for the trial forging test at Master Bushek the Elder's guild hall (near the big clock tower). Pass it to gain entry. Then clean both floors of the forge (upper and lower — the Old Machine Sketch is hidden under the sweepings). Use the planning desk to put up the Old Forge Shop Sign.",
 tip:"🏆 HOME SWEET HOME + MASTER OF THE BLACKSMITHS' GUILD trophies. Sweep BOTH floors — the Old Machine Sketch only appears after sweeping the lower floor. The 200g guild trial fee is non-negotiable; you can retry for another 200g if you fail.",status:0,notes:""},
{id:"dlc2_2",r:"DLC2",tp:"Main Quest",o:2,name:"Magdalena's Axe",m:false,hm:false,t:false,b:false,l:false,
 desc:"Magdalena's first commission — repair her damaged axe. This serves as the tutorial for the blacksmithing system: heat the metal evenly in the furnace, hammer both sides at a steady rhythm, quench at the right colour. Aim for Gold quality. Completing this fully unlocks the forge as a usable workspace.",
 tip:"Heat evenly, hammer at a steady rhythm, flip the metal to hammer both sides. Quench when the colour is right. Gold quality is the target for commissions. The forge is in east Kuttenberg near Caslavska Gate.",status:0,notes:""},
{id:"dlc2_3",r:"DLC2",tp:"Main Quest",o:3,name:"The Master's Game",m:false,hm:false,t:false,b:false,l:false,
 desc:"Magdalena suggests socialising with guild masters through dice. Head to Boris of Brod's armoursmith shop in central Kuttenberg. Challenge him to dice (choose 'Without a badge' for lowest stakes). Win or lose, Boris gives Henry a tin badge. After this, the guild's repeatable activities (dice games, investigation tasks, commissions) unlock on the map — three per day.",
 tip:"Save before the dice game if you want to guarantee a win. Choosing 'Without a badge' means no badge wagered. You don't need to win — the quest completes either way after playing. Boris is near the central armoursmiths, not far from Town Hall.",status:0,notes:""},
{id:"dlc2_4",r:"DLC2",tp:"Main Quest",o:4,name:"Klaus' Introduction",m:false,hm:false,t:false,b:false,l:false,
 desc:"Boris tips Henry off that Guildmaster Klaus Eichner wants to meet. Find Klaus at his weaponsmith shop in central Kuttenberg. Tell him 'Martin raised you' for a reputation boost. Klaus says a guild wagon was ambushed on the Prague road and contracts stolen — Henry must recover them from a bandit camp west of Kuttenberg (Medium locked chest at the back). Return them to Klaus. He mentions Standa 'the Fly' — Martin's old journeyman friend — works at the Horschan mines, leading to Martin's Dream.",
 tip:"Say 'Martin raised me' when Klaus asks — honest and raises his opinion. After this quest all three guild daily activities rotate on the map. These build Prestige faster than standard commissions.",status:0,notes:""},
{id:"dlc2_5",r:"DLC2",tp:"Main Quest",o:5,name:"Martin's Dream",m:false,hm:false,t:false,b:false,l:false,
 desc:"Klaus tells Henry that Standa 'the Fly' works at the miners' camp north of the forge yard near Horschan. Find Standa at the camp — he owes money to a mine guard named Leech. Resolve the debt: pay it, beat Leech in a horse race, or persuade him. Standa gives Henry the 'heart' of Kuttenberg's astronomical clock — a mechanism Martin once repaired. Return it to the forge and place it on the planning desk table. This triggers Old Plans.",
 tip:"🏆 RACING THE LEECH TROPHY: Beat Leech in the horse race. Save before the race for reliability. You don't have to tell Standa the clock heart's significance — the quest completes once you place it on the desk.",status:0,notes:""},
{id:"dlc2_6",r:"DLC2",tp:"Main Quest",o:6,name:"Old Plans",m:false,hm:false,t:false,b:false,l:false,
 desc:"Old guild documents surface that threaten both the ownership of Martin's forge and several people connected to it. Henry must navigate guild politics to protect what Martin built. Having high Prestige from completed commissions and guild activities gives extra dialogue options.",
 tip:"Do as many guild commissions and daily activities as possible before this quest — high Prestige unlocks more favourable dialogue paths with the guild masters.",status:0,notes:""},
{id:"dlc2_7",r:"DLC2",tp:"Main Quest",o:7,name:"The Last Step",m:false,hm:false,t:false,b:false,l:false,
 desc:"The DLC's conclusion. The future of Martin's forge and Henry's place in the Blacksmiths' Guild is decided. The outcome depends on Henry's Prestige level accumulated through commissions and guild activities throughout the DLC.",
 tip:"🏆 MARTIN'S LEGACY TROPHY (Silver): Complete this quest. Do all guild activities before starting — your Prestige level affects available ending options.",status:0,notes:""},

// ── DLC3 — MYSTERIA ECCLESIAE (11 quests: 6 side quests + 5 tasks) ────────────
// ⚠ WARNING: Once you enter Sedletz Monastery you are LOCKED IN until the DLC ends.
// Bring: Torch, 10x Saviour Schnapps, high-Charisma outfit (25+), Lockpicks, Bandages, Merigold Decoctions.
// All 11 quests are classified as Side Quests / Tasks in journal (not Main Quests).
// Side Tasks are time-sensitive and disappear if you advance the story too far — explore thoroughly.
// Do NOT commit serious crimes inside the monastery before lockdown or you will be expelled and the DLC fails.
{id:"dlc3_1",r:"DLC3",tp:"Side Quest",o:1,name:"The Royal Physician",m:false,hm:false,t:false,b:false,l:false,req:"MQ13 — The Sword and the Quill",
 desc:"The Mysteria Ecclesiae DLC begins. In Suchdol, Henry meets Petr of Pisek, who asks him to accompany the renowned healer Albich of Uniczow (physician to King Wenceslas himself) on a visit to Sedletz Monastery. What starts as a routine escort becomes something far darker. Henry and Albich arrive at the monastery to find it gripped by a mysterious illness — and immediately suspect foul play. This quest takes you from Suchdol to Sedletz; all remaining quests take place entirely within the monastery grounds.",
 tip:"Startable after reaching Kuttenberg (main quest 13: The Sword and the Quill, second day). Recommended to finish the main game first for full story context. Speak to Petr of Pisek — look for the purple shield icon on the map in Suchdol. Stock up on supplies before entering; once you step inside Sedletz Monastery you cannot leave until the DLC concludes.",status:0,notes:""},
{id:"dlc3_2",r:"DLC3",tp:"Side Quest",o:2,name:"Anamnesis",m:false,hm:false,t:false,b:false,l:false,
 desc:"The DLC's second main quest, beginning immediately after The Royal Physician. Albich tasks Henry with investigating the connection between the sick monks — taking an anamnesis (medical history) from each patient in the infirmary. The investigation gradually reveals the outbreak is not natural. During this quest, the monastery enters lockdown. Henry also gains access to the library, meets the cat, and — at the end — must open a locked door to find Brother Vojtiech, a monk with a very unusual way of coping with the horrors around him.",
 tip:"🏆 SURVIVOR TROPHY: Behind the locked door at the end of this quest is Brother Vojtiech. During his dialogue, keep choosing 'Tell me another joke' until he runs out of jokes — all must be heard in a single conversation. Do not skip his dialogue. Also: interact with the library cat during the 'Speak with Librarian Crispin' objective (first of three interactions needed for the Feline Affection trophy).",status:0,notes:""},
{id:"dlc3_3",r:"DLC3",tp:"Task",o:3,name:"Maddening Pain",m:true,hm:false,t:false,b:false,l:false,
 desc:"A missable task that opens immediately after you first speak to Albich in the infirmary during Anamnesis. A young woman named Maddie is waiting just outside the infirmary entrance — she has severe stomach pain and is frightened to go inside. If you speak to her, she asks for help. Return to Albich and ask him 'How can I help Maddie?' to receive the Anti-Inflammatory Potion recipe. Brew it and give it to her. Do NOT try to diagnose her yourself or choose wrong dialogue — the quest fails if you don't get the recipe from Albich.",
 tip:"🔴 MISSABLE: You must speak to Maddie outside the infirmary immediately after talking to Albich for the first time. If you advance too far in Anamnesis without doing this, she disappears and the quest is gone. Also counts toward the Do Good to All People trophy (help 3 people in the monastery). Interact with the library cat a second time during this task window — needed for Feline Affection.",status:0,notes:""},
{id:"dlc3_4",r:"DLC3",tp:"Task",o:4,name:"Prevention",m:true,hm:false,t:false,b:false,l:false,
